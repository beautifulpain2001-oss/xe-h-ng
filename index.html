<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xếp ống giấy lên xe</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1c2630;--mut:#5d6b78;--line:#d7dde3;--pri:#1f6feb;--err:#b42318;--warn:#8a5a00;--ok:#1a6b3a}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#12324f;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
nav{display:flex;gap:4px}
.tabbtn{background:transparent;color:#cfe0f0;border:0;padding:8px 14px;border-radius:6px 6px 0 0;cursor:pointer;font-size:14px}
.tabbtn.active{background:var(--bg);color:var(--ink);font-weight:600}
main{padding:16px 20px;max-width:1500px;margin:0 auto}
.toolbar,.packbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.spacer{flex:1}
button,select,input[type=text]{font:inherit}
button{padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer}
button:hover{background:#eef3f8}
button.primary{background:var(--pri);border-color:var(--pri);color:#fff}
button.primary:hover{background:#1559c1}
button.primary:disabled{background:#9db8e6;border-color:#9db8e6;cursor:not-allowed}
button.danger{color:var(--err)}
select,input[type=text]{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}
label.inline{color:var(--mut)}
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:auto}
.tablewrap.tall{max-height:340px}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;border-bottom:1px solid #eaeef2;text-align:left;vertical-align:top}
th{background:#f0f3f6;font-weight:600;position:sticky;top:0;white-space:nowrap}
td.num{text-align:right;white-space:nowrap}
td.actions{white-space:nowrap}
td.actions button{padding:3px 8px;margin-right:4px}
tr[data-uid]{cursor:pointer}
tr.sel{background:#fde8e6}
.sub{color:var(--mut);font-size:12px}
.tag{padding:2px 8px;border-radius:10px;font-size:12px}
.tag.ok{background:#dcf3e4;color:var(--ok)}.tag.warn{background:#fff0cc;color:var(--warn)}.tag.err{background:#fde1de;color:var(--err)}
.notes{margin-top:10px}
.note{padding:6px 10px;border-radius:6px;margin:4px 0;font-size:13px}
.note.err{background:#fde8e6;color:var(--err)}.note.warn{background:#fff6dd;color:var(--warn)}.note.ok{background:#e8f5ec;color:var(--ok)}
.hint{color:var(--mut);font-size:12px}.warnText{color:var(--warn)}
.empty{padding:30px;text-align:center;color:var(--mut);background:var(--card);border:1px dashed var(--line);border-radius:8px}
dialog{border:0;border-radius:10px;padding:18px 22px;width:min(860px,96vw);max-height:92vh;overflow:auto;box-shadow:0 10px 40px #0005}
dialog::backdrop{background:#0006}
dialog h2{margin:0 0 8px;font-size:18px}dialog h3{margin:14px 0 6px;font-size:14px;color:#12324f}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 12px}
label.f{display:flex;flex-direction:column;gap:2px}
label.f span{font-size:12px;color:var(--mut)}
label.f small{font-size:11px;color:var(--mut)}
label.f.check{flex-direction:row;align-items:center;gap:8px;padding-top:18px}
label.f.check span{font-size:13px;color:var(--ink)}
.dlgfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.packmain{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,1fr);gap:14px;align-items:start}
.canvas{height:480px;background:#f4f6f8;border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative}
.canvas canvas{display:block}
.viewtools{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0;font-size:12px}
.lg i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;border:1px solid #0003}
.lg i.dot{background:#d62728;border-radius:50%}.lg i.ring{background:#fff;border:3px solid #1f77b4;border-radius:50%}
.lg i.gradient{width:40px;background:linear-gradient(90deg,hsl(216,70%,50%),hsl(108,70%,50%),hsl(0,70%,50%))}
.pickinfo{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:44px;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.ct{font-size:12px;color:var(--mut)}.cb{font-size:22px;font-weight:700}.cs{font-size:12px;color:var(--mut)}
h3,h4{margin:12px 0 6px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#12324f;color:#fff;padding:8px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (max-width:900px){.packmain{grid-template-columns:1fr}.canvas{height:340px}main{padding:10px}}
.player{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.player button.on{background:#12324f;color:#fff;border-color:#12324f}
.animlabel{position:absolute;left:8px;right:8px;top:8px;background:#ffffffe6;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;z-index:2}
.filters{display:flex;flex-direction:column;gap:4px;margin:6px 0}
.fgroup{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px}
.slider input{width:110px;vertical-align:middle}
.cogbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0;font-size:13px}
.lg i.free{background:#2ca02c55}
tr.relaxed td{background:#fff3e0}
/* GĐ3: đơn hàng và kế hoạch chuyến */
.tall2{max-height:420px;overflow:auto}
.notesbox,.depot{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:10px 0}
.notesbox summary,.depot summary{cursor:pointer;font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin:8px 0}
label.inline{display:inline-flex;gap:6px;align-items:center}
.mapbox{height:300px;border:1px solid var(--line);border-radius:8px;margin:8px 0}
.cpanel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:10px 0}
.cpanel h3{margin:4px 0 8px}
.cards4{grid-template-columns:repeat(4,1fr)}
@media(max-width:800px){.cards4{grid-template-columns:repeat(2,1fr)}}
.card .big{font-size:20px;font-weight:700}
.trip{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:12px 0}
.trip h3{margin:4px 0}
progress{width:260px}
/* GĐ4 */
.dragrow{cursor:grab}.dragrow:active{cursor:grabbing}
.trip.dropping,.newtrip.dropping{outline:2px dashed var(--accent,#2f6fed);background:#eef3ff}
.newtrip{border:2px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--mut);margin:12px 0}
td.bestcell{background:#dcf3e4;font-weight:700}
.sessionbtns{margin-left:auto;display:flex;gap:8px}.sess{background:#2a5a86;color:#fff;border:0;border-radius:6px;padding:6px 12px;cursor:pointer}.sess:hover{background:#3a6d9c}

</style>

<body>
<header>
  <h1>Xếp ống giấy lên xe</h1>
  <nav>
    <button class="tabbtn active" data-tab="products">1. Sản phẩm</button>
    <button class="tabbtn" data-tab="vehicles">2. Xe</button>
    <button class="tabbtn" data-tab="pack">3. Xếp thử một xe</button>
    <button class="tabbtn" data-tab="orders">4. Đơn hàng</button>

  </nav>
</header>
<main>
  <section class="tab" id="tab-products"></section>
  <section class="tab" id="tab-vehicles" hidden></section>
  <section class="tab" id="tab-pack" hidden></section>
  <section class="tab" id="tab-orders" hidden></section>
  <section class="tab" id="tab-trips" hidden></section>
</main>
<dialog id="dlg"></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<!-- Mô hình dữ liệu + bộ giải: cũng được nạp vào Web Worker -->
<script id="pure-src">
/* MÔ HÌNH DỮ LIỆU: tạo đối tượng mặc định, đổi đơn vị, kiểm tra dữ liệu nhập.
 * Nội bộ luôn dùng mm và kg. Giá trị người dùng nhập được giữ nguyên (kèm đơn vị);
 * chỉ quy đổi khi tính toán. Không phụ thuộc trình duyệt nên kiểm thử được bằng Node. */
const Model = (function () {
  const UNIT_MM = { mm: 1, cm: 10, m: 1000 };
  let seq = 0;

  function uid(prefix) {
    seq += 1;
    return prefix + Date.now().toString(36) + seq.toString(36) + Math.floor(Math.random() * 1296).toString(36);
  }

  // Chấp nhận cả dấu phẩy thập phân kiểu Việt Nam ("1,5"). Trả NaN nếu rỗng hoặc sai.
  function num(v) {
    if (typeof v === 'number') return isFinite(v) ? v : NaN;
    if (v === null || v === undefined) return NaN;
    const s = String(v).trim().replace(/\s/g, '').replace(',', '.');
    if (s === '') return NaN;
    const x = Number(s);
    return isFinite(x) ? x : NaN;
  }

  function defaultSettings() {
    return {
      density: 750,      // kg/m3, tỷ trọng giấy ước tính
      gap: 0,            // mm, khe hở giữa các khối khi xếp lên xe
      looseMaxH: 1000,   // mm, chiều cao tối đa một khối ống rời
      looseWidth: 1200,  // mm, chiều rộng tối đa một khối ống rời
      roadFactor: 1.3,   // hệ số đường: quãng đường thực ≈ đường chim bay × hệ số (ước tính)
      matrixText: '',    // khoảng cách nhập tay, mỗi dòng "khu vực A, khu vực B, km"
    };
  }

  function defaultDepot() {
    return { name: 'Kho / nhà máy', address: '', lat: '', lng: '', region: '' };
  }

  function newOrder(o) {
    return Object.assign({
      id: uid('o'), no: '', customer: '', address: '', lat: '', lng: '', region: '',
      date: '', from: '', to: '', note: '', include: true, pickup: false, lines: [],
    }, o || {});
  }

  function normText(s) {
    return String(s === undefined || s === null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase().trim();
  }

  // Vị trí giao của đơn: có tọa độ thì khóa theo tọa độ, không thì theo tên khách (mỗi khách một điểm).
  function orderLoc(o) {
    const lat = num(o.lat), lng = num(o.lng);
    const loc = { region: String(o.region || '').trim(), address: String(o.address || '').trim() };
    if (isFinite(lat) && isFinite(lng)) {
      loc.lat = lat; loc.lng = lng;
      loc.key = 'll:' + lat.toFixed(4) + ',' + lng.toFixed(4);
    } else {
      loc.key = 'c:' + normText(o.customer || o.id);
    }
    return loc;
  }

  function validateOrder(o) {
    const errors = [], warnings = [];
    if (!String(o.customer || '').trim()) errors.push('Chưa nhập tên khách hàng.');
    const la = String(o.lat).trim(), lo = String(o.lng).trim();
    if (la !== '' || lo !== '') {
      const lat = num(o.lat), lng = num(o.lng);
      if (!isFinite(lat) || !isFinite(lng)) errors.push('Tọa độ phải nhập đủ cả vĩ độ và kinh độ bằng số (ví dụ 21,18 và 106,07).');
      else if (lat < -90 || lat > 90 || lng < -180 || lng > 180) errors.push('Tọa độ ngoài phạm vi hợp lệ. Vĩ độ từ -90 đến 90, kinh độ từ -180 đến 180. Có thể bạn nhập ngược vĩ độ và kinh độ.');
      else if (lat > 30 || lat < 5 || lng < 95 || lng > 115) warnings.push('Tọa độ nằm ngoài khu vực Việt Nam. Kiểm tra lại có nhập ngược vĩ độ và kinh độ không.');
    } else if (!String(o.region || '').trim()) {
      warnings.push('Chưa có tọa độ hoặc khu vực: khoảng cách đến đơn này chỉ là ước tính.');
    }
    if (!(o.lines && o.lines.length)) errors.push('Đơn chưa có dòng hàng nào.');
    (o.lines || []).forEach(function (l, i) {
      const q = num(l.qty);
      if (!String(l.code || '').trim()) errors.push('Dòng hàng ' + (i + 1) + ' chưa chọn mã hàng.');
      if (!(q >= 1) || Math.floor(q) !== q) errors.push('Dòng hàng ' + (i + 1) + ': số lượng ống phải là số nguyên từ 1 trở lên.');
    });
    return { errors: errors, warnings: warnings };
  }

  // Phân tích khoảng cách nhập tay: mỗi dòng "A, B, km". Trả {list, errors}.
  function parseMatrix(text) {
    const list = [], errors = [];
    String(text || '').split(/\r?\n/).forEach(function (line, i) {
      if (!line.trim()) return;
      const m = line.match(/^([^,;\t]+)[,;\t]([^,;\t]+)[,;\t](.+)$/);
      const km = m ? num(m[3]) : NaN;
      if (!m || !m[1].trim() || !m[2].trim() || !(km >= 0)) errors.push('Dòng ' + (i + 1) + ' không đúng dạng "khu vực A, khu vực B, km": ' + line.trim());
      else list.push({ a: m[1].trim(), b: m[2].trim(), km: km });
    });
    return { list: list, errors: errors };
  }

  function newProduct(o) {
    return Object.assign({
      id: uid('p'), code: '', name: '', customer: '', qty: '',
      unit: 'mm', L: '', sizeMode: 'radius', size: '',
      weightMode: 'thickness', T: '', kg: '',
      orient: 'stand', stackable: false, maxTiers: 2, maxLoad: 500, nestable: false, stop: '', auto: false, guess: '',
      packType: 'pallet', perUnit: '',
      palL: 1200, palW: 1000, palH: 150, palKg: 20, maxH: 1800,
      bunL: '', bunW: '', bunH: '', bunKg: 0,
    }, o || {});
  }

  function newVehicle(o) {
    return Object.assign({
      id: uid('v'), name: '', unit: 'mm', mode: 'dims',
      L: '', W: '', H: '', volume: '', rL: 3, rW: 1, rH: 1,
      payload: '', cost: '', maxCount: '',
    }, o || {});
  }

  /* Kiểm tra và quy đổi một dòng hàng. Trả {errors, warnings, n}; n = giá trị đã quy đổi (mm, kg). */
  function prepareProduct(p, settings) {
    const errors = [];
    const warnings = [];
    const f = UNIT_MM[p.unit];
    const n = { id: p.id, code: p.code, name: p.name, customer: p.customer || '' };

    if (!String(p.code || '').trim() && !String(p.name || '').trim()) {
      errors.push('Chưa nhập mã hàng hoặc tên hàng. Hãy nhập ít nhất một trong hai.');
    }
    if (!f) errors.push('Đơn vị kích thước không hợp lệ. Chọn mm, cm hoặc m.');

    n.qty = num(p.qty);
    if (!(n.qty >= 1) || Math.floor(n.qty) !== n.qty) {
      errors.push('Số lượng ống phải là số nguyên từ 1 trở lên.');
    }

    const L = num(p.L) * (f || NaN);
    if (!(L > 0)) errors.push('Thiếu hoặc sai chiều dài ống. Nhập số lớn hơn 0.');
    n.L = L;

    const size = num(p.size) * (f || NaN);
    if (!(size > 0)) {
      errors.push('Thiếu hoặc sai ' + (p.sizeMode === 'diameter' ? 'đường kính' : 'bán kính') + ' ống. Nhập số lớn hơn 0.');
    }
    n.R = p.sizeMode === 'diameter' ? size / 2 : size;

    if (n.R > 0 && L > 0) {
      if (n.R > 1500) warnings.push('Bán kính ống rất lớn (' + n.R + ' mm). Kiểm tra lại đơn vị và nhãn bán kính/đường kính.');
      if (L < 5) warnings.push('Chiều dài ống rất nhỏ (' + L + ' mm). Kiểm tra lại đơn vị.');
      if (L > 12000) warnings.push('Chiều dài ống lớn hơn 12 m (' + L + ' mm). Kiểm tra lại đơn vị.');
    }

    n.kgEstimated = p.weightMode !== 'kg';
    if (p.weightMode === 'kg') {
      n.tubeKg = num(p.kg);
      if (!(n.tubeKg > 0)) errors.push('Thiếu khối lượng kg/ống. Nhập số lớn hơn 0, hoặc đổi sang cách nhập độ dày thành ống.');
      n.T = NaN;
    } else {
      n.T = num(p.T) * (f || NaN);
      const rho = num(settings.density);
      if (!(n.T > 0)) {
        errors.push('Thiếu độ dày thành ống. Nhập số lớn hơn 0, hoặc đổi sang cách nhập khối lượng kg/ống.');
      } else if (n.R > 0 && n.T >= n.R) {
        errors.push('Độ dày thành ống phải nhỏ hơn bán kính ngoài (độ dày ' + n.T + ' mm, bán kính ' + n.R + ' mm). Kiểm tra đơn vị hoặc nhãn bán kính/đường kính.');
      }
      if (!(rho > 0)) errors.push('Tỷ trọng giấy phải lớn hơn 0 (đặt ở mục Thiết lập chung).');
      if (!errors.length) {
        const r = n.R - n.T;
        n.tubeKg = Math.PI * (n.R * n.R - r * r) * n.L * 1e-9 * rho;
      }
    }

    n.orient = p.orient === 'lay' ? 'lay' : 'stand';
    n.stackable = !!p.stackable;
    n.maxTiers = n.stackable ? Math.floor(num(p.maxTiers)) : 1;
    if (n.stackable && !(n.maxTiers >= 2)) errors.push('Số tầng chồng tối đa phải là số nguyên từ 2 trở lên (hoặc bỏ chọn "cho phép xếp chồng").');
    n.maxLoad = 0;
    if (n.stackable) {
      n.maxLoad = num(p.maxLoad);
      if (!(n.maxLoad > 0)) errors.push('Tải chịu nén tối đa (kg đè lên trên mỗi khối) phải lớn hơn 0.');
    }
    n.stop = null;
    if (p.stop !== undefined && String(p.stop).trim() !== '') {
      n.stop = num(p.stop);
      if (!(n.stop >= 1) || Math.floor(n.stop) !== n.stop) { errors.push('Thứ tự điểm giao phải là số nguyên từ 1 trở lên (1 = giao đầu tiên), hoặc để trống.'); n.stop = null; }
    }
    n.nestable = !!p.nestable;
    if (n.nestable) warnings.push('Tính năng lồng ống sẽ có ở giai đoạn 2; hiện tại hệ thống chưa lồng ống khi tính.');

    n.packType = p.packType;
    if (['pallet', 'bundle', 'loose'].indexOf(p.packType) < 0) errors.push('Chọn kiểu đóng gói: xếp pallet, đóng kiện hoặc rời.');
    if (p.packType === 'pallet' || p.packType === 'bundle') {
      n.perUnit = num(p.perUnit);
      if (!(n.perUnit >= 1) || Math.floor(n.perUnit) !== n.perUnit) {
        errors.push('Số ống mỗi ' + (p.packType === 'pallet' ? 'pallet' : 'kiện') + ' phải là số nguyên từ 1 trở lên.');
      }
    }
    if (p.packType === 'pallet') {
      n.palL = num(p.palL); n.palW = num(p.palW); n.palH = num(p.palH); n.palKg = num(p.palKg); n.maxH = num(p.maxH);
      if (!(n.palL > 0) || !(n.palW > 0)) errors.push('Kích thước pallet (dài, rộng) phải lớn hơn 0 mm.');
      if (!(n.palH >= 0)) errors.push('Chiều cao phần pallet gỗ không được âm (nhập 0 nếu không có pallet).');
      if (!(n.palKg >= 0)) errors.push('Khối lượng pallet gỗ không được âm.');
      if (!(n.maxH > n.palH)) errors.push('Chiều cao tối đa của khối hàng trên pallet phải lớn hơn chiều cao pallet gỗ.');
      if (n.orient === 'stand' && n.maxH > n.palH && n.L > n.maxH - n.palH) {

    // 2: dựng tường từ đầu thùng ra cửa (đầu thùng → thấp → ngang), hợp với nhiều điểm giao và hàng chồng được.
    const scoreOf = [
      function (p) { return p.z * 1e9 + p.x * 1e4 + p.y; },
      function (p) { return p.z * 1e9 + p.y * 1e4 + p.x; },
      function (p) { return p.x * 1e9 + p.z * 1e4 + p.y; },
    ][cfg.score || 0];

    // Điểm số chỉ phụ thuộc vị trí, nên duyệt điểm cực theo điểm số tăng dần và dừng ở vị trí hợp lệ đầu tiên.
    function find(u, strict) {
      const sorted = pts.slice().sort(function (a, b) { return scoreOf(a) - scoreOf(b); });
      for (let k = 0; k < sorted.length; k++) {
        const p = sorted[k];
        for (let ri = 0; ri < 2; ri++) {
          const r = rots[ri];
          if (r === 1 && Math.abs(u.l - u.w) < EPS) continue;
          const rl = r ? u.w : u.l, rw = r ? u.l : u.w;
          const gl = rl + gap, gw = rw + gap;
          if (p.x + gl > V.L + gap + EPS || p.y + gw > V.W + gap + EPS || p.z + u.h > V.H + EPS) continue;
          const cand = { x: p.x, y: p.y, z: p.z, gl: gl, gw: gw, h: u.h, u: u };
          let ok = true, support = 0, tier = 1, tierCap = u.stackable ? u.maxTiers : 99;
          const sup = [];
          for (let i = 0; i < placed.length; i++) {
            const b = placed[i];
            const ox = Math.min(p.x + gl, b.x + b.gl) - Math.max(p.x, b.x);
            const oy = Math.min(p.y + gw, b.y + b.gw) - Math.max(p.y, b.y);
            if (ox > EPS && oy > EPS) {
              const oz = Math.min(p.z + u.h, b.z + b.h) - Math.max(p.z, b.z);
              if (oz > EPS) { ok = false; break; }
              if (Math.abs(b.z + b.h - p.z) < 0.5) {
                if (!b.u.stackable) { ok = false; break; }
                support += ox * oy;
                sup.push(b);
                tier = Math.max(tier, b.tier + 1);
                tierCap = Math.min(tierCap, b.u.maxTiers);
                if (strict && u.weight > b.u.weight * HEAVY_ON_LIGHT + EPS) { ok = false; break; }
              }
            }
            if (strict && blocksIllegally(b, cand)) { ok = false; break; }
          }
          if (!ok) continue;
          if (p.z > EPS && (support < SUPPORT_MIN * gl * gw - EPS || tier > tierCap)) continue;
          let loadFine = true;
          for (let i = 0; i < sup.length && loadFine; i++) loadFine = loadOk(sup[i], u.weight, new Set());
          if (!loadFine) continue;
          return { p: p, r: r, rl: rl, rw: rw, gl: gl, gw: gw, tier: tier, sup: sup };
        }
      }
      return null;
    }

    order.forEach(function (u) {
      if (wsum + u.weight > payload + EPS) { unplaced.push({ unit: u, reason: 'weight' }); return; }
      let best = find(u, true);
      let relaxed = false;
      if (!best && cfg.relax) { best = find(u, false); relaxed = !!best; }
      if (!best) { unplaced.push({ unit: u, reason: 'space' }); return; }
      const box = { u: u, x: best.p.x, y: best.p.y, z: best.p.z, l: best.rl, w: best.rw, h: u.h, gl: best.gl, gw: best.gw, rot: best.r, tier: best.tier, below: best.sup, loadAbove: 0, relaxed: relaxed };
      placed.push(box);
      best.sup.forEach(function (b) { addLoad(b, u.weight, new Set()); });
      wsum += u.weight;
      const seen = new Set();
      const next = [];
      const push = function (q) {
        const key = Math.round(q.x * 10) + '|' + Math.round(q.y * 10) + '|' + Math.round(q.z * 10);
        if (!seen.has(key)) { seen.add(key); next.push(q); }
      };
      pts.forEach(function (q) { if (q !== best.p) push(q); });
      push({ x: box.x + box.gl, y: box.y, z: box.z });
      push({ x: box.x, y: box.y + box.gw, z: box.z });
      push({ x: box.x, y: box.y, z: box.z + box.h });
      pts = next.filter(function (q) {
        return !(q.x > box.x + EPS && q.x < box.x + box.gl - EPS && q.y > box.y + EPS && q.y < box.y + box.gw - EPS && q.z > box.z - EPS && q.z < box.z + box.h - EPS);

    });

  }

  function unloadViolations(placed) {

    for (let i = 0; i < placed.length; i++) {
      for (let j = 0; j < placed.length; j++) {
        if (i === j) continue;
        const a = placed[i], b = placed[j];
        if (b.u.stop > a.u.stop && blocksIllegally(a, b)) {
          const key = a.u.stop + '|' + b.u.stop;
          if (!pairs.has(key)) pairs.set(key, { early: a.u.stop, late: b.u.stop, count: 0, uids: [] });
          const v = pairs.get(key);
          v.count++;
          v.uids.push(a.u.id, b.u.id);
        }
      }
    }
    return Array.from(pairs.values());
  }

  function packVehicle(units, veh, opts) {
    opts = opts || {};
    const gap = opts.gap || 0;
    const V = { L: veh.L, W: veh.W, H: veh.H };
    const payload = veh.payload;
    const unplaced = [];
    const cand = [];
    units.forEach(function (u) {
      const fits = u.h <= V.H + EPS && ((u.l <= V.L + EPS && u.w <= V.W + EPS) || (u.w <= V.L + EPS && u.l <= V.W + EPS));
      if (!fits) {
        const why = u.h > V.H + EPS
          ? 'Cao ' + Math.round(u.h) + ' mm, cao hơn lòng thùng xe (' + Math.round(V.H) + ' mm).'
          : 'Kích thước ' + Math.round(u.l) + ' × ' + Math.round(u.w) + ' mm, không nằm lọt sàn xe (' + Math.round(V.L) + ' × ' + Math.round(V.W) + ' mm).';
        unplaced.push({ unit: u, reason: why });
      } else if (u.weight > payload + EPS) {

    // Phương án vi phạm bị trừ điểm nặng nên chỉ được chọn khi chở được nhiều hơn hẳn, và luôn có cảnh báo.

    });

    const budget = opts.quick ? 4 : cand.length > 400 ? 6 : cand.length > 200 ? 12 : runs.length;
    const totalVol = V.L * V.W * V.H;
    let best = null;
    const chosen = runs.filter(function (cf) { return !cf.late; }).slice(0, budget).concat(runs.filter(function (cf) { return cf.late; }));
    chosen.forEach(function (cf, idx) {
      const r = runOrder(cf.order, V, payload, { gap: gap, rotFirst: cf.rotFirst, score: cf.score, relax: true });
      const v = r.placed.reduce(function (s, b) { return s + b.l * b.w * b.h; }, 0);
      const relaxedCount = r.placed.filter(function (b) { return b.relaxed; }).length;
      const m = vehicleMetrics(r.placed, V, payload);
      let q = v - relaxedCount * 0.05 * totalVol;
      if (m.warnings.length) q -= 0.002 * totalVol; // cảnh báo trọng tâm chỉ là tiêu chí phụ: chở thêm được hàng quan trọng hơn
      if (!best || q > best.q + EPS) best = { r: r, q: q };
      if (opts.onProgress) opts.onProgress((idx + 1) / chosen.length);
    });
    const r = best ? best.r : { placed: [], unplaced: [], weight: 0 };
    r.unplaced.forEach(function (x) {
      unplaced.push({ unit: x.unit, reason: x.reason === 'weight' ? 'Thêm vào sẽ vượt tải trọng xe (' + payload + ' kg).' : 'Hết chỗ trong thùng xe (hoặc không còn chỗ đỡ / chịu nén phù hợp).' });
    });

    const placements = r.placed.map(function (b, i) {
      return { uid: b.u.id, seq: i + 1, x: b.x, y: b.y, z: b.z, l: b.l, w: b.w, h: b.h, rot: b.rot, tier: b.tier, loadAbove: b.loadAbove, relaxed: b.relaxed };
    });
    const metrics = vehicleMetrics(r.placed, V, payload);
    const viol = unloadViolations(r.placed);
    viol.forEach(function (v) {
      metrics.warnings.unshift('Vi phạm thứ tự dỡ hàng: ' + v.count + ' trường hợp hàng điểm giao ' + v.late + ' chặn hàng điểm giao ' + v.early + ' (phải dời hàng điểm ' + v.late + ' mới dỡ được điểm ' + v.early + ').');
    });
    const heavy = r.placed.filter(function (b) { return b.below.some(function (s) { return b.u.weight > s.u.weight * HEAVY_ON_LIGHT + EPS; }); }).length;
    if (heavy) metrics.warnings.push(heavy + ' khối nặng đang đặt trên khối nhẹ hơn (không còn cách xếp khác). Kiểm tra lại khi chất hàng.');
    metrics.unloadViolations = viol;
    // Thứ tự chất thực tế: điểm giao sau trước, từ đầu thùng ra cửa, từ dưới lên.

      const ua = byIdOf(r.placed, a.uid), ub = byIdOf(r.placed, b.uid);

    }).map(function (p) { return p.uid; });
    const extra = opts.estimateExtra === false ? [] : estimateExtra(r.placed, V, payload, gap, units);
    return { placements: placements, loadOrder: loadOrder, unplaced: unplaced, metrics: metrics, warnings: metrics.warnings, extra: extra };
  }

  function byIdOf(placed, uid) {
    for (let i = 0; i < placed.length; i++) if (placed[i].u.id === uid) return placed[i].u;
    return null;
  }

  // Ước tính chỗ trống còn chứa thêm được bao nhiêu khối của mỗi loại (thử xếp thêm bản sao khối đầy đầu tiên).
  function estimateExtra(placed, V, payload, gap, units) {
    const protos = new Map();
    units.forEach(function (u) { if (!protos.has(u.pid) || (protos.get(u.pid).partial && !u.partial)) protos.set(u.pid, u); });
    const out = [];
    protos.forEach(function (u) {
      const copies = [];
      for (let i = 0; i < 60; i++) copies.push(Object.assign({}, u, { id: u.id + '~' + i, stop: null }));
      const r = runOrder(copies, V, payload, { gap: gap, init: placed });
      const n = r.placed.length - placed.length;
      if (n > 0) out.push({ pid: u.pid, code: u.code || u.name, kind: u.kind, count: n, limitedBy: r.unplaced.some(function (x) { return x.reason === 'weight'; }) ? 'tải trọng' : 'thể tích' });
    });
    return out;
  }

  function vehicleMetrics(placed, V, payload) {
    let vol = 0, wt = 0, cx = 0, cy = 0, cz = 0, maxX = 0;
    placed.forEach(function (b) {
      vol += b.l * b.w * b.h;
      const w = b.u.weight;
      wt += w; cx += w * (b.x + b.l / 2); cy += w * (b.y + b.w / 2); cz += w * (b.z + b.h / 2);
      maxX = Math.max(maxX, b.x + b.l);
    });
    const m = {
      volumePct: (vol / (V.L * V.W * V.H)) * 100,
      weightPct: (wt / payload) * 100,
      weightKg: wt, count: placed.length, volumeM3: vol / 1e9,
      freeLength: V.L - maxX,
      cog: wt > 0 ? { x: cx / wt, y: cy / wt, z: cz / wt } : null,
      warnings: [],
    };
    if (m.cog) {
      m.cogOffX = (m.cog.x - V.L / 2) / V.L;
      m.cogOffY = (m.cog.y - V.W / 2) / V.W;
      if (Math.abs(m.cogOffY) > 0.10) m.warnings.push('Trọng tâm lệch ' + (m.cogOffY > 0 ? 'trái' : 'phải') + ' (nhìn từ cửa sau) ' + Math.abs(m.cogOffY * 100).toFixed(1).replace('.', ',') + '% chiều rộng thùng (ngưỡng cảnh báo 10%).');
      if (Math.abs(m.cogOffX) > 0.15) m.warnings.push('Trọng tâm lệch về ' + (m.cogOffX > 0 ? 'phía cửa sau' : 'phía đầu thùng') + ' ' + Math.abs(m.cogOffX * 100).toFixed(1).replace('.', ',') + '% chiều dài thùng (ngưỡng cảnh báo 15%).');
    }
    return m;
  }

  /* Kiểm tra độc lập một kết quả xếp: trả danh sách lỗi (rỗng là hợp lệ). Dùng trong kiểm thử. */
  function verifyPlacement(placements, unitsById, veh, gap) {
    const errs = [];
    gap = gap || 0;
    placements.forEach(function (a, i) {
      if (a.x < -EPS || a.y < -EPS || a.z < -EPS || a.x + a.l > veh.L + EPS || a.y + a.w > veh.W + EPS || a.z + a.h > veh.H + EPS) errs.push('ngoài thùng: ' + a.uid);
      for (let j = i + 1; j < placements.length; j++) {
        const b = placements[j];
        if (Math.min(a.x + a.l, b.x + b.l) - Math.max(a.x, b.x) > EPS &&
            Math.min(a.y + a.w, b.y + b.w) - Math.max(a.y, b.y) > EPS &&
            Math.min(a.z + a.h, b.z + b.h) - Math.max(a.z, b.z) > EPS) errs.push('chồng lấn: ' + a.uid + ' và ' + b.uid);
      }
    });
    const total = placements.reduce(function (s, p) { return s + unitsById[p.uid].weight; }, 0);
    if (total > veh.payload + EPS) errs.push('vượt tải trọng');
    return errs;
  }

  const api = {
    analyzeProduct: analyzeProduct, layoutInfo: layoutInfo, tubePositions: tubePositions,
    bestStandLayer: bestStandLayer, packVehicle: packVehicle, verifyPlacement: verifyPlacement, unloadViolations: unloadViolations,
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  return api;
})();

/* BỘ GOM ĐƠN VÀ CHỌN XE: chia các đơn thành chuyến, chọn loại xe, sắp thứ tự giao, rồi kiểm tra xếp được thật bằng Solver.
 * Không dùng DOM nên chạy được trong Web Worker và Node.
 *
 * Quy trình: (1) tách đơn quá lớn; (2) ghép đơn bắt buộc đi chung; (3) gom bằng thuật toán savings (Clarke–Wright) theo mục tiêu;
 * (4) với mỗi chuyến chọn xe nhỏ/rẻ nhất xếp được thật, sửa chuyến không xếp vừa; (5) cải thiện cục bộ (ghép chuyến, chuyển đơn)
 * trong giới hạn thời gian, có thể dừng giữa chừng và lấy phương án tốt nhất hiện có; (6) xếp lần cuối ở chất lượng cao. */
const Planner = (function () {
  const S = (typeof Solver !== 'undefined') ? Solver : require('./solver.js');
  const FALLBACK_KM = 60;
  const SAME_REGION_KM = 5;
  const PROXY_FILL = 0.92;   // ước lượng sơ bộ: xe đầy tối đa 92% thể tích bao khối
  const EPS = 1e-6;

  const isNum = function (v) { return typeof v === 'number' && isFinite(v); };
  const fkm = function (x) { return x.toLocaleString('vi-VN', { maximumFractionDigits: 1 }) + ' km'; };
  const fpct = function (x) { return x.toLocaleString('vi-VN', { maximumFractionDigits: 0 }) + '%'; };

  function haversine(a, b) {
    const R = 6371, rad = Math.PI / 180;
    const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
    const h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);

  function makeDistance(settings, flags) {
    const rf = settings.roadFactor > 0 ? settings.roadFactor : 1.3;
    const matrix = new Map();
    (settings.matrix || []).forEach(function (m) { matrix.set(m.a + '|' + m.b, m.km); matrix.set(m.b + '|' + m.a, m.km); });

      if (memo.has(k)) return memo.get(k);

      else if (isNum(p.lat) && isNum(p.lng) && isNum(q.lat) && isNum(q.lng)) d = haversine(p, q) * rf;
      else if (p.region && q.region && p.region === q.region) d = SAME_REGION_KM;

    const warnings = [];
    const unassigned = [];
    const bySize = vehicles.slice().sort(function (a, b) { return a.volume - b.volume; });
    const biggest = bySize[bySize.length - 1];
    const costKnown = vehicles.length > 0 && vehicles.every(function (v) { return isNum(v.cost); });
    const cons = input.constraints || [];
    const nameOf = {};
    input.orders.forEach(function (o) { nameOf[o.id] = o.name || o.customer || o.id; });
    const log = [];
    const reasonsOf = new Map(); // entity id -> lời giải thích gắn với chuyến chứa nó

    if (!vehicles.length) return { trips: [], unassigned: input.orders.map(function (o) { return { orderId: o.id, name: nameOf[o.id], reason: 'Chưa chọn loại xe nào để dùng.' }; }), warnings: ['Chưa chọn loại xe nào để dùng.'], totals: null, estimatedDistance: false };

    /* --- Thực thể gom: mỗi đơn là một thực thể (đơn lớn có thể tách thành nhiều phần) --- */
    let entities = [];
    input.orders.forEach(function (o) {
      entities.push({ id: o.id, members: [o.id], name: nameOf[o.id], locs: [o.loc], units: o.units.map(function (u) { return Object.assign({}, u, { locKey: o.loc.key }); }), notes: [] });
    });

    const packCache = new Map();
    function packRoute(units, veh, quick) {
      const key = veh.id + '|' + units.map(function (u) { return u.id + ':' + u.stop; }).join(',') + '|' + (quick ? 'q' : 'f');
      if (packCache.has(key)) return packCache.get(key);
      const r = S.packVehicle(units, veh, { gap: gap, quick: quick, estimateExtra: !quick });
      if (packCache.size > 4000) packCache.clear();
      packCache.set(key, r);
      return r;
    }

    // Tách một thực thể thành các phần, mỗi phần xếp vừa một xe lớn nhất. Trả {parts, rest (khối không xếp lọt)}.
    function splitEntity(e) {
      let rest = e.units.slice(), k = 0;
      const parts = [];
      for (let guard = 0; rest.length && guard < 60; guard++) {
        const r = packRoute(rest.map(function (u) { return Object.assign({}, u, { stop: null }); }), biggest, true);
        const placedIds = new Set(r.placements.map(function (p) { return p.uid; }));
        if (!placedIds.size) break;
        k++;
        parts.push({ id: e.id + '~' + k, members: e.members, name: e.name + ' (phần ' + k + ')', locs: e.locs, units: rest.filter(function (u) { return placedIds.has(u.id); }), notes: [], splitOf: e.id });
        rest = rest.filter(function (u) { return !placedIds.has(u.id); });
      }
      return { parts: parts, rest: rest };
    }

    /* (1) Tách đơn quá lớn so với xe lớn nhất */
    const split = [];
    entities.forEach(function (e) {
      const big = weightOf(e.units) > biggest.payload || envelopeM3(e.units) > PROXY_FILL * biggest.volume;
      if (!big) { split.push(e); return; }
      const probe = packRoute(e.units.map(function (u) { return Object.assign({}, u, { stop: null }); }), biggest, true);
      if (probe.unplaced.length === 0) { split.push(e); return; }
      const sp = splitEntity(e);
      const parts = sp.parts;
      sp.rest.forEach(function (u) { unassigned.push({ orderId: e.id, name: e.name, reason: 'Khối ' + (u.code || u.name) + ' không xếp lọt vào xe lớn nhất (' + biggest.name + ').' }); });
      parts.forEach(function (p) { p.notes.push('Đơn "' + e.name + '" lớn hơn một ' + biggest.name + ' nên được tách thành ' + parts.length + ' xe.'); split.push(p); });
      if (parts.length > 1 && cons.some(function (c) { return c.type === 'together' && (c.a === e.id || c.b === e.id); })) {
        warnings.push('Đơn "' + e.name + '" phải tách nhiều xe nên ràng buộc "đi chung" với đơn khác chỉ áp dụng được cho một phần.');
      }
    });
    entities = split;

    /* (2) Ràng buộc bắt buộc đi chung: gộp thành một thực thể */
    cons.filter(function (c) { return c.type === 'together'; }).forEach(function (c) {
      const A = entities.filter(function (e) { return e.members.indexOf(c.a) >= 0; });
      const B = entities.filter(function (e) { return e.members.indexOf(c.b) >= 0; });
      if (!A.length || !B.length) return;
      const a = A[0], b = B[0];
      if (a === b) return;
      const m = { id: a.id + '+' + b.id, members: a.members.concat(b.members), name: a.name + ' + ' + b.name, locs: a.locs.concat(b.locs.filter(function (l) { return !a.locs.some(function (x) { return x.key === l.key; }); })), units: a.units.concat(b.units), notes: a.notes.concat(b.notes) };
      m.notes.push('Đơn "' + nameOf[c.a] + '" bắt buộc đi chung đơn "' + nameOf[c.b] + '" theo ràng buộc anh đặt.');
      entities = entities.filter(function (e) { return e !== a && e !== b; }).concat([m]);
    });
    if (objective === 'stops') {
      // Ít điểm dừng nhất: các đơn cùng địa điểm giao đi chung một xe.
      const byLoc = new Map();
      entities.forEach(function (e) { if (e.locs.length === 1) { const k = e.locs[0].key; if (!byLoc.has(k)) byLoc.set(k, []); byLoc.get(k).push(e); } });
      byLoc.forEach(function (list) {
        if (list.length < 2) return;
        const m = { id: list.map(function (e) { return e.id; }).join('+'), members: [].concat.apply([], list.map(function (e) { return e.members; })), name: list.map(function (e) { return e.name; }).join(' + '), locs: list[0].locs, units: [].concat.apply([], list.map(function (e) { return e.units; })), notes: [].concat.apply([], list.map(function (e) { return e.notes; })) };
        m.notes.push('Các đơn cùng điểm giao được xếp chung một xe để giảm số điểm dừng.');
        entities = entities.filter(function (e) { return list.indexOf(e) < 0; }).concat([m]);
      });
    }
    const soloIds = new Set(cons.filter(function (c) { return c.type === 'solo'; }).map(function (c) { return c.a; }));
    const firstOrder = new Map(); // orderId -> true
    cons.filter(function (c) { return c.type === 'first'; }).forEach(function (c) { firstOrder.set(c.a, true); });
    const apart = cons.filter(function (c) { return c.type === 'apart'; });

    entities.forEach(function (e) {
      e.members.forEach(function (m) {
        if (soloIds.has(m)) e.notes.push('Đơn "' + nameOf[m] + '" đi xe riêng theo ràng buộc anh đặt.');
        if (firstOrder.has(m)) e.notes.push('Điểm giao của "' + nameOf[m] + '" được giao đầu tiên theo ràng buộc anh đặt.');
      });
    });
    const orderLoc = {};
    input.orders.forEach(function (o) { orderLoc[o.id] = o.loc; });

    function isSolo(e) { return e.members.some(function (m) { return soloIds.has(m); }); }
    function firstKeyOf(entList) {
      const keys = [];
      entList.forEach(function (e) { e.members.forEach(function (m) { if (firstOrder.has(m)) keys.push(orderLoc[m].key); }); });
      return keys;
    }
    function apartBlocked(r1, r2) {
      const m1 = new Set(), m2 = new Set();
      r1.entities.forEach(function (e) { e.members.forEach(function (m) { m1.add(m); }); });
      r2.entities.forEach(function (e) { e.members.forEach(function (m) { m2.add(m); }); });
      return apart.find(function (c) { return (m1.has(c.a) && m2.has(c.b)) || (m1.has(c.b) && m2.has(c.a)); }) || null;
    }

    /* --- Chuyến --- */
    let rseq = 0;
    function newRoute(ents) {
      const notes = [];
      ents.forEach(function (e) { e.notes.forEach(function (n) { if (notes.indexOf(n) < 0) notes.push(n); }); });
      return { id: ++rseq, entities: ents, vehicle: null, pack: null, units: null, seq: null, dist: 0, notes: notes, key: null };
    }
    function pointsOf(ents) {
      const seen = new Map();
      ents.forEach(function (e) { e.locs.forEach(function (l) { if (!seen.has(l.key)) seen.set(l.key, l); }); });
      return Array.from(seen.values());
    }
    // Tính thứ tự giao, quãng đường và gán số điểm giao vào từng khối hàng.
    function layout(route) {
      const pts = pointsOf(route.entities);
      const fk = firstKeyOf(route.entities);
      const seq = sequence(pts, depot, dist, fk.length ? fk[0] : null);
      const idx = new Map();
      seq.forEach(function (p, i) { idx.set(p.key, i + 1); });
      const units = [];
      route.entities.forEach(function (e) {
        const stopKeyFor = function (u) { return u.locKey && idx.has(u.locKey) ? idx.get(u.locKey) : idx.get(e.locs[0].key); };
        e.units.forEach(function (u) { units.push(Object.assign({}, u, { stop: stopKeyFor(u) })); });
      });
      route.seq = seq; route.units = units; route.dist = tourLength(seq, depot, dist);
      route.vol = envelopeM3(units); route.weight = weightOf(units);
      return route;
    }

    function usageOf(routes, except, veh) {
      let n = 0;
      routes.forEach(function (r) { if (r !== except && r.vehicle && r.vehicle.id === veh.id) n++; });
      return n;
    }
    function typeOrder() {
      if (objective === 'cost' && costKnown) return vehicles.slice().sort(function (a, b) { return a.cost - b.cost || a.volume - b.volume; });
      return bySize;
    }

    // Chọn loại xe nhỏ nhất/rẻ nhất xếp được thật toàn bộ hàng của chuyến. Trả null nếu không loại nào đủ.
    function chooseVehicle(route, routes, quick) {
      const rejected = [];
      const order = typeOrder();
      for (let i = 0; i < order.length; i++) {
        const v = order[i];
        if (v.maxCount !== null && v.maxCount !== undefined && usageOf(routes, route, v) >= v.maxCount) { rejected.push(v.name + ': đã dùng hết số xe cho phép'); continue; }
        if (route.weight > v.payload + EPS) { rejected.push(v.name + ': quá tải trọng'); continue; }
        if (route.vol > v.volume + EPS) { rejected.push(v.name + ': thiếu thể tích'); continue; }
        const r = packRoute(route.units, v, quick);
        if (r.unplaced.length === 0) return { vehicle: v, pack: r, rejected: rejected };
        rejected.push(v.name + ': không xếp vừa (còn ' + r.unplaced.length + ' khối)');
      }
      return { vehicle: null, pack: null, rejected: rejected };
    }

    /* --- Điểm số để so sánh phương án theo mục tiêu (nhỏ hơn là tốt hơn) --- */
    function routeCost(r) {
      if (r.vehicle && isNum(r.vehicle.cost)) return r.vehicle.cost;
      return 0;
    }
    function scoreOf(routes) {
      const nV = routes.length;
      let d = 0, cost = 0, stops = 0, capacity = 0;
      routes.forEach(function (r) { d += r.dist; cost += routeCost(r); stops += r.seq.length; capacity += r.vehicle ? r.vehicle.volume : 0; });
      if (objective === 'distance') return d * 1e4 + nV * 10 + capacity * 0.01;
      if (objective === 'cost') return (costKnown ? cost : capacity * 1000) * 1e3 + d;
      if (objective === 'stops') return stops * 1e9 + nV * 1e6 + d * 1e2 + capacity;
      return nV * 1e9 + d * 1e3 + capacity; // ít xe nhất
    }

    /* (3) Savings */
    let routes = entities.map(function (e) { return layout(newRoute([e])); });
    const maxVol = biggest.volume, maxPay = Math.max.apply(null, vehicles.map(function (v) { return v.payload; }));

    function proxyScoreDelta(r1, r2, merged) {
      // So sánh điểm số trước/sau khi ghép bằng ước lượng sơ bộ (chưa xếp thật).
      const before = [r1, r2], after = [merged];
      const proxyVeh = function (r) {
        for (let i = 0; i < bySize.length; i++) { const v = bySize[i]; if (r.vol <= PROXY_FILL * v.volume && r.weight <= v.payload) return v; }
        return biggest;
      };
      const tmp = function (list) {
        return list.map(function (r) { return Object.assign({}, r, { vehicle: proxyVeh(r) }); });
      };
      return scoreOf(tmp(after)) - scoreOf(tmp(before));
    }

    function canMergeProxy(r1, r2) {
      if (r1.entities.some(isSolo) || r2.entities.some(isSolo)) return false;
      if (r1.vol + r2.vol > PROXY_FILL * maxVol + EPS || r1.weight + r2.weight > maxPay + EPS) return false;
      if (apartBlocked(r1, r2)) return false;
      if (firstKeyOf(r1.entities).length && firstKeyOf(r2.entities).length) return false;
      return true;
    }

    const blockedLogged = new Set();
    function minPointDist(r1, r2) {
      let m = Infinity;
      r1.seq.forEach(function (p) { r2.seq.forEach(function (q) { m = Math.min(m, dist(p, q)); }); });
      return m;
    }
    function describeMerge(r1, r2, merged) {
      const n1 = r1.entities.map(function (e) { return e.name; }).join(', '), n2 = r2.entities.map(function (e) { return e.name; }).join(', ');
      const saved = r1.dist + r2.dist - merged.dist;
      const d = minPointDist(r1, r2);
      const regions = Array.from(new Set(pointsOf(merged.entities).map(function (p) { return p.region; }).filter(Boolean)));
      const same = regions.length === 1 ? ' (cùng khu vực ' + regions[0] + ')' : '';
      return 'Ghép "' + n1 + '" và "' + n2 + '" vì hai điểm giao cách nhau ' + fkm(d) + same + (saved > 0 ? ', gom chung tiết kiệm ' + fkm(saved) + ' so với đi riêng' : ', giúp giảm 1 xe');
    }

    for (let guard = 0; guard < 500; guard++) {
      if (Date.now() > deadline || (hooks.cancelled && hooks.cancelled())) break;
      const cand = [];
      for (let i = 0; i < routes.length; i++) {
        for (let j = i + 1; j < routes.length; j++) {
          const a = routes[i], b = routes[j];
          const blocker = apartBlocked(a, b);
          if (blocker) {
            const key = [blocker.a, blocker.b].sort().join('|');
            if (!blockedLogged.has(key) && minPointDist(a, b) < FALLBACK_KM) {
              blockedLogged.add(key);
              const note = 'Không ghép "' + nameOf[blocker.a] + '" với "' + nameOf[blocker.b] + '" vì ràng buộc "không đi chung" anh đặt.';
              a.notes.push(note);
            }
            continue;
          }
          if (!canMergeProxy(a, b)) continue;
          cand.push({ i: i, j: j, d: minPointDist(a, b) });
        }
      }
      if (!cand.length) break;
      cand.sort(function (x, y) { return x.d - y.d; });
      let best = null;
      cand.slice(0, 14).forEach(function (c) {
        const a = routes[c.i], b = routes[c.j];
        const merged = layout(newRoute(a.entities.concat(b.entities)));
        const delta = proxyScoreDelta(a, b, merged);
        if (!best || delta < best.delta) best = { c: c, merged: merged, delta: delta };
      });
      if (!best || best.delta >= 0) break;
      const a = routes[best.c.i], b = routes[best.c.j];
      best.merged.notes = a.notes.concat(b.notes);
      best.merged.notes.push(describeMerge(a, b, best.merged));
      routes = routes.filter(function (r) { return r !== a && r !== b; }).concat([best.merged]);
    }

    /* (4) Chọn xe thật và sửa chuyến không xếp vừa */
    function assign(rs, quick) {
      const out = [];
      const queue = rs.slice().sort(function (a, b) { return b.vol - a.vol; });
      let guard = 0;
      while (queue.length && guard++ < 400) {
        const r = queue.shift();
        const all = out.concat(queue);
        const pick = chooseVehicle(r, all, quick);
        if (pick.vehicle) {
          r.vehicle = pick.vehicle; r.pack = pick.pack; r.rejected = pick.rejected;
          out.push(r);
          continue;
        }
        if (r.entities.length > 1) {
          // Bỏ đơn "khó xếp" nhất ra thành chuyến riêng: đơn có thể tích lớn nhất.
          const sorted = r.entities.slice().sort(function (a, b) { return envelopeM3(b.units) - envelopeM3(a.units); });
          const out1 = sorted[0];
          const left = layout(newRoute(r.entities.filter(function (e) { return e !== out1; })));
          left.notes = r.notes.slice();
          left.notes.push('Đã tách "' + out1.name + '" ra chuyến khác vì ghép chung không xếp vừa xe.');
          const alone = layout(newRoute([out1]));
          alone.notes = out1.notes.slice();
          queue.unshift(left, alone);
          continue;
        }
        if (r.entities.length === 1 && r.entities[0].units.length > 1 && !r.entities[0].splitOf) {
          // Ước lượng thể tích sót: đơn thật ra lớn hơn một xe lớn nhất, tách thành nhiều xe.
          const e = r.entities[0];
          const sp = splitEntity(e);
          if (sp.parts.length > 1) {
            sp.parts.forEach(function (p) { p.notes.push('Đơn "' + e.name + '" lớn hơn một ' + biggest.name + ' nên được tách thành ' + sp.parts.length + ' xe.'); });
            queue.unshift.apply(queue, sp.parts.map(function (p) { return layout(newRoute([p])); }));
            sp.rest.forEach(function (u) { unassigned.push({ orderId: e.id, name: e.name, reason: 'Khối ' + (u.code || u.name) + ' không xếp lọt vào xe lớn nhất (' + biggest.name + ').' }); });
            continue;
          }
        }
        r.entities.forEach(function (e) { unassigned.push({ orderId: e.members[0], name: e.name, reason: 'Không có xe nào xếp vừa (' + (pick.rejected.join('; ') || 'không có xe khả dụng') + ').' }); });
      }
      return out;
    }
    routes = assign(routes, true);
    let best = routes.map(function (r) { return r; });
    let bestScore = scoreOf(best);
    if (hooks.onProgress) hooks.onProgress({ phase: 'Đã có phương án đầu tiên', ratio: 0.5, plan: finalize(best, true) });

    /* (5) Cải thiện cục bộ: ghép chuyến, chuyển đơn */
    function tryAccept(newRoutes, why) {
      const sc = scoreOf(newRoutes);
      if (sc < bestScore - 1e-9) { best = newRoutes; bestScore = sc; if (hooks.onProgress) hooks.onProgress({ phase: why, ratio: 0.75, plan: finalize(best, true) }); return true; }
      return false;
    }
    let improved = true;
    while (improved && Date.now() < deadline && !(hooks.cancelled && hooks.cancelled())) {
      improved = false;
      // a) ghép hai chuyến nếu xếp vừa một xe và tốt hơn
      outer: for (let i = 0; i < best.length; i++) {
        for (let j = i + 1; j < best.length; j++) {
          if (Date.now() > deadline) break outer;
          const a = best[i], b = best[j];
          if (a.entities.some(isSolo) || b.entities.some(isSolo) || apartBlocked(a, b)) continue;
          if (firstKeyOf(a.entities).length && firstKeyOf(b.entities).length) continue;
          const m = layout(newRoute(a.entities.concat(b.entities)));
          if (m.weight > maxPay || m.vol > maxVol) continue;
          const others = best.filter(function (r) { return r !== a && r !== b; });
          const pick = chooseVehicle(m, others, true);
          if (!pick.vehicle) continue;
          m.vehicle = pick.vehicle; m.pack = pick.pack; m.rejected = pick.rejected;
          m.notes = a.notes.concat(b.notes);
          m.notes.push(describeMerge(a, b, m));
          if (tryAccept(others.concat([m]), 'Ghép chuyến')) { improved = true; break outer; }
        }
      }
      if (improved) continue;
      // b) chuyển một đơn sang chuyến khác
      outer2: for (let i = 0; i < best.length; i++) {
        const src = best[i];
        if (src.entities.length < 1) continue;
        for (let ei = 0; ei < src.entities.length; ei++) {
          const e = src.entities[ei];
          if (isSolo(e)) continue;
          const eRt = layout(newRoute([e]));
          const dHome = minPointDist(eRt, src);
          for (let j = 0; j < best.length; j++) {
            if (i === j) continue;
            if (Date.now() > deadline || (hooks.cancelled && hooks.cancelled())) break outer2;
            const dst = best[j];
            if (dst.entities.some(isSolo) || apartBlocked({ entities: [e] }, dst)) continue;
            if (firstKeyOf([e]).length && firstKeyOf(dst.entities).length) continue;
            if (dst.vol + envelopeM3(e.units) > maxVol * 1.0 || dst.weight + weightOf(e.units) > maxPay) continue;
            if (minPointDist(eRt, dst) > 3 * Math.max(10, dHome)) continue;
            const others = best.filter(function (r) { return r !== src && r !== dst; });
            const newDst = layout(newRoute(dst.entities.concat([e])));
            const pd = chooseVehicle(newDst, others, true);
            if (!pd.vehicle) continue;
            newDst.vehicle = pd.vehicle; newDst.pack = pd.pack; newDst.rejected = pd.rejected;
            newDst.notes = dst.notes.slice();
            newDst.notes.push('Chuyển "' + e.name + '" sang chuyến này vì gần các điểm giao khác trong chuyến hơn (cải thiện ' + (objective === 'distance' ? 'quãng đường' : objective === 'cost' ? 'chi phí' : 'số xe / quãng đường') + ').');
            const rest = src.entities.filter(function (x) { return x !== e; });
            let list = others.concat([newDst]);
            if (rest.length) {
              const newSrc = layout(newRoute(rest));
              const ps = chooseVehicle(newSrc, list, true);
              if (!ps.vehicle) continue;
              newSrc.vehicle = ps.vehicle; newSrc.pack = ps.pack; newSrc.rejected = ps.rejected; newSrc.notes = src.notes.slice();
              list = list.concat([newSrc]);
            }
            if (tryAccept(list, 'Chuyển đơn giữa các chuyến')) { improved = true; break outer2; }
          }
        }
      }
    }

    /* (6) Xếp lần cuối ở chất lượng cao và dựng kết quả */
    const result = finalize(best, false);
    result.unassigned = unassigned;
    result.warnings = warnings.concat(result.warnings);
    result.log = log;
    result.elapsedMs = Date.now() - t0;
    result.objective = objective;
    result.estimatedDistance = flags.estimated;
    if (flags.estimated) result.warnings.push('Một số khoảng cách không có tọa độ hoặc khu vực nên được ước tính ' + FALLBACK_KM + ' km. Bổ sung tọa độ/khu vực để gom chính xác hơn.');
    return result;

    function finalize(rs, quick) {
      const trips = rs.slice().sort(function (a, b) { return b.vol - a.vol; }).map(function (r, k) {
        let pack = quick ? r.pack : packRoute(r.units, r.vehicle, false);
        let fallbackNote = null;
        if (!quick && pack.unplaced.length) {
          // Xếp kỹ giữ đúng thứ tự dỡ nhưng bỏ sót hàng: dùng cách xếp chở hết (nới thứ tự dỡ, có cảnh báo đỏ) nếu có.
          const q = packRoute(r.units, r.vehicle, true);
          if (q.unplaced.length < pack.unplaced.length) { pack = q; fallbackNote = 'Chở hết hàng chỉ khi nới thứ tự dỡ hàng; xem cảnh báo đỏ ở chuyến này.'; }
        }
        const m = pack.metrics;
        const stops = r.seq.map(function (p, i) {
          const ents = r.entities.filter(function (e) { return e.locs.some(function (l) { return l.key === p.key; }); });
          const us = r.units.filter(function (u) { return u.stop === i + 1; });
          return { seq: i + 1, locKey: p.key, region: p.region || '', address: p.address || '', lat: p.lat, lng: p.lng, customers: Array.from(new Set(ents.map(function (e) { return e.name; }))), orderIds: Array.from(new Set([].concat.apply([], ents.map(function (e) { return e.members; })))), kg: weightOf(us), blocks: us.length, legKm: i === 0 ? dist(depot, p) : dist(r.seq[i - 1], p) };
        });
        const notes = r.notes.slice();
        if (fallbackNote) notes.push(fallbackNote);
        const head = r.vehicle.name + ' đầy ' + fpct(m.volumePct) + ' thể tích, ' + fpct(m.weightPct) + ' tải trọng';
        const rej = (r.rejected || []).filter(function (x) { return /không xếp vừa|thiếu thể tích|quá tải/.test(x); });
        if (rej.length) notes.push('Chọn ' + r.vehicle.name + ' vì xe nhỏ hơn không đủ (' + rej.join('; ') + ').');
        if (r.entities.length === 1 && r.seq.length === 1 && rs.length > 1 && !r.notes.length) notes.push('Đi riêng vì không có điểm giao nào gần hoặc đủ chỗ để ghép chung.');
        return {
          no: k + 1, vehicle: r.vehicle, pack: pack, units: r.units, stops: stops, distanceKm: r.dist,
          cost: isNum(r.vehicle.cost) ? r.vehicle.cost : null, summary: head, notes: notes, orders: Array.from(new Set([].concat.apply([], r.entities.map(function (e) { return e.members; })))),
          volumePct: m.volumePct, weightPct: m.weightPct, warnings: pack.warnings.slice(),
        };
      });
      let totalKm = 0, totalCost = 0, costKnownAll = true, stopsN = 0;
      trips.forEach(function (t) { totalKm += t.distanceKm; if (t.cost === null) costKnownAll = false; else totalCost += t.cost; stopsN += t.stops.length; });
      return {
        trips: trips, unassigned: unassigned.slice(), warnings: [],
        totals: { vehicles: trips.length, distanceKm: totalKm, cost: costKnownAll ? totalCost : null, stops: stopsN, avgVolumePct: trips.length ? trips.reduce(function (s, t) { return s + t.volumePct; }, 0) / trips.length : 0 },
      };
    }
  }

  /* Dựng lại một chuyến từ danh sách khối (dùng khi người dùng kéo thả đơn giữa các chuyến hoặc đổi xe).
   * locs: {locKey: {key, lat, lng, region, address}}. Trả chuyến cùng dạng với kết quả của plan(). */
  function buildTrip(units, vehicle, locs, depot, settings, notes) {
    settings = settings || {};
    const flags = { estimated: false };

    const keys = [];
    units.forEach(function (u) { if (keys.indexOf(u.locKey) < 0) keys.push(u.locKey); });
    const pts = keys.map(function (k) { return locs[k] || { key: k, region: '', address: '' }; });
    const seq = sequence(pts, depot, dist, null);
    const us = units.map(function (u) { return Object.assign({}, u, { stop: seq.findIndex(function (p) { return p.key === u.locKey; }) + 1 }); });
    let pack = S.packVehicle(us, vehicle, { gap: settings.gap || 0, estimateExtra: true });
    if (pack.unplaced.length) {
      const q = S.packVehicle(us, vehicle, { gap: settings.gap || 0, quick: true });
      if (q.unplaced.length < pack.unplaced.length) { pack = q; notes = (notes || []).concat(['Chở hết hàng chỉ khi nới thứ tự dỡ hàng; xem cảnh báo đỏ ở chuyến này.']); }
    }
    const m = pack.metrics;
    const stops = seq.map(function (p, i) {
      const sus = us.filter(function (u) { return u.stop === i + 1; });
      return { seq: i + 1, locKey: p.key, region: p.region || '', address: p.address || '', lat: p.lat, lng: p.lng,
        customers: Array.from(new Set(sus.map(function (u) { return u.customer; }))),
        orderIds: Array.from(new Set(sus.map(function (u) { return String(u.id).split('|')[0]; }))),
        kg: weightOf(sus), blocks: sus.length, legKm: i === 0 ? dist(depot, p) : dist(seq[i - 1], p) };
    });
    return {
      no: 0, vehicle: vehicle, pack: pack, units: us, stops: stops, distanceKm: tourLength(seq, depot, dist),
      cost: isNum(vehicle.cost) ? vehicle.cost : null, summary: vehicle.name + ' đầy ' + fpct(m.volumePct) + ' thể tích, ' + fpct(m.weightPct) + ' tải trọng',
      notes: notes || [], orders: Array.from(new Set(us.map(function (u) { return String(u.id).split('|')[0]; }))),
      volumePct: m.volumePct, weightPct: m.weightPct, warnings: pack.warnings.slice(), estimated: flags.estimated,
    };
  }

  function totalsOf(trips) {
    let km = 0, cost = 0, known = true, stops = 0;
    trips.forEach(function (t) { km += t.distanceKm; if (t.cost === null || t.cost === undefined) known = false; else cost += t.cost; stops += t.stops.length; });
    return { vehicles: trips.length, distanceKm: km, cost: known ? cost : null, stops: stops, avgVolumePct: trips.length ? trips.reduce(function (s, t) { return s + t.volumePct; }, 0) / trips.length : 0 };
  }

  const api = { buildTrip: buildTrip, totalsOf: totalsOf, plan: plan, makeDistance: makeDistance, sequence: sequence, tourLength: tourLength, haversine: haversine };

/* NHẬP ĐƠN TỪ EXCEL/CSV: nhận bảng dạng mảng các dòng, đoán cột, gom dòng hàng thành đơn theo khách.
 * Không dùng DOM nên kiểm thử được bằng Node. Bước đọc file Excel (SheetJS) nằm ở lớp giao diện. */
const Importer = (function () {
  const M = (typeof Model !== 'undefined') ? Model : require('./model.js');
  const norm = M.normText;

  // Mỗi trường: [khóa, nhãn hiển thị, các từ khóa tiêu đề theo thứ tự ưu tiên (đã bỏ dấu)]
  const FIELDS = [
    ['customer', 'Khách hàng', ['ten khach hang', 'khach hang', 'ten khach']],
    ['code', 'Mã hàng', ['ma hang', 'ma san pham', 'ma sp']],
    ['qty', 'Số lượng ống', ['sl con lai', 'so luong', 'sl giao', 'sl']],
    ['pname', 'Tên hàng', ['ten hang', 'ten san pham']],
    ['no', 'Số đơn hàng', ['so don hang', 'don hang ban', 'so don']],
    ['address', 'Địa chỉ giao', ['dia chi']],
    ['region', 'Khu vực (tỉnh/huyện/KCN)', ['khu vuc', 'tinh', 'huyen', 'kcn']],
    ['lat', 'Vĩ độ', ['vi do', 'lat']],
    ['lng', 'Kinh độ', ['kinh do', 'lng', 'long']],
    ['date', 'Ngày giao', ['ngay giao']],
    ['vehicle', 'Xe giao hàng', ['xe giao hang', 'xe']],
    ['note', 'Ghi chú', ['note', 'ghi chu']],
  ];

  const cellText = function (c) { return c === undefined || c === null ? '' : String(c).trim(); };

  // Dòng tiêu đề = dòng trong 30 dòng đầu có nhiều ô khớp từ khóa nhất.
  function findHeader(rows) {
    let best = -1, bestScore = 1;
    for (let i = 0; i < Math.min(30, rows.length); i++) {
      const cells = rows[i].map(function (c) { return norm(cellText(c)); });
      let score = 0;
      FIELDS.forEach(function (f) { if (cells.some(function (c) { return c && f[2].some(function (k) { return c.indexOf(k) >= 0; }); })) score++; });
      if (score > bestScore) { best = i; bestScore = score; }
    }
    return best;
  }

  // Trả {khóa trường: chỉ số cột hoặc -1}.
  function guessMapping(headers) {
    const used = new Set();
    const map = {};
    const hn = headers.map(function (h) { return norm(cellText(h)); });
    FIELDS.forEach(function (f) {
      map[f[0]] = -1;
      for (let k = 0; k < f[2].length && map[f[0]] < 0; k++) {
        for (let c = 0; c < hn.length; c++) {
          if (!used.has(c) && hn[c] && hn[c].indexOf(f[2][k]) >= 0) { map[f[0]] = c; used.add(c); break; }
        }
      }
    });
    return map;
  }

  function findDate(rows) {
    for (let i = 0; i < Math.min(15, rows.length); i++) {
      for (let j = 0; j < rows[i].length; j++) {
        const m = cellText(rows[i][j]).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
        if (m) return m[3] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[1]).slice(-2);
      }
    }
    return '';
  }

  /* Đoán kích thước ống từ tên hàng. Chỉ là gợi ý, luôn cần người dùng kiểm tra.
   * Quy ước đoán: "ống A x B x C": nếu C có đơn vị g/kg thì A = đường kính ngoài, B = dài, C = khối lượng;
   * nếu B có tiền tố N (ống A x N B x C) thì A = đường kính trong, B = đường kính ngoài, C = dài;
   * còn lại A = đường kính ngoài, B = độ dày thành, C = dài. */
  function parseNameGuess(name) {
    const n = cellText(name);
    if (!/^o?ng\s/.test(norm(n))) return { ok: false, why: 'Không nhận ra đây là ống (tên không bắt đầu bằng "ống").' };
    const re = /(N?\s*\d+(?:[.,]\d+)?)\s*x\s*(N?\s*\d+(?:[.,]\d+)?)\s*x\s*(N?\s*\d+(?:[.,]\d+)?)\s*(kg|g)?\b/i;
    const m = n.match(re);
    if (!m) return { ok: false, why: 'Không đọc được ba kích thước dạng A x B x C trong tên hàng.' };
    const v = function (s) { return M.num(String(s).replace(/N/i, '').trim()); };
    const nA = /N/i.test(m[1]), nB = /N/i.test(m[2]);
    const a = v(m[1]), b = v(m[2]), c = v(m[3]);
    const unit = m[4] ? m[4].toLowerCase() : '';
    if (!(a > 0) || !(b > 0) || !(c > 0)) return { ok: false, why: 'Kích thước trong tên hàng không hợp lệ.' };
    let g;
    if (unit) {
      g = { size: a / 2, L: b, kg: unit === 'g' ? c / 1000 : c, weightMode: 'kg', text: 'đường kính ngoài ' + a + ' mm, dài ' + b + ' mm, nặng ' + c + ' ' + unit };
    } else if (nB && !nA) {
      const T = (b - a) / 2;
      if (!(T > 0)) return { ok: false, why: 'Đường kính ngoài phải lớn hơn đường kính trong.' };
      g = { size: b / 2, L: c, T: T, weightMode: 'thickness', text: 'đường kính trong ' + a + ' mm, ngoài ' + b + ' mm (dày ' + T + ' mm), dài ' + c + ' mm' };
    } else {
      if (!(b < a / 2)) return { ok: false, why: 'Độ dày thành (' + b + ' mm) không nhỏ hơn bán kính (' + a / 2 + ' mm), có thể tên hàng theo quy ước khác.' };
      g = { size: a / 2, L: c, T: b, weightMode: 'thickness', text: 'đường kính ngoài ' + a + ' mm, dày thành ' + b + ' mm, dài ' + c + ' mm' };
    }
    g.ok = true;
    return g;
  }

  /* rows: mảng các dòng (mảng ô). headerIdx: dòng tiêu đề. map: {khóa: cột}. existing: danh sách sản phẩm đã có.
   * Trả {orders, newProducts, stats}. Khách để trống được hiểu là cùng khách với dòng phía trên (ô gộp trong Excel). */
  function buildOrders(rows, headerIdx, map, existing, opts) {
    opts = opts || {};
    const get = function (r, key) { return map[key] >= 0 && map[key] !== undefined ? r[map[key]] : ''; };
    const known = new Map();
    existing.forEach(function (p) { known.set(norm(p.code), p); });
    const date = findDate(rows.slice(0, headerIdx + 1));
    const stats = { rows: 0, skippedZero: 0, skippedNoCode: 0, skippedNoCustomer: 0, pickup: 0, unknownCodes: [], guessed: 0, notGuessed: 0 };
    const groups = new Map();
    let curCustomer = '', curAddress = '', curRegion = '', curLat = '', curLng = '';
    for (let i = headerIdx + 1; i < rows.length; i++) {
      const r = rows[i];
      if (!r || !r.some(function (c) { return cellText(c) !== ''; })) continue;
      const cust = cellText(get(r, 'customer'));
      if (cust) { curCustomer = cust; curAddress = cellText(get(r, 'address')); curRegion = cellText(get(r, 'region')); curLat = cellText(get(r, 'lat')); curLng = cellText(get(r, 'lng')); }
      const code = cellText(get(r, 'code'));
      if (!code) { stats.skippedNoCode++; continue; }
      stats.rows++;
      if (!curCustomer) { stats.skippedNoCustomer++; continue; }
      const q = M.num(get(r, 'qty'));
      if (!(q > 0)) { stats.skippedZero++; continue; }
      const key = norm(curCustomer);
      if (!groups.has(key)) groups.set(key, { customer: curCustomer, address: curAddress, region: curRegion, lat: curLat, lng: curLng, nos: new Set(), notes: new Set(), vehicles: new Set(), lines: new Map() });
      const g = groups.get(key);
      const no = cellText(get(r, 'no'));
      if (no) g.nos.add(no);
      const note = cellText(get(r, 'note'));
      if (note) g.notes.add(note.replace(/\s+/g, ' '));
      const ve = cellText(get(r, 'vehicle'));
      if (ve) g.vehicles.add(ve);
      const ck = norm(code);
      if (!g.lines.has(ck)) g.lines.set(ck, { code: code, qty: 0, name: cellText(get(r, 'pname')) });
      g.lines.get(ck).qty += Math.round(q);
    }
    const newProducts = new Map();
    const orders = [];
    groups.forEach(function (g) {
      const lines = [];
      g.lines.forEach(function (l, ck) {
        lines.push({ code: l.code, qty: l.qty });
        if (!known.has(ck) && !newProducts.has(ck)) {
          const guess = parseNameGuess(l.name);
          const base = { code: l.code, name: l.name, qty: 1, auto: true, packType: 'loose', orient: 'lay', unit: 'mm', stackable: true, maxTiers: 4, maxLoad: 1000 };
          let p;
          if (guess.ok) {
            stats.guessed++;
            p = M.newProduct(Object.assign(base, { L: guess.L, sizeMode: 'radius', size: guess.size, weightMode: guess.weightMode, T: guess.T === undefined ? '' : guess.T, kg: guess.kg === undefined ? '' : guess.kg, guess: 'Gợi ý từ tên hàng: ' + guess.text + '. Quy cách đóng gói chưa biết nên tạm tính là hàng rời xếp nằm, cho chồng tối đa 4 tầng (chịu tải 1000 kg).' }));
          } else {
            stats.notGuessed++;
            p = M.newProduct(Object.assign(base, { guess: 'Chưa đoán được kích thước từ tên hàng. ' + guess.why }));
          }
          newProducts.set(ck, p);
          stats.unknownCodes.push(l.code);
        }
      });
      const pickup = Array.from(g.vehicles).some(function (v) { return /den lay/.test(norm(v)); });
      if (pickup) stats.pickup++;
      const nos = Array.from(g.nos);
      const noteParts = [];
      if (g.vehicles.size) noteParts.push('Xe: ' + Array.from(g.vehicles).join(' / '));
      Array.from(g.notes).slice(0, 4).forEach(function (n) { noteParts.push(n); });
      orders.push(M.newOrder({
        no: nos.slice(0, 3).join(', ') + (nos.length > 3 ? ' (+' + (nos.length - 3) + ')' : ''),
        customer: g.customer, address: g.address, region: g.region, lat: g.lat, lng: g.lng, date: date,
        note: noteParts.join('; '), include: !pickup, pickup: pickup, lines: lines,
      }));
    });
    return { orders: orders, newProducts: Array.from(newProducts.values()), stats: stats, date: date };
  }

  const api = { FIELDS: FIELDS, findHeader: findHeader, guessMapping: guessMapping, parseNameGuess: parseNameGuess, buildOrders: buildOrders, findDate: findDate };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  return api;
})();

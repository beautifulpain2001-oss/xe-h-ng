<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xếp ống giấy lên xe</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1c2630;--mut:#5d6b78;--line:#d7dde3;--pri:#1f6feb;--err:#b42318;--warn:#8a5a00;--ok:#1a6b3a}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#12324f;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
nav{display:flex;gap:4px}
.tabbtn{background:transparent;color:#cfe0f0;border:0;padding:8px 14px;border-radius:6px 6px 0 0;cursor:pointer;font-size:14px}
.tabbtn.active{background:var(--bg);color:var(--ink);font-weight:600}
main{padding:16px 20px;max-width:1500px;margin:0 auto}
.toolbar,.packbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.spacer{flex:1}
button,select,input[type=text]{font:inherit}
button{padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer}
button:hover{background:#eef3f8}
button.primary{background:var(--pri);border-color:var(--pri);color:#fff}
button.primary:hover{background:#1559c1}
button.primary:disabled{background:#9db8e6;border-color:#9db8e6;cursor:not-allowed}
button.danger{color:var(--err)}
select,input[type=text]{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}
label.inline{color:var(--mut)}
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:auto}
.tablewrap.tall{max-height:340px}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;border-bottom:1px solid #eaeef2;text-align:left;vertical-align:top}
th{background:#f0f3f6;font-weight:600;position:sticky;top:0;white-space:nowrap}
td.num{text-align:right;white-space:nowrap}
td.actions{white-space:nowrap}
td.actions button{padding:3px 8px;margin-right:4px}
tr[data-uid]{cursor:pointer}
tr.sel{background:#fde8e6}
.sub{color:var(--mut);font-size:12px}
.tag{padding:2px 8px;border-radius:10px;font-size:12px}
.tag.ok{background:#dcf3e4;color:var(--ok)}.tag.warn{background:#fff0cc;color:var(--warn)}.tag.err{background:#fde1de;color:var(--err)}
.notes{margin-top:10px}
.note{padding:6px 10px;border-radius:6px;margin:4px 0;font-size:13px}
.note.err{background:#fde8e6;color:var(--err)}.note.warn{background:#fff6dd;color:var(--warn)}.note.ok{background:#e8f5ec;color:var(--ok)}
.hint{color:var(--mut);font-size:12px}.warnText{color:var(--warn)}
.empty{padding:30px;text-align:center;color:var(--mut);background:var(--card);border:1px dashed var(--line);border-radius:8px}
dialog{border:0;border-radius:10px;padding:18px 22px;width:min(860px,96vw);max-height:92vh;overflow:auto;box-shadow:0 10px 40px #0005}
dialog::backdrop{background:#0006}
dialog h2{margin:0 0 8px;font-size:18px}dialog h3{margin:14px 0 6px;font-size:14px;color:#12324f}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 12px}
label.f{display:flex;flex-direction:column;gap:2px}
label.f span{font-size:12px;color:var(--mut)}
label.f small{font-size:11px;color:var(--mut)}
label.f.check{flex-direction:row;align-items:center;gap:8px;padding-top:18px}
label.f.check span{font-size:13px;color:var(--ink)}
.dlgfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.packmain{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,1fr);gap:14px;align-items:start}
.canvas{height:480px;background:#f4f6f8;border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative}
.canvas canvas{display:block}
.viewtools{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0;font-size:12px}
.lg i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;border:1px solid #0003}
.lg i.dot{background:#d62728;border-radius:50%}.lg i.ring{background:#fff;border:3px solid #1f77b4;border-radius:50%}
.lg i.gradient{width:40px;background:linear-gradient(90deg,hsl(216,70%,50%),hsl(108,70%,50%),hsl(0,70%,50%))}
.pickinfo{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:44px;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.ct{font-size:12px;color:var(--mut)}.cb{font-size:22px;font-weight:700}.cs{font-size:12px;color:var(--mut)}
h3,h4{margin:12px 0 6px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#12324f;color:#fff;padding:8px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (max-width:900px){.packmain{grid-template-columns:1fr}.canvas{height:340px}main{padding:10px}}

</style>
</head>
<body>
<header>
  <h1>Xếp ống giấy lên xe</h1>
  <nav>
    <button class="tabbtn active" data-tab="products">1. Sản phẩm</button>
    <button class="tabbtn" data-tab="vehicles">2. Xe</button>
    <button class="tabbtn" data-tab="pack">3. Xếp thử một xe</button>
  </nav>
</header>
<main>
  <section class="tab" id="tab-products"></section>
  <section class="tab" id="tab-vehicles" hidden></section>
  <section class="tab" id="tab-pack" hidden></section>
</main>
<dialog id="dlg"></dialog>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<!-- Mô hình dữ liệu + bộ giải: cũng được nạp vào Web Worker -->
<script id="pure-src">
/* MÔ HÌNH DỮ LIỆU: tạo đối tượng mặc định, đổi đơn vị, kiểm tra dữ liệu nhập.
 * Nội bộ luôn dùng mm và kg. Giá trị người dùng nhập được giữ nguyên (kèm đơn vị);
 * chỉ quy đổi khi tính toán. Không phụ thuộc trình duyệt nên kiểm thử được bằng Node. */
const Model = (function () {
  const UNIT_MM = { mm: 1, cm: 10, m: 1000 };
  let seq = 0;

  function uid(prefix) {
    seq += 1;
    return prefix + Date.now().toString(36) + seq.toString(36) + Math.floor(Math.random() * 1296).toString(36);
  }

  // Chấp nhận cả dấu phẩy thập phân kiểu Việt Nam ("1,5"). Trả NaN nếu rỗng hoặc sai.
  function num(v) {
    if (typeof v === 'number') return isFinite(v) ? v : NaN;
    if (v === null || v === undefined) return NaN;
    const s = String(v).trim().replace(/\s/g, '').replace(',', '.');
    if (s === '') return NaN;
    const x = Number(s);
    return isFinite(x) ? x : NaN;
  }

  function defaultSettings() {
    return {
      density: 750,      // kg/m3, tỷ trọng giấy ước tính
      gap: 0,            // mm, khe hở giữa các khối khi xếp lên xe
      looseMaxH: 1000,   // mm, chiều cao tối đa một khối ống rời
      looseWidth: 1200,  // mm, chiều rộng tối đa một khối ống rời
    };
  }

  function newProduct(o) {
    return Object.assign({
      id: uid('p'), code: '', name: '', customer: '', qty: '',
      unit: 'mm', L: '', sizeMode: 'radius', size: '',
      weightMode: 'thickness', T: '', kg: '',
      orient: 'stand', stackable: false, maxTiers: 2, nestable: false,
      packType: 'pallet', perUnit: '',
      palL: 1200, palW: 1000, palH: 150, palKg: 20, maxH: 1800,
      bunL: '', bunW: '', bunH: '', bunKg: 0,
    }, o || {});
  }

  function newVehicle(o) {
    return Object.assign({
      id: uid('v'), name: '', unit: 'mm', mode: 'dims',
      L: '', W: '', H: '', volume: '', rL: 3, rW: 1, rH: 1,
      payload: '', cost: '', maxCount: '',
    }, o || {});
  }

  /* Kiểm tra và quy đổi một dòng hàng. Trả {errors, warnings, n}; n = giá trị đã quy đổi (mm, kg). */
  function prepareProduct(p, settings) {
    const errors = [];
    const warnings = [];
    const f = UNIT_MM[p.unit];
    const n = { id: p.id, code: p.code, name: p.name, customer: p.customer || '' };

    if (!String(p.code || '').trim() && !String(p.name || '').trim()) {
      errors.push('Chưa nhập mã hàng hoặc tên hàng. Hãy nhập ít nhất một trong hai.');
    }
    if (!f) errors.push('Đơn vị kích thước không hợp lệ. Chọn mm, cm hoặc m.');

    n.qty = num(p.qty);
    if (!(n.qty >= 1) || Math.floor(n.qty) !== n.qty) {
      errors.push('Số lượng ống phải là số nguyên từ 1 trở lên.');
    }

    const L = num(p.L) * (f || NaN);
    if (!(L > 0)) errors.push('Thiếu hoặc sai chiều dài ống. Nhập số lớn hơn 0.');
    n.L = L;

    const size = num(p.size) * (f || NaN);
    if (!(size > 0)) {
      errors.push('Thiếu hoặc sai ' + (p.sizeMode === 'diameter' ? 'đường kính' : 'bán kính') + ' ống. Nhập số lớn hơn 0.');
    }
    n.R = p.sizeMode === 'diameter' ? size / 2 : size;

    if (n.R > 0 && L > 0) {
      if (n.R > 1500) warnings.push('Bán kính ống rất lớn (' + n.R + ' mm). Kiểm tra lại đơn vị và nhãn bán kính/đường kính.');
      if (L < 5) warnings.push('Chiều dài ống rất nhỏ (' + L + ' mm). Kiểm tra lại đơn vị.');
      if (L > 12000) warnings.push('Chiều dài ống lớn hơn 12 m (' + L + ' mm). Kiểm tra lại đơn vị.');
    }

    n.kgEstimated = p.weightMode !== 'kg';
    if (p.weightMode === 'kg') {
      n.tubeKg = num(p.kg);
      if (!(n.tubeKg > 0)) errors.push('Thiếu khối lượng kg/ống. Nhập số lớn hơn 0, hoặc đổi sang cách nhập độ dày thành ống.');
      n.T = NaN;
    } else {
      n.T = num(p.T) * (f || NaN);
      const rho = num(settings.density);
      if (!(n.T > 0)) {
        errors.push('Thiếu độ dày thành ống. Nhập số lớn hơn 0, hoặc đổi sang cách nhập khối lượng kg/ống.');
      } else if (n.R > 0 && n.T >= n.R) {
        errors.push('Độ dày thành ống phải nhỏ hơn bán kính ngoài (độ dày ' + n.T + ' mm, bán kính ' + n.R + ' mm). Kiểm tra đơn vị hoặc nhãn bán kính/đường kính.');
      }
      if (!(rho > 0)) errors.push('Tỷ trọng giấy phải lớn hơn 0 (đặt ở mục Thiết lập chung).');
      if (!errors.length) {
        const r = n.R - n.T;
        n.tubeKg = Math.PI * (n.R * n.R - r * r) * n.L * 1e-9 * rho;
      }
    }

    n.orient = p.orient === 'lay' ? 'lay' : 'stand';
    n.stackable = !!p.stackable;
    n.maxTiers = n.stackable ? Math.floor(num(p.maxTiers)) : 1;
    if (n.stackable && !(n.maxTiers >= 2)) errors.push('Số tầng chồng tối đa phải là số nguyên từ 2 trở lên (hoặc bỏ chọn "cho phép xếp chồng").');
    n.nestable = !!p.nestable;
    if (n.nestable) warnings.push('Tính năng lồng ống sẽ có ở giai đoạn 2; hiện tại hệ thống chưa lồng ống khi tính.');

    n.packType = p.packType;
    if (['pallet', 'bundle', 'loose'].indexOf(p.packType) < 0) errors.push('Chọn kiểu đóng gói: xếp pallet, đóng kiện hoặc rời.');
    if (p.packType === 'pallet' || p.packType === 'bundle') {
      n.perUnit = num(p.perUnit);
      if (!(n.perUnit >= 1) || Math.floor(n.perUnit) !== n.perUnit) {
        errors.push('Số ống mỗi ' + (p.packType === 'pallet' ? 'pallet' : 'kiện') + ' phải là số nguyên từ 1 trở lên.');
      }
    }
    if (p.packType === 'pallet') {
      n.palL = num(p.palL); n.palW = num(p.palW); n.palH = num(p.palH); n.palKg = num(p.palKg); n.maxH = num(p.maxH);
      if (!(n.palL > 0) || !(n.palW > 0)) errors.push('Kích thước pallet (dài, rộng) phải lớn hơn 0 mm.');
      if (!(n.palH >= 0)) errors.push('Chiều cao phần pallet gỗ không được âm (nhập 0 nếu không có pallet).');
      if (!(n.palKg >= 0)) errors.push('Khối lượng pallet gỗ không được âm.');
      if (!(n.maxH > n.palH)) errors.push('Chiều cao tối đa của khối hàng trên pallet phải lớn hơn chiều cao pallet gỗ.');
      if (n.orient === 'stand' && n.maxH > n.palH && n.L > n.maxH - n.palH) {
        errors.push('Ống dài ' + n.L + ' mm, cao hơn chỗ trống trên pallet (' + (n.maxH - n.palH) + ' mm), không thể xếp đứng. Đổi sang xếp nằm hoặc tăng chiều cao tối đa.');
      }
      if (n.R > 0 && (2 * n.R > n.palW || 2 * n.R > n.palL)) {
        errors.push('Đường kính ống (' + (2 * n.R) + ' mm) lớn hơn pallet. Kiểm tra lại kích thước ống hoặc pallet.');
      }
    }
    if (p.packType === 'bundle') {
      n.bunL = num(p.bunL); n.bunW = num(p.bunW); n.bunH = num(p.bunH); n.bunKg = num(p.bunKg);
      if (!(n.bunL > 0) || !(n.bunW > 0) || !(n.bunH > 0)) errors.push('Cần nhập đủ kích thước kiện (dài, rộng, cao) lớn hơn 0 mm.');
      if (!(n.bunKg >= 0)) errors.push('Khối lượng bì của kiện không được âm (nhập 0 nếu không có).');
    }
    if (p.packType === 'loose') {
      n.maxH = num(settings.looseMaxH);
      n.palL = num(settings.looseWidth);
      n.palW = num(settings.looseWidth);
      n.palH = 0; n.palKg = 0;
      if (n.orient === 'stand') warnings.push('Hàng rời được xếp nằm theo khối ống (lục giác); lựa chọn "đứng" bị bỏ qua.');
      n.orient = 'lay';
    }
    return { errors: errors, warnings: warnings, n: n };
  }

  /* Kiểm tra và quy đổi một loại xe. n = {L, W, H (mm), payload (kg), cost (VNĐ hoặc null), maxCount}. */
  function prepareVehicle(v) {
    const errors = [];
    const warnings = [];
    const f = UNIT_MM[v.unit];
    const n = { id: v.id, name: v.name, cost: null, maxCount: null, estimatedDims: false };
    if (!String(v.name || '').trim()) errors.push('Chưa đặt tên loại xe.');
    if (!f) errors.push('Đơn vị kích thước không hợp lệ. Chọn mm, cm hoặc m.');

    if (v.mode === 'volume') {
      const vol = num(v.volume);
      const rL = num(v.rL), rW = num(v.rW), rH = num(v.rH);
      if (!(vol > 0)) errors.push('Chưa nhập thể tích (m³). Nhập số lớn hơn 0.');
      if (!(rL > 0) || !(rW > 0) || !(rH > 0)) errors.push('Tỷ lệ dài:rộng:cao phải là các số lớn hơn 0.');
      if (!errors.length) {
        const k = Math.cbrt((vol * 1e9) / (rL * rW * rH));
        n.L = k * rL; n.W = k * rW; n.H = k * rH;
        n.estimatedDims = true;
        warnings.push('Kích thước lòng thùng chỉ ước tính từ thể tích và tỷ lệ. Mô phỏng 3D chính xác cần kích thước thực của thùng xe.');
      }
    } else {
      n.L = num(v.L) * (f || NaN);
      n.W = num(v.W) * (f || NaN);
      n.H = num(v.H) * (f || NaN);
      if (!(n.L > 0) || !(n.W > 0) || !(n.H > 0)) errors.push('Cần nhập đủ kích thước lòng thùng (dài, rộng, cao) lớn hơn 0.');
    }
    n.payload = num(v.payload);
    if (!(n.payload > 0)) errors.push('Chưa nhập tải trọng tối đa (kg). Nhập số lớn hơn 0.');
    if (String(v.cost).trim() !== '') {
      n.cost = num(v.cost);
      if (!(n.cost >= 0)) { errors.push('Cước/chi phí chuyến phải là số không âm (hoặc để trống).'); n.cost = null; }
    }
    if (String(v.maxCount).trim() !== '') {
      n.maxCount = num(v.maxCount);
      if (!(n.maxCount >= 0) || Math.floor(n.maxCount) !== n.maxCount) { errors.push('Số xe tối đa phải là số nguyên không âm (hoặc để trống nếu không giới hạn).'); n.maxCount = null; }
    }
    if (!errors.length) {
      n.volume = (n.L * n.W * n.H) / 1e9;
      const typed = num(v.volume);
      if (v.mode !== 'volume' && typed > 0 && Math.abs(typed - n.volume) / n.volume > 0.02) {
        warnings.push('Thể tích bạn nhập (' + typed + ' m³) khác thể tích tính từ kích thước (' + n.volume.toFixed(2).replace('.', ',') + ' m³). Hệ thống dùng thể tích tính từ kích thước.');
      }
      if (n.H > 4500 || n.W > 3200) warnings.push('Kích thước lòng thùng lớn bất thường. Kiểm tra lại đơn vị.');
    }
    return { errors: errors, warnings: warnings, n: n };
  }

  const api = { UNIT_MM: UNIT_MM, uid: uid, num: num, defaultSettings: defaultSettings, newProduct: newProduct, newVehicle: newVehicle, prepareProduct: prepareProduct, prepareVehicle: prepareVehicle };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  return api;
})();

/* BỘ GIẢI: quy đổi ống thành pallet/kiện/khối rời, rồi xếp lên MỘT xe (3D bin packing).
 * Hệ trục trong thùng xe (mm): x = dọc xe (0 là đầu thùng sát ca-bin, L là cửa sau),
 * y = ngang xe, z = chiều cao từ sàn. Không dùng DOM nên chạy được trong Web Worker và Node. */
const Solver = (function () {
  const M = (typeof Model !== 'undefined') ? Model : require('./model.js');
  const S32 = Math.sqrt(3) / 2;
  const EPS = 1e-6;

  /* ---------- Lưới ống tròn ---------- */

  // Tâm các ống trong một hàng rộng a (hàng lẻ lệch nửa đường kính theo kiểu lục giác).
  function rowCenters(a, d, odd) {
    const out = [];
    for (let x = d / 2 + (odd ? d / 2 : 0); x + d / 2 <= a + EPS; x += d) out.push(x);
    return out;
  }

  function hexGrid(a, b, d) {
    const pts = [];
    for (let i = 0; ; i++) {
      const y = d / 2 + i * d * S32;
      if (y + d / 2 > b + EPS) break;
      rowCenters(a, d, i % 2 === 1).forEach(function (x) { pts.push([x, y]); });
    }
    return pts;
  }

  function squareGrid(a, b, d) {
    const pts = [];
    for (let y = d / 2; y + d / 2 <= b + EPS; y += d) {
      for (let x = d / 2; x + d / 2 <= a + EPS; x += d) pts.push([x, y]);
    }
    return pts;
  }

  const layerCache = new Map();
  // Mặt cắt một lớp ống đứng trên mặt a × b: thử lưới vuông và lưới lục giác theo hai hướng, lấy cách nhiều ống nhất.
  function bestStandLayer(a, b, d) {
    const key = a + '|' + b + '|' + d;
    if (layerCache.has(key)) return layerCache.get(key);
    const cands = [
      { kind: 'vuông', pts: squareGrid(a, b, d) },
      { kind: 'lục giác', pts: hexGrid(a, b, d) },
      { kind: 'lục giác', pts: hexGrid(b, a, d).map(function (p) { return [p[1], p[0]]; }) },
    ];
    let best = cands[0];
    cands.forEach(function (c) { if (c.pts.length > best.pts.length) best = c; });
    if (layerCache.size > 200) layerCache.clear();
    layerCache.set(key, best);
    return best;
  }

  // Mặt cắt ngang của m ống nằm (xếp lục giác từ dưới lên) trong chiều rộng W.
  function crossSection(m, W, d) {
    const pts = [];
    for (let i = 0; pts.length < m; i++) {
      const row = rowCenters(W, d, i % 2 === 1);
      if (!row.length) return null;
      for (let j = 0; j < row.length && pts.length < m; j++) pts.push([row[j], d / 2 + i * d * S32]);
    }
    if (!pts.length) return { pts: [], width: 0, height: 0 };
    let lo = Infinity, hi = -Infinity, top = 0;
    pts.forEach(function (p) { lo = Math.min(lo, p[0]); hi = Math.max(hi, p[0]); top = Math.max(top, p[1]); });
    return { pts: pts, lo: lo - d / 2, hi: hi + d / 2, width: hi - lo + d, height: top + d / 2 };
  }

  // Số ống nằm tối đa trong một mặt cắt cao tối đa Hmax, rộng W.
  function crossCapacity(W, Hmax, d) {
    let cap = 0;
    for (let i = 0; d / 2 + i * d * S32 + d / 2 <= Hmax + EPS; i++) {
      const c = rowCenters(W, d, i % 2 === 1).length;
      if (!c) break;
      cap += c;
    }
    return cap;
  }

  /* ---------- Bố trí ống trên một pallet / khối rời ----------
   * det = {kind:'stand'|'lay', n, R, L, baseH, palL, palW, maxH}  (mm) */

  function layLayout(det) {
    const d = 2 * det.R;
    const kx = det.L <= det.palL ? Math.max(1, Math.floor(det.palL / det.L + EPS)) : 1;
    const m = Math.ceil(det.n / kx);
    return { d: d, kx: kx, m: m, cs: crossSection(m, det.palW, d), l: det.L <= det.palL ? det.palL : det.L };
  }

  function layoutInfo(det) {
    const d = 2 * det.R;
    if (det.kind === 'stand') {
      const lay = bestStandLayer(det.palL, det.palW, d);
      const perLayer = lay.pts.length;
      const maxLayers = Math.floor((det.maxH - det.baseH) / det.L + EPS);
      const layers = Math.ceil(det.n / perLayer);
      return { l: det.palL, w: det.palW, h: det.baseH + layers * det.L, perLayer: perLayer, layers: layers, cap: perLayer * maxLayers, mode: lay.kind };
    }
    const g = layLayout(det);
    const cap = g.kx * crossCapacity(det.palW, det.maxH - det.baseH, d);
    if (!g.cs) return { l: g.l, w: det.palW, h: det.baseH + d, cap: 0, perLayer: 0, layers: 0, mode: 'lục giác' };
    const loose = det.baseH === 0 && det.palKg === 0;
    return { l: g.l, w: loose ? g.cs.width : det.palW, h: det.baseH + g.cs.height, cap: cap, perLayer: g.kx * (g.cs.pts.length ? g.cs.pts.length / Math.max(1, Math.ceil(g.cs.height / (d * S32))) : 0), layers: 0, mode: 'lục giác' };
  }

  // Tọa độ tâm từng ống (x,y,z) trong hệ của khối, dạng mảng phẳng. Dùng để vẽ chi tiết từng ống.
  function tubePositions(det) {
    const d = 2 * det.R;
    const out = new Float32Array(det.n * 3);
    if (det.kind === 'stand') {
      const lay = bestStandLayer(det.palL, det.palW, d);
      const per = lay.pts.length;
      for (let i = 0; i < det.n; i++) {
        const p = lay.pts[i % per];
        const layer = Math.floor(i / per);
        out[i * 3] = p[0]; out[i * 3 + 1] = p[1]; out[i * 3 + 2] = det.baseH + layer * det.L + det.L / 2;
      }
      return out;
    }
    const g = layLayout(det);
    if (!g.cs) return new Float32Array(0);
    const loose = det.baseH === 0 && det.palKg === 0;
    const shift = loose ? -g.cs.lo : (det.palW - g.cs.width) / 2 - g.cs.lo;
    const x0 = (g.l - g.kx * det.L) / 2;
    for (let i = 0; i < det.n; i++) {
      const c = Math.floor(i / g.kx), s = i % g.kx;
      out[i * 3] = x0 + (s + 0.5) * det.L;
      out[i * 3 + 1] = g.cs.pts[c][0] + shift;
      out[i * 3 + 2] = det.baseH + g.cs.pts[c][1];
    }
    return out;
  }

  /* ---------- Quy đổi một dòng hàng thành các khối xếp xe ----------
   * Trả {errors, warnings, units, info}. Mỗi unit là một hình hộp (l × w × h mm, weight kg). */

  function analyzeProduct(raw, settings) {
    const prep = M.prepareProduct(raw, settings);
    const res = { errors: prep.errors.slice(), warnings: prep.warnings.slice(), units: [], info: null, n: prep.n };
    if (res.errors.length) return res;
    const p = prep.n;
    const label = p.code || p.name;
    const mk = function (idx, partial, tubes, l, w, h, weight, detail) {
      return {
        id: p.id + '#' + idx, pid: p.id, code: p.code, name: p.name, customer: p.customer,
        kind: p.packType, partial: partial, tubes: tubes, l: l, w: w, h: h, weight: weight,
        stackable: p.stackable, maxTiers: p.maxTiers, detail: detail,
      };
    };
    let cap, units = [];
    const info = { tubeKg: p.tubeKg, kgEstimated: p.kgEstimated, capacity: null, fullUnits: 0, partialTubes: 0, totalKg: 0, volumeM3: 0 };

    if (p.packType === 'bundle') {
      cap = p.perUnit;
      const total = p.qty;
      const full = Math.floor(total / cap), rest = total - full * cap;
      for (let i = 0; i < full; i++) units.push(mk(i, false, cap, p.bunL, p.bunW, p.bunH, cap * p.tubeKg + p.bunKg, null));
      if (rest) units.push(mk(full, true, rest, p.bunL, p.bunW, p.bunH, rest * p.tubeKg + p.bunKg, null));
      info.fullUnits = full; info.partialTubes = rest;
      // Kiện hình hộp do người dùng nhập: kiểm tra ống có nhét vừa kiện không (chỉ cảnh báo).
      const d = 2 * p.R;
      const fitsIn = Math.min(p.bunL, p.bunW, p.bunH) >= d && Math.max(p.bunL, p.bunW, p.bunH) >= p.L;
      if (!fitsIn) res.warnings.push('Kích thước kiện có vẻ nhỏ hơn ống (đường kính ' + d + ' mm, dài ' + p.L + ' mm). Kiểm tra lại kích thước kiện.');
    } else {
      const base = { kind: p.orient, R: p.R, L: p.L, baseH: p.palH, palL: p.palL, palW: p.palW, maxH: p.maxH, palKg: p.palKg };
      const probe = layoutInfo(Object.assign({ n: 1 }, base));
      cap = p.packType === 'pallet' ? p.perUnit : probe.cap;
      if (!(probe.cap >= 1)) {
        res.errors.push('Ống ' + label + ' không xếp được vào ' + (p.packType === 'pallet' ? 'pallet' : 'khối rời') + ' này (hết chỗ theo chiều cao hoặc chiều rộng). Kiểm tra kích thước ống, pallet và chiều cao tối đa.');
        return res;
      }
      if (p.packType === 'pallet' && p.perUnit > probe.cap) {
        res.errors.push('Mỗi pallet chỉ chứa tối đa ' + probe.cap + ' ống ' + label + ' (xếp ' + (p.orient === 'stand' ? 'đứng' : 'nằm') + ', cao tối đa ' + p.maxH + ' mm). Giảm số ống/pallet xuống ' + probe.cap + ' hoặc ít hơn.');
        return res;
      }
      info.maxPerPallet = probe.cap;
      info.layoutMode = probe.mode;
      const full = Math.floor(p.qty / cap), rest = p.qty - full * cap;
      const build = function (i, partial, n) {
        const det = Object.assign({ n: n }, base);
        const li = layoutInfo(det);
        return mk(i, partial, n, li.l, li.w, li.h, n * p.tubeKg + p.palKg, det);
      };
      if (full > 0) {
        const protoUnit = build(0, false, cap);
        for (let i = 0; i < full; i++) units.push(Object.assign({}, protoUnit, { id: p.id + '#' + i }));
      }
      if (rest) units.push(build(full, true, rest));
      info.fullUnits = full; info.partialTubes = rest;
      if (p.packType === 'pallet' && p.orient === 'lay' && p.L > p.palL) {
        res.warnings.push('Ống dài hơn pallet (' + p.L + ' mm so với ' + p.palL + ' mm): ống thò ra ngoài pallet, khối hàng được tính theo chiều dài ống.');
      }
    }
    info.capacity = cap;
    info.totalKg = units.reduce(function (s, u) { return s + u.weight; }, 0);
    info.volumeM3 = units.reduce(function (s, u) { return s + (u.l * u.w * u.h) / 1e9; }, 0);
    info.unitCount = units.length;
    if (info.partialTubes) {
      const need = cap - info.partialTubes;
      res.warnings.push('Có 1 ' + (p.packType === 'bundle' ? 'kiện' : p.packType === 'pallet' ? 'pallet' : 'khối') + ' lẻ (' + info.partialTubes + ' ống, thiếu ' + need + ' ống để tròn). Có thể gom thêm đơn cùng mã để tròn.');
    }
    res.units = units;
    res.info = info;
    return res;
  }

  /* ---------- Xếp nhiều khối vào MỘT xe ----------
   * Thuật toán: extreme points (điểm cực). Mỗi khối thử tại mọi điểm cực với 2 hướng xoay ngang (không lật),
   * chọn vị trí thấp nhất rồi gần đầu thùng nhất. Thử nhiều thứ tự sắp xếp, giữ kết quả tốt nhất. */

  function runOrder(order, V, payload, gap) {
    const placed = [];
    const unplaced = [];
    let pts = [{ x: 0, y: 0, z: 0 }];
    let wsum = 0;
    order.forEach(function (u) {
      if (wsum + u.weight > payload + EPS) { unplaced.push({ unit: u, reason: 'weight' }); return; }
      let best = null;
      for (let k = 0; k < pts.length; k++) {
        const p = pts[k];
        for (let r = 0; r < 2; r++) {
          if (r === 1 && Math.abs(u.l - u.w) < EPS) break;
          const rl = r ? u.w : u.l, rw = r ? u.l : u.w;
          const gl = rl + gap, gw = rw + gap;
          if (p.x + gl > V.L + gap + EPS || p.y + gw > V.W + gap + EPS || p.z + u.h > V.H + EPS) continue;
          let ok = true, support = 0, tier = 1, tierCap = u.stackable ? u.maxTiers : 99, supportOk = true;
          for (let i = 0; i < placed.length; i++) {
            const b = placed[i];
            const ox = Math.min(p.x + gl, b.x + b.gl) - Math.max(p.x, b.x);
            if (ox <= EPS) continue;
            const oy = Math.min(p.y + gw, b.y + b.gw) - Math.max(p.y, b.y);
            if (oy <= EPS) continue;
            const oz = Math.min(p.z + u.h, b.z + b.h) - Math.max(p.z, b.z);
            if (oz > EPS) { ok = false; break; }
            if (Math.abs(b.z + b.h - p.z) < 0.5) {
              support += ox * oy;
              if (!b.u.stackable) supportOk = false;
              tier = Math.max(tier, b.tier + 1);
              tierCap = Math.min(tierCap, b.u.maxTiers);
            }
          }
          if (!ok) continue;
          if (p.z > EPS && (!supportOk || support < 0.8 * gl * gw - EPS || tier > tierCap)) continue;
          const score = p.z * 1e6 + p.x * 1e3 + p.y;
          if (!best || score < best.score) best = { score: score, p: p, r: r, rl: rl, rw: rw, gl: gl, gw: gw, tier: tier };
        }
      }
      if (!best) { unplaced.push({ unit: u, reason: 'space' }); return; }
      const box = { u: u, x: best.p.x, y: best.p.y, z: best.p.z, l: best.rl, w: best.rw, h: u.h, gl: best.gl, gw: best.gw, rot: best.r, tier: best.tier };
      placed.push(box);
      wsum += u.weight;
      const next = [];
      const seen = new Set();
      const push = function (q) {
        const key = Math.round(q.x * 10) + '|' + Math.round(q.y * 10) + '|' + Math.round(q.z * 10);
        if (seen.has(key)) return;
        seen.add(key);
        next.push(q);
      };
      pts.forEach(function (q) { if (q !== best.p) push(q); });
      push({ x: box.x + box.gl, y: box.y, z: box.z });
      push({ x: box.x, y: box.y + box.gw, z: box.z });
      push({ x: box.x, y: box.y, z: box.z + box.h });
      // Bỏ điểm nằm lọt trong khối vừa đặt.
      pts = next.filter(function (q) {
        return !(q.x > box.x + EPS && q.x < box.x + box.gl - EPS && q.y > box.y + EPS && q.y < box.y + box.gw - EPS && q.z > box.z - EPS && q.z < box.z + box.h - EPS);
      });
    });
    return { placed: placed, unplaced: unplaced, weight: wsum };
  }

  function packVehicle(units, veh, opts) {
    opts = opts || {};
    const gap = opts.gap || 0;
    const V = { L: veh.L, W: veh.W, H: veh.H };
    const payload = veh.payload;
    const unplaced = [];
    const cand = [];
    units.forEach(function (u) {
      const fits = u.h <= V.H + EPS && ((u.l <= V.L + EPS && u.w <= V.W + EPS) || (u.w <= V.L + EPS && u.l <= V.W + EPS));
      if (!fits) {
        const why = u.h > V.H + EPS
          ? 'Cao ' + Math.round(u.h) + ' mm, cao hơn lòng thùng xe (' + Math.round(V.H) + ' mm).'
          : 'Kích thước ' + Math.round(u.l) + ' × ' + Math.round(u.w) + ' mm, không nằm lọt sàn xe (' + Math.round(V.L) + ' × ' + Math.round(V.W) + ' mm).';
        unplaced.push({ unit: u, reason: why });
      } else if (u.weight > payload + EPS) {
        unplaced.push({ unit: u, reason: 'Nặng ' + u.weight.toFixed(1) + ' kg, vượt tải trọng xe (' + payload + ' kg).' });
      } else cand.push(u);
    });
    const vol = function (u) { return u.l * u.w * u.h; };
    const orders = [
      cand.slice().sort(function (a, b) { return vol(b) - vol(a); }),
      cand.slice().sort(function (a, b) { return (b.l * b.w) - (a.l * a.w) || b.h - a.h; }),
      cand.slice().sort(function (a, b) { return b.h - a.h || (b.l * b.w) - (a.l * a.w); }),
      cand.slice().sort(function (a, b) { return b.weight - a.weight; }),
      cand.slice(),
    ];
    let best = null;
    orders.forEach(function (o) {
      const r = runOrder(o, V, payload, gap);
      const v = r.placed.reduce(function (s, b) { return s + b.l * b.w * b.h; }, 0);
      if (!best || v > best.v + EPS || (Math.abs(v - best.v) <= EPS && r.placed.length > best.r.placed.length)) best = { r: r, v: v };
    });
    const r = best ? best.r : { placed: [], unplaced: [], weight: 0 };
    r.unplaced.forEach(function (x) {
      unplaced.push({ unit: x.unit, reason: x.reason === 'weight' ? 'Thêm vào sẽ vượt tải trọng xe (' + payload + ' kg).' : 'Hết chỗ trong thùng xe.' });
    });

    const placements = r.placed.map(function (b, i) {
      return { uid: b.u.id, seq: i + 1, x: b.x, y: b.y, z: b.z, l: b.l, w: b.w, h: b.h, rot: b.rot, tier: b.tier };
    });
    const metrics = vehicleMetrics(r.placed, V, payload);
    return { placements: placements, unplaced: unplaced, metrics: metrics, warnings: metrics.warnings };
  }

  function vehicleMetrics(placed, V, payload) {
    let vol = 0, wt = 0, cx = 0, cy = 0, cz = 0;
    placed.forEach(function (b) {
      vol += b.l * b.w * b.h;
      const w = b.u.weight;
      wt += w; cx += w * (b.x + b.l / 2); cy += w * (b.y + b.w / 2); cz += w * (b.z + b.h / 2);
    });
    const m = {
      volumePct: (vol / (V.L * V.W * V.H)) * 100,
      weightPct: (wt / payload) * 100,
      weightKg: wt, count: placed.length, volumeM3: vol / 1e9,
      cog: wt > 0 ? { x: cx / wt, y: cy / wt, z: cz / wt } : null,
      warnings: [],
    };
    if (m.cog) {
      m.cogOffX = (m.cog.x - V.L / 2) / V.L;
      m.cogOffY = (m.cog.y - V.W / 2) / V.W;
      if (Math.abs(m.cogOffY) > 0.10) m.warnings.push('Trọng tâm lệch ' + (m.cogOffY > 0 ? 'phải' : 'trái') + ' ' + Math.abs(m.cogOffY * 100).toFixed(1).replace('.', ',') + '% chiều rộng thùng (ngưỡng cảnh báo 10%).');
      if (Math.abs(m.cogOffX) > 0.15) m.warnings.push('Trọng tâm lệch về ' + (m.cogOffX > 0 ? 'phía cửa sau' : 'phía đầu thùng') + ' ' + Math.abs(m.cogOffX * 100).toFixed(1).replace('.', ',') + '% chiều dài thùng (ngưỡng cảnh báo 15%).');
    }
    return m;
  }

  /* Kiểm tra độc lập một kết quả xếp: trả danh sách lỗi (rỗng là hợp lệ). Dùng trong kiểm thử. */
  function verifyPlacement(placements, unitsById, veh, gap) {
    const errs = [];
    gap = gap || 0;
    placements.forEach(function (a, i) {
      if (a.x < -EPS || a.y < -EPS || a.z < -EPS || a.x + a.l > veh.L + EPS || a.y + a.w > veh.W + EPS || a.z + a.h > veh.H + EPS) errs.push('ngoài thùng: ' + a.uid);
      for (let j = i + 1; j < placements.length; j++) {
        const b = placements[j];
        if (Math.min(a.x + a.l, b.x + b.l) - Math.max(a.x, b.x) > EPS &&
            Math.min(a.y + a.w, b.y + b.w) - Math.max(a.y, b.y) > EPS &&
            Math.min(a.z + a.h, b.z + b.h) - Math.max(a.z, b.z) > EPS) errs.push('chồng lấn: ' + a.uid + ' và ' + b.uid);
      }
    });
    const total = placements.reduce(function (s, p) { return s + unitsById[p.uid].weight; }, 0);
    if (total > veh.payload + EPS) errs.push('vượt tải trọng');
    return errs;
  }

  const api = {
    analyzeProduct: analyzeProduct, layoutInfo: layoutInfo, tubePositions: tubePositions,
    bestStandLayer: bestStandLayer, packVehicle: packVehicle, verifyPlacement: verifyPlacement,
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  return api;
})();

</script>
<script>
/* LỚP HIỂN THỊ 3D (Three.js). Chỉ nhận dữ liệu thuần từ bộ giải, không tự tính xếp hàng.
 * Hệ trục Three: X = dọc thùng xe, Y = chiều cao, Z = ngang thùng xe; đơn vị mét. */
const View3D = (function () {
  const MM = 0.001;
  const PALETTE = [0x4e79a7, 0xf28e2b, 0xe15759, 0x76b7b2, 0x59a14f, 0xedc948, 0xb07aa1, 0xff9da7, 0x9c755f, 0xbab0ac, 0x2f6f8f, 0x8cd17d];
  const MAX_TUBES = 60000;

  function colorFor(scheme, unit, ctx) {
    if (scheme === 'weight') {
      const t = ctx.maxW > ctx.minW ? (unit.weight - ctx.minW) / (ctx.maxW - ctx.minW) : 0;
      return new THREE.Color().setHSL(0.6 - 0.6 * t, 0.7, 0.5);
    }
    const key = scheme === 'customer' ? (unit.customer || '(chưa có khách)') : (unit.code || unit.name);
    if (!ctx.keys.has(key)) ctx.keys.set(key, new THREE.Color(PALETTE[ctx.keys.size % PALETTE.length]));
    return ctx.keys.get(key);
  }

  function create(canvasHost, onPick) {
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf4f6f8);
    const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 200);
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    canvasHost.appendChild(renderer.domElement);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 0.85));
    const sun = new THREE.DirectionalLight(0xffffff, 0.6);
    sun.position.set(6, 10, 4);
    scene.add(sun);

    const group = new THREE.Group();
    scene.add(group);
    const raycaster = new THREE.Raycaster();
    let pickables = [];
    let dims = { L: 6, W: 2, H: 2 };
    let selected = null;
    let ro = null;

    function resize() {
      const w = canvasHost.clientWidth || 600, h = canvasHost.clientHeight || 400;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    if (window.ResizeObserver) { ro = new ResizeObserver(resize); ro.observe(canvasHost); }
    window.addEventListener('resize', resize);
    resize();

    let down = null;
    renderer.domElement.addEventListener('pointerdown', function (e) { down = [e.clientX, e.clientY]; });
    renderer.domElement.addEventListener('pointerup', function (e) {
      if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 4) return;
      const r = renderer.domElement.getBoundingClientRect();
      raycaster.setFromCamera({ x: ((e.clientX - r.left) / r.width) * 2 - 1, y: -((e.clientY - r.top) / r.height) * 2 + 1 }, camera);
      const hit = raycaster.intersectObjects(pickables, false)[0];
      select(hit ? hit.object.userData.uid : null);
      if (onPick) onPick(hit ? hit.object.userData : null);
    });

    function select(uid) {
      selected = uid;
      pickables.forEach(function (m) {
        m.userData.edge.material.color.set(m.userData.uid === uid ? 0xd62728 : 0x2b2b2b);
        m.userData.edge.material.linewidth = 2;
      });
    }

    function clear() {
      while (group.children.length) {
        const o = group.children.pop();
        o.traverse(function (c) { if (c.geometry) c.geometry.dispose(); if (c.material) c.material.dispose(); });
      }
      pickables = [];
    }

    /* data = {vehicle:{L,W,H}, placements, unitsById, scheme, detail, cog} */
    function setScene(data) {
      clear();
      const V = data.vehicle;
      dims = { L: V.L * MM, W: V.W * MM, H: V.H * MM };
      const cx = -dims.L / 2, cz = -dims.W / 2;

      // Sàn và khung thùng xe trong suốt.
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(dims.L, dims.W), new THREE.MeshBasicMaterial({ color: 0xd9dee3, side: THREE.DoubleSide }));
      floor.rotation.x = -Math.PI / 2;
      floor.position.set(0, -0.002, 0);
      group.add(floor);
      const frame = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(dims.L, dims.H, dims.W)), new THREE.LineBasicMaterial({ color: 0x555d66 }));
      frame.position.set(0, dims.H / 2, 0);
      group.add(frame);
      // Mũi tên đầu thùng (sát ca-bin) để người xem biết hướng.
      const cab = new THREE.Mesh(new THREE.BoxGeometry(0.04, dims.H * 0.9, dims.W), new THREE.MeshBasicMaterial({ color: 0x8aa4b8, transparent: true, opacity: 0.25 }));
      cab.position.set(cx - 0.02, dims.H * 0.45, 0);
      group.add(cab);

      const ctx = { keys: new Map(), minW: Infinity, maxW: 0 };
      data.placements.forEach(function (p) { const w = data.unitsById[p.uid].weight; ctx.minW = Math.min(ctx.minW, w); ctx.maxW = Math.max(ctx.maxW, w); });
      const legend = new Map();

      let tubeBudget = MAX_TUBES;
      data.placements.forEach(function (p) {
        const u = data.unitsById[p.uid];
        const color = colorFor(data.scheme, u, ctx);
        legend.set(data.scheme === 'weight' ? 'w' : (data.scheme === 'customer' ? (u.customer || '(chưa có khách)') : (u.code || u.name)), color);
        const showTubes = data.detail && u.detail && u.detail.n <= tubeBudget;
        const geo = new THREE.BoxGeometry(p.l * MM, p.h * MM, p.w * MM);
        const mat = new THREE.MeshLambertMaterial({ color: color, transparent: true, opacity: showTubes ? 0.12 : 1 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(cx + (p.x + p.l / 2) * MM, (p.z + p.h / 2) * MM, cz + (p.y + p.w / 2) * MM);
        const edge = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: 0x2b2b2b }));
        mesh.add(edge);
        mesh.userData = { uid: p.uid, edge: edge, seq: p.seq };
        group.add(mesh);
        pickables.push(mesh);
        if (showTubes) {
          tubeBudget -= u.detail.n;
          group.add(tubeMesh(u, p, color, cx, cz));
        }
      });
      if (data.cog) {
        const m = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 12), new THREE.MeshBasicMaterial({ color: 0xd62728 }));
        m.position.set(cx + data.cog.x * MM, 0.07, cz + data.cog.y * MM);
        group.add(m);
        const c = new THREE.Mesh(new THREE.RingGeometry(0.06, 0.09, 24), new THREE.MeshBasicMaterial({ color: 0x1f77b4, side: THREE.DoubleSide }));
        c.rotation.x = -Math.PI / 2; c.position.set(0, 0.005, 0);
        group.add(c);
      }
      select(selected);
      return legend;
    }

    // Vẽ từng ống bằng InstancedMesh để mượt. Ống đứng có trục dọc, ống nằm có trục theo chiều dài xe.
    function tubeMesh(u, p, color, cx, cz) {
      const det = u.detail;
      const pos = Solver.tubePositions(det);
      const geo = new THREE.CylinderGeometry(det.R * MM, det.R * MM, det.L * MM, 10);
      const mesh = new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial({ color: color.clone().offsetHSL(0, -0.1, 0.12) }), det.n);
      const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(1, 1, 1), t = new THREE.Vector3();
      if (det.kind === 'lay') q.setFromAxisAngle(new THREE.Vector3(0, 0, 1), Math.PI / 2);
      for (let i = 0; i < det.n; i++) {
        let lx = pos[i * 3], ly = pos[i * 3 + 1], lz = pos[i * 3 + 2];
        if (p.rot) { const tmp = lx; lx = ly; ly = u.l - tmp; } // khối xoay 90 độ quanh trục đứng
        t.set(cx + (p.x + lx) * MM, (p.z + lz) * MM, cz + (p.y + ly) * MM);
        m.compose(t, p.rot && det.kind === 'lay' ? new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI / 2).multiply(q) : q, s);
        mesh.setMatrixAt(i, m);
      }
      mesh.instanceMatrix.needsUpdate = true;
      return mesh;
    }

    function setView(name) {
      const L = dims.L, W = dims.W, H = dims.H;
      const d = Math.max(L, W, H) * 1.9;
      const target = new THREE.Vector3(0, H * 0.4, 0);
      const views = {
        iso: [L * 0.55, H * 1.6 + W * 0.3, W * 1.5 + L * 0.35],
        back: [L / 2 + d, H * 0.5, 0.001],
        front: [-L / 2 - d, H * 0.5, 0.001],
        top: [0.001, d * 1.5, 0.001],
        side: [0, H * 0.5, W / 2 + d],
      };
      const v = views[name] || views.iso;
      camera.position.set(v[0], v[1], v[2]);
      controls.target.copy(target);
      controls.update();
    }

    function snapshot() { renderer.render(scene, camera); return renderer.domElement.toDataURL('image/png'); }

    let raf = 0;
    (function loop() { raf = requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();

    return { setScene: setScene, setView: setView, select: select, snapshot: snapshot, resize: resize,
      dispose: function () { cancelAnimationFrame(raf); if (ro) ro.disconnect(); renderer.dispose(); } };
  }

  return { create: create, PALETTE: PALETTE, MAX_TUBES: MAX_TUBES };
})();

<script>
/* GIAO DIỆN: các tab nhập sản phẩm, xe, và xếp thử một xe. Toàn bộ chữ hiển thị là tiếng Việt. */
(function () {
  'use strict';
  const STORE_KEY = 'xeh.v1';
  const nf = function (x, d) { return Number(x).toLocaleString('vi-VN', { maximumFractionDigits: d === undefined ? 1 : d }); };
  const fmt = {
    kg: function (x) { return nf(x, 1) + ' kg'; },
    mm: function (x) { return nf(x, 0) + ' mm'; },
    m3: function (x) { return nf(x, 2) + ' m³'; },
    pct: function (x) { return nf(x, 1) + '%'; },
  };

  /* ---------- Trạng thái và lưu trữ ---------- */
  const state = { products: [], vehicles: [], settings: Model.defaultSettings(), vehId: null, scheme: 'code', detail: false, result: null, picked: null };

  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify({ products: state.products, vehicles: state.vehicles, settings: state.settings })); } catch (e) { /* trình duyệt chặn lưu: bỏ qua */ } }
  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return false;
      const d = JSON.parse(raw);
      state.products = (d.products || []).map(function (p) { return Model.newProduct(p); });
      state.vehicles = (d.vehicles || []).map(function (v) { return Model.newVehicle(v); });
      state.settings = Object.assign(Model.defaultSettings(), d.settings || {});
      return state.products.length + state.vehicles.length > 0;
    } catch (e) { return false; }
  }

  /* ---------- Tiện ích DOM ---------- */
  function el(tag, attrs) {
    const e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      const v = attrs[k];
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
      else if (v === true) e.setAttribute(k, '');
      else if (v !== false && v !== null && v !== undefined) e.setAttribute(k, v);
    });
    const add = function (c) {
      if (c === null || c === undefined || c === false) return;
      if (Array.isArray(c)) { c.forEach(add); return; }
      e.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
    };
    for (let i = 2; i < arguments.length; i++) add(arguments[i]);
    return e;
  }
  const $ = function (id) { return document.getElementById(id); };
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove('show'); }, 3500);
  }

  /* ---------- Phân tích dữ liệu ---------- */
  let analysisCache = new Map();
  function analyze(p) {
    const key = JSON.stringify([p, state.settings]);
    if (!analysisCache.has(key)) {
      if (analysisCache.size > 300) analysisCache.clear();
      analysisCache.set(key, Solver.analyzeProduct(p, state.settings));
    }
    return analysisCache.get(key);
  }

  /* ---------- Tab 1: Sản phẩm ---------- */
  const PACK_NAME = { pallet: 'Xếp pallet', bundle: 'Đóng kiện', loose: 'Rời' };

  function renderProducts() {
    const host = $('tab-products');
    host.textContent = '';
    const s = state.settings;
    host.appendChild(el('div', { class: 'toolbar' },
      el('button', { class: 'primary', onclick: function () { openProductDialog(Model.newProduct()); } }, '+ Thêm sản phẩm'),
      el('button', { onclick: loadSample }, 'Nạp dữ liệu mẫu'),
      el('span', { class: 'spacer' }),
      settingInput('Tỷ trọng giấy (ước tính)', 'density', 'kg/m³'),
      settingInput('Khe hở giữa các khối', 'gap', 'mm')));
    if (!state.products.length) {
      host.appendChild(el('div', { class: 'empty' }, 'Chưa có sản phẩm nào. Bấm "+ Thêm sản phẩm" hoặc "Nạp dữ liệu mẫu" để thử nhanh.'));
      return;
    }
    const head = ['Mã hàng / tên', 'Số ống', 'Đóng gói', 'kg / ống', 'Đầy', 'Lẻ (ống)', 'Tổng khối lượng', 'Thể tích khối', 'Trạng thái', ''];
    const tbody = el('tbody');
    const notes = el('div', { class: 'notes' });
    state.products.forEach(function (p) {
      const a = analyze(p);
      const i = a.info;
      const unitWord = p.packType === 'bundle' ? 'kiện' : p.packType === 'loose' ? 'khối' : 'pallet';
      const status = a.errors.length ? el('span', { class: 'tag err' }, 'Lỗi') : a.warnings.length ? el('span', { class: 'tag warn' }, 'Cần xem') : el('span', { class: 'tag ok' }, 'Hợp lệ');
      tbody.appendChild(el('tr', null,
        el('td', null, el('b', null, p.code || ''), el('div', { class: 'sub' }, p.name || '')),
        el('td', { class: 'num' }, nf(Model.num(p.qty) || 0, 0)),
        el('td', null, PACK_NAME[p.packType] + (p.packType !== 'loose' ? ' (' + (p.perUnit || '?') + ' ống/' + unitWord + ')' : ''), el('div', { class: 'sub' }, (p.orient === 'lay' || p.packType === 'loose') ? 'Xếp nằm' : 'Xếp đứng')),
        el('td', { class: 'num' }, i ? nf(i.tubeKg, 3) + (i.kgEstimated ? ' (ước tính)' : '') : '–'),
        el('td', { class: 'num' }, i ? nf(i.fullUnits, 0) + ' ' + unitWord : '–'),
        el('td', { class: 'num' }, i ? (i.partialTubes ? nf(i.partialTubes, 0) + ' (1 ' + unitWord + ' lẻ)' : '0') : '–'),
        el('td', { class: 'num' }, i ? fmt.kg(i.totalKg) : '–'),
        el('td', { class: 'num' }, i ? fmt.m3(i.volumeM3) : '–'),
        el('td', null, status),
        el('td', { class: 'actions' },
          el('button', { onclick: function () { openProductDialog(Object.assign({}, p)); } }, 'Sửa'),
          el('button', { onclick: function () { const c = Model.newProduct(Object.assign({}, p, { id: Model.uid('p'), code: (p.code || '') + ' (bản sao)' })); state.products.push(c); save(); renderProducts(); } }, 'Nhân bản'),
          el('button', { class: 'danger', onclick: function () { if (confirm('Xóa sản phẩm "' + (p.code || p.name) + '"?')) { state.products = state.products.filter(function (x) { return x.id !== p.id; }); save(); renderProducts(); } } }, 'Xóa'))));
      a.errors.forEach(function (m) { notes.appendChild(el('div', { class: 'note err' }, (p.code || p.name) + ': ' + m)); });
      a.warnings.forEach(function (m) { notes.appendChild(el('div', { class: 'note warn' }, (p.code || p.name) + ': ' + m)); });
    });
    host.appendChild(el('div', { class: 'tablewrap' }, el('table', null, el('thead', null, el('tr', null, head.map(function (h) { return el('th', { text: h }); }))), tbody)));
    host.appendChild(notes);
    host.appendChild(el('p', { class: 'hint' }, 'Khối lượng ống tính từ độ dày thành ống là ước tính (theo tỷ trọng giấy ở trên). Nhập kg thực tế nếu có để chính xác hơn.'));
  }

  function settingInput(label, key, unit) {
    const inp = el('input', { type: 'text', inputmode: 'decimal', value: state.settings[key], size: 6, onchange: function () {
      const v = Model.num(inp.value);
      if (!(v >= 0)) { toast('Giá trị "' + label + '" phải là số không âm.'); inp.value = state.settings[key]; return; }
      state.settings[key] = v; save(); renderProducts();
    } });
    return el('label', { class: 'inline' }, label + ' ', inp, ' ' + unit);
  }

  /* ---------- Hộp thoại sản phẩm ---------- */
  function openProductDialog(p) {
    const isNew = !state.products.some(function (x) { return x.id === p.id; });
    const dlg = $('dlg');
    dlg.textContent = '';
    const preview = el('div', { class: 'preview' });
    const body = el('div', { class: 'formbody' });
    function rerender() { buildProductForm(body, p, refresh); refresh(); }
    function refresh() {
      preview.textContent = '';
      const a = Solver.analyzeProduct(p, state.settings);
      a.errors.forEach(function (m) { preview.appendChild(el('div', { class: 'note err' }, m)); });
      a.warnings.forEach(function (m) { preview.appendChild(el('div', { class: 'note warn' }, m)); });
      if (a.info) {
        const i = a.info, u0 = a.units[0];
        const unitWord = a.n.packType === 'bundle' ? 'kiện' : a.n.packType === 'loose' ? 'khối' : 'pallet';
        const lines = [
          'Khối lượng 1 ống: ' + nf(i.tubeKg, 3) + ' kg' + (i.kgEstimated ? ' (ước tính từ độ dày và tỷ trọng giấy)' : ' (thực tế)'),
          'Tối đa mỗi ' + unitWord + ': ' + (i.maxPerPallet !== undefined ? nf(i.maxPerPallet, 0) + ' ống (cách xếp ' + i.layoutMode + ')' : nf(i.capacity, 0) + ' ống (theo quy cách nhập)'),
          'Kết quả: ' + nf(i.fullUnits, 0) + ' ' + unitWord + ' đầy' + (i.partialTubes ? ' + 1 ' + unitWord + ' lẻ ' + nf(i.partialTubes, 0) + ' ống' : '') + ' (tổng ' + fmt.kg(i.totalKg) + ')',
        ];
        if (u0) lines.push('Kích thước 1 ' + unitWord + ' đầy: ' + nf(u0.l, 0) + ' × ' + nf(u0.w, 0) + ' × ' + nf(u0.h, 0) + ' mm, nặng ' + fmt.kg(u0.weight));
        lines.forEach(function (t) { preview.appendChild(el('div', { class: 'note ok' }, t)); });
      }
      saveBtn.disabled = a.errors.length > 0;
    }
    const saveBtn = el('button', { class: 'primary', onclick: function () {
      if (isNew) state.products.push(p); else state.products = state.products.map(function (x) { return x.id === p.id ? p : x; });
      save(); dlg.close(); renderProducts();
    } }, 'Lưu sản phẩm');
    dlg.appendChild(el('h2', null, isNew ? 'Thêm sản phẩm (ống giấy)' : 'Sửa sản phẩm'));
    dlg.appendChild(body);
    dlg.appendChild(el('h3', null, 'Tính toán thử'));
    dlg.appendChild(preview);
    dlg.appendChild(el('div', { class: 'dlgfoot' }, el('button', { onclick: function () { dlg.close(); } }, 'Hủy'), saveBtn));
    rerender();
    dlg.showModal();
  }

  // Dựng biểu mẫu sản phẩm. onInput: chỉ cập nhật phần tính thử; đổi lựa chọn thì dựng lại biểu mẫu.
  function buildProductForm(body, p, onInput) {
    body.textContent = '';
    const again = function () { buildProductForm(body, p, onInput); onInput(); };
    const txt = function (key, label, hint, opts) {
      opts = opts || {};
      const inp = el('input', { type: 'text', inputmode: opts.text ? 'text' : 'decimal', value: p[key] === undefined ? '' : p[key], oninput: function () { p[key] = inp.value; onInput(); } });
      return el('label', { class: 'f' }, el('span', null, label), inp, hint ? el('small', null, hint) : null);
    };
    const sel = function (key, label, options, hint) {
      const s = el('select', { onchange: function () { p[key] = s.value; again(); } },
        options.map(function (o) { return el('option', { value: o[0], selected: String(p[key]) === o[0] }, o[1]); }));
      return el('label', { class: 'f' }, el('span', null, label), s, hint ? el('small', null, hint) : null);
    };
    const chk = function (key, label) {
      const c = el('input', { type: 'checkbox', checked: !!p[key], onchange: function () { p[key] = c.checked; again(); } });
      return el('label', { class: 'f check' }, c, el('span', null, label));
    };
    const section = function (title) { return el('h3', null, title); };
    const grid = function () { return el('div', { class: 'grid' }, Array.prototype.slice.call(arguments)); };
    const u = p.unit;
    body.appendChild(section('Thông tin hàng'));
    body.appendChild(grid(txt('code', 'Mã hàng', '', { text: true }), txt('name', 'Tên hàng', '', { text: true }), txt('customer', 'Khách hàng (dùng để tô màu)', 'Không bắt buộc', { text: true }), txt('qty', 'Số lượng ống (cái)')));
    body.appendChild(section('Kích thước và khối lượng ống'));
    body.appendChild(grid(
      sel('unit', 'Đơn vị nhập kích thước', [['mm', 'mm'], ['cm', 'cm'], ['m', 'm']]),
      txt('L', 'Chiều dài ống (' + u + ')'),
      sel('sizeMode', 'Nhập theo', [['radius', 'Bán kính ngoài'], ['diameter', 'Đường kính ngoài']], 'Mặc định là bán kính. Đường kính = 2 × bán kính.'),
      txt('size', (p.sizeMode === 'diameter' ? 'Đường kính ngoài' : 'Bán kính ngoài') + ' (' + u + ')'),
      sel('weightMode', 'Khối lượng ống', [['thickness', 'Ước tính từ độ dày thành ống'], ['kg', 'Nhập kg thực tế / ống']]),
      p.weightMode === 'kg' ? txt('kg', 'Khối lượng thực tế (kg / ống)') : txt('T', 'Độ dày thành ống (' + u + ')')));
    body.appendChild(section('Cách xếp'));
    body.appendChild(grid(
      sel('orient', 'Hướng ống', [['stand', 'Xếp đứng (không được lật)'], ['lay', 'Xếp nằm']], p.packType === 'loose' ? 'Hàng rời luôn xếp nằm.' : ''),
      chk('stackable', 'Cho phép xếp chồng hàng khác lên'),
      p.stackable ? txt('maxTiers', 'Số tầng chồng tối đa') : null,
      chk('nestable', 'Cho phép lồng ống nhỏ vào ống lớn (chưa tính ở GĐ1)')));
    body.appendChild(section('Quy cách đóng gói'));
    body.appendChild(grid(
      sel('packType', 'Kiểu đóng gói', [['pallet', 'Xếp pallet'], ['bundle', 'Đóng kiện'], ['loose', 'Rời (không đóng gói)']]),
      p.packType !== 'loose' ? txt('perUnit', p.packType === 'pallet' ? 'Số ống / 1 pallet' : 'Số ống / 1 kiện', p.packType === 'pallet' ? 'Xem "Tối đa mỗi pallet" ở phần tính thử bên dưới.' : '') : null));
    if (p.packType === 'pallet') {
      body.appendChild(grid(txt('palL', 'Pallet dài (mm)'), txt('palW', 'Pallet rộng (mm)'), txt('palH', 'Chiều cao phần pallet gỗ (mm)'), txt('palKg', 'Khối lượng pallet gỗ (kg)'), txt('maxH', 'Chiều cao tối đa cả pallet + hàng (mm)')));
    } else if (p.packType === 'bundle') {
      body.appendChild(grid(txt('bunL', 'Kiện dài (mm)'), txt('bunW', 'Kiện rộng (mm)'), txt('bunH', 'Kiện cao (mm)'), txt('bunKg', 'Khối lượng bì kiện (kg)')));
    } else {
      body.appendChild(el('p', { class: 'hint' }, 'Hàng rời được gom thành các khối ống nằm xếp lục giác (rộng tối đa ' + nf(state.settings.looseWidth, 0) + ' mm, cao tối đa ' + nf(state.settings.looseMaxH, 0) + ' mm).'));
    }
  }

  /* ---------- Tab 2: Xe ---------- */
  function renderVehicles() {
    const host = $('tab-vehicles');
    host.textContent = '';
    host.appendChild(el('div', { class: 'toolbar' },
      el('button', { class: 'primary', onclick: function () { openVehicleDialog(Model.newVehicle()); } }, '+ Thêm loại xe'),
      el('button', { onclick: addPresets }, 'Thêm các xe mẫu để sửa')));
    if (!state.vehicles.length) {
      host.appendChild(el('div', { class: 'empty' }, 'Chưa có loại xe nào. Bấm "Thêm các xe mẫu để sửa" rồi chỉnh theo xe thực tế của công ty.'));
      return;
    }
    const tbody = el('tbody');
    const notes = el('div', { class: 'notes' });
    state.vehicles.forEach(function (v) {
      const r = Model.prepareVehicle(v);
      const n = r.n;
      tbody.appendChild(el('tr', null,
        el('td', null, el('b', null, v.name || '(chưa đặt tên)')),
        el('td', { class: 'num' }, r.errors.length ? '–' : nf(n.L, 0) + ' × ' + nf(n.W, 0) + ' × ' + nf(n.H, 0) + ' mm' + (n.estimatedDims ? ' (ước tính)' : '')),
        el('td', { class: 'num' }, r.errors.length ? '–' : fmt.m3(n.volume)),
        el('td', { class: 'num' }, r.errors.length ? '–' : fmt.kg(n.payload)),
        el('td', { class: 'num' }, n.cost === null ? '–' : nf(n.cost, 0) + ' đ'),
        el('td', { class: 'num' }, n.maxCount === null ? 'Không giới hạn' : nf(n.maxCount, 0)),
        el('td', { class: 'actions' },
          el('button', { onclick: function () { openVehicleDialog(Object.assign({}, v)); } }, 'Sửa'),
          el('button', { class: 'danger', onclick: function () { if (confirm('Xóa loại xe "' + v.name + '"?')) { state.vehicles = state.vehicles.filter(function (x) { return x.id !== v.id; }); save(); renderVehicles(); } } }, 'Xóa'))));
      r.errors.concat(r.warnings).forEach(function (m, k) { notes.appendChild(el('div', { class: 'note ' + (k < r.errors.length ? 'err' : 'warn') }, (v.name || 'Xe') + ': ' + m)); });
    });
    host.appendChild(el('div', { class: 'tablewrap' }, el('table', null,
      el('thead', null, el('tr', null, ['Loại xe', 'Lòng thùng (dài × rộng × cao)', 'Thể tích', 'Tải trọng tối đa', 'Cước / chi phí chuyến', 'Số xe tối đa', ''].map(function (h) { return el('th', { text: h }); }))), tbody)));
    host.appendChild(notes);
    host.appendChild(el('p', { class: 'hint' }, 'Các xe mẫu chỉ là kích thước phổ biến để tham khảo, hãy sửa theo xe thực tế của công ty hoặc nhà xe thuê.'));
  }

  const PRESETS = [
    ['Xe 1,5 tấn', 3200, 1650, 1650, 1500], ['Xe 2,5 tấn', 4300, 1850, 1850, 2500], ['Xe 5 tấn', 6200, 2300, 2300, 5000],
    ['Xe 8 tấn', 7300, 2400, 2400, 8000], ['Container 20ft', 5898, 2352, 2393, 21500], ['Container 40ft', 12032, 2352, 2393, 26500],
  ];
  function addPresets() {
    PRESETS.forEach(function (x) {
      if (state.vehicles.some(function (v) { return v.name === x[0]; })) return;
      state.vehicles.push(Model.newVehicle({ name: x[0], unit: 'mm', L: x[1], W: x[2], H: x[3], payload: x[4] }));
    });
    save(); renderVehicles();
  }

  function openVehicleDialog(v) {
    const isNew = !state.vehicles.some(function (x) { return x.id === v.id; });
    const dlg = $('dlg');
    dlg.textContent = '';
    const preview = el('div', { class: 'preview' });
    const body = el('div', { class: 'formbody' });
    const saveBtn = el('button', { class: 'primary', onclick: function () {
      if (isNew) state.vehicles.push(v); else state.vehicles = state.vehicles.map(function (x) { return x.id === v.id ? v : x; });
      save(); dlg.close(); renderVehicles();
    } }, 'Lưu loại xe');
    function refresh() {
      preview.textContent = '';
      const r = Model.prepareVehicle(v);
      r.errors.forEach(function (m) { preview.appendChild(el('div', { class: 'note err' }, m)); });
      r.warnings.forEach(function (m) { preview.appendChild(el('div', { class: 'note warn' }, m)); });
      if (!r.errors.length) preview.appendChild(el('div', { class: 'note ok' }, 'Lòng thùng ' + nf(r.n.L, 0) + ' × ' + nf(r.n.W, 0) + ' × ' + nf(r.n.H, 0) + ' mm, thể tích ' + fmt.m3(r.n.volume) + ', tải trọng ' + fmt.kg(r.n.payload)));
      saveBtn.disabled = r.errors.length > 0;
    }
    function build() {
      body.textContent = '';
      const txt = function (key, label, hint, text) {
        const inp = el('input', { type: 'text', inputmode: text ? 'text' : 'decimal', value: v[key] === undefined ? '' : v[key], oninput: function () { v[key] = inp.value; refresh(); } });
        return el('label', { class: 'f' }, el('span', null, label), inp, hint ? el('small', null, hint) : null);
      };
      const sel = function (key, label, options) {
        const s = el('select', { onchange: function () { v[key] = s.value; build(); refresh(); } }, options.map(function (o) { return el('option', { value: o[0], selected: String(v[key]) === o[0] }, o[1]); }));
        return el('label', { class: 'f' }, el('span', null, label), s);
      };
      body.appendChild(el('div', { class: 'grid' }, txt('name', 'Tên loại xe', '', true), sel('mode', 'Cách nhập kích thước', [['dims', 'Biết kích thước lòng thùng'], ['volume', 'Chỉ biết thể tích']])));
      if (v.mode === 'volume') {
        body.appendChild(el('div', { class: 'grid' }, txt('volume', 'Thể tích (m³)'), txt('rL', 'Tỷ lệ dài'), txt('rW', 'Tỷ lệ rộng'), txt('rH', 'Tỷ lệ cao')));
        body.appendChild(el('p', { class: 'hint warnText' }, 'Mô phỏng 3D chính xác cần kích thước thực của thùng xe; kích thước ở đây chỉ là ước tính từ tỷ lệ.'));
      } else {
        body.appendChild(el('div', { class: 'grid' }, sel('unit', 'Đơn vị', [['mm', 'mm'], ['cm', 'cm'], ['m', 'm']]), txt('L', 'Dài lòng thùng (' + v.unit + ')'), txt('W', 'Rộng lòng thùng (' + v.unit + ')'), txt('H', 'Cao lòng thùng (' + v.unit + ')'), txt('volume', 'Thể tích bạn biết (m³)', 'Không bắt buộc, chỉ để đối chiếu')));
      }
      body.appendChild(el('div', { class: 'grid' }, txt('payload', 'Tải trọng tối đa (kg)'), txt('cost', 'Cước / chi phí chuyến (đồng)', 'Không bắt buộc'), txt('maxCount', 'Số xe tối đa', 'Để trống nếu không giới hạn')));
    }
    dlg.appendChild(el('h2', null, isNew ? 'Thêm loại xe' : 'Sửa loại xe'));
    dlg.appendChild(body);
    dlg.appendChild(preview);
    dlg.appendChild(el('div', { class: 'dlgfoot' }, el('button', { onclick: function () { dlg.close(); } }, 'Hủy'), saveBtn));
    build(); refresh();
    dlg.showModal();
  }

  /* ---------- Dữ liệu mẫu ---------- */
  function loadSample() {
    if (state.products.length && !confirm('Thay toàn bộ sản phẩm hiện có bằng dữ liệu mẫu?')) return;
    const s = state.settings;
    const mk = function (o) { return Model.newProduct(o); };
    const fit = function (o, frac) { // đặt số ống/pallet = một phần sức chứa tối đa
      const a = Solver.analyzeProduct(Object.assign({}, o, { perUnit: 1 }), s);
      return Math.max(1, Math.floor(a.info.maxPerPallet * frac));
    };
    const list = [
      mk({ code: 'FG10004-001', name: 'Ống 76x9x1200', customer: 'Bao bì Thủ Đô', qty: 4000, L: 1200, size: 38, weightMode: 'thickness', T: 9, orient: 'stand' }),
      mk({ code: 'FG10154-126', name: 'Ống 35x325x120g, nâu', customer: 'Bao bì Việt', qty: 25200, L: 325, size: 17.5, weightMode: 'kg', kg: 0.12, orient: 'stand' }),
      mk({ code: 'FG10145-004', name: 'Ống 77x7x1045, nâu', customer: 'Vinh Phú', qty: 1000, L: 1045, size: 38.5, weightMode: 'thickness', T: 7, orient: 'stand', stackable: true, maxTiers: 2 }),
      mk({ code: 'FG10016-001', name: 'Ống 203.5x185x500g', customer: 'De Kohn', qty: 2700, L: 185, size: 101.75, weightMode: 'kg', kg: 0.5, packType: 'bundle', perUnit: 20, bunL: 600, bunW: 420, bunH: 400, bunKg: 1, orient: 'stand' }),
      mk({ code: 'FG10465-003', name: 'Ống 76x5350x17.6kg', customer: 'MINHAN', qty: 120, L: 5350, size: 38, weightMode: 'kg', kg: 17.6, packType: 'loose', orient: 'lay' }),
    ];
    list.forEach(function (p) { if (p.packType === 'pallet') p.perUnit = fit(p, 0.9); });
    state.products = list;
    if (!state.vehicles.length) addPresets();
    save(); renderProducts();
    toast('Đã nạp dữ liệu mẫu (số liệu minh họa).');
  }

  /* ---------- Tab 3: Xếp thử một xe ---------- */
  let view = null;
  let worker = null;

  function runPack(units, veh, opts) {
    return new Promise(function (resolve) {
      const sync = function () { resolve(Solver.packVehicle(units, veh, opts)); };
      try {
        const src = $('pure-src').textContent + '\nonmessage=function(e){var d=e.data;postMessage(Solver.packVehicle(d.units,d.veh,d.opts));};';
        if (worker) worker.terminate();
        worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
        worker.onmessage = function (e) { resolve(e.data); };
        worker.onerror = function () { sync(); };
        worker.postMessage({ units: units, veh: veh, opts: opts });
      } catch (e) { sync(); }
    });
  }

  function renderPack() {
    const host = $('tab-pack');
    if (!host.dataset.built) {
      host.dataset.built = '1';
      host.appendChild(el('div', { class: 'packbar', id: 'packbar' }));
      host.appendChild(el('div', { class: 'packmain' },
        el('div', { class: 'viewcol' },
          el('div', { class: 'viewtools', id: 'viewtools' }),
          el('div', { id: 'canvas', class: 'canvas' }),
          el('div', { id: 'legend', class: 'legend' }),
          el('div', { id: 'pickinfo', class: 'pickinfo' })),
        el('div', { class: 'resultcol', id: 'results' })));
    }
    buildPackBar();
    if (!view && window.THREE && THREE.OrbitControls) {
      view = View3D.create($('canvas'), function (ud) { state.picked = ud ? ud.uid : null; showPick(); highlightRow(); });
      buildViewTools();
    } else if (!(window.THREE && THREE.OrbitControls) && !$('canvas').dataset.err) {
      $('canvas').dataset.err = '1';
      $('canvas').appendChild(el('div', { class: 'empty' }, 'Không tải được thư viện 3D (Three.js). Cần kết nối mạng lần đầu mở ứng dụng; các số liệu xếp xe vẫn dùng được.'));
    }
    if (view) setTimeout(view.resize, 0);
    renderResults();
  }

  function buildPackBar() {
    const bar = $('packbar');
    bar.textContent = '';
    const valid = state.vehicles.filter(function (v) { return Model.prepareVehicle(v).errors.length === 0; });
    if (!valid.some(function (v) { return v.id === state.vehId; })) state.vehId = valid.length ? valid[0].id : null;
    const vsel = el('select', { onchange: function () { state.vehId = vsel.value; } }, valid.map(function (v) { return el('option', { value: v.id, selected: v.id === state.vehId }, v.name); }));
    const ssel = el('select', { onchange: function () { state.scheme = ssel.value; redraw(); } },
      [['code', 'Tô màu theo mã hàng'], ['customer', 'Tô màu theo khách hàng'], ['weight', 'Tô màu theo khối lượng']].map(function (o) { return el('option', { value: o[0], selected: state.scheme === o[0] }, o[1]); }));
    const dchk = el('input', { type: 'checkbox', checked: state.detail, onchange: function () { state.detail = dchk.checked; redraw(); } });
    bar.appendChild(el('label', { class: 'inline' }, 'Xe: ', vsel));
    bar.appendChild(el('button', { class: 'primary', onclick: doPack }, 'Xếp thử'));
    bar.appendChild(ssel);
    bar.appendChild(el('label', { class: 'inline' }, dchk, ' Hiện từng ống'));
  }

  function buildViewTools() {
    const t = $('viewtools');
    t.textContent = '';
    [['iso', '3D'], ['front', 'Trước'], ['back', 'Sau'], ['top', 'Trên'], ['side', 'Bên']].forEach(function (x) {
      t.appendChild(el('button', { onclick: function () { view.setView(x[0]); } }, x[1]));
    });
    t.appendChild(el('span', { class: 'hint' }, 'Đầu thùng (sát ca-bin) ở bên trái, cửa sau ở bên phải khi nhìn từ bên hông.'));
  }

  async function doPack() {
    const v = state.vehicles.find(function (x) { return x.id === state.vehId; });
    if (!v) { toast('Chưa có xe hợp lệ. Vào tab "Xe" để thêm.'); return; }
    const veh = Model.prepareVehicle(v).n;
    let units = [];
    const skipped = [];
    state.products.forEach(function (p) {
      const a = analyze(p);
      if (a.errors.length) skipped.push((p.code || p.name) + ': ' + a.errors[0]);
      else units = units.concat(a.units);
    });
    if (!units.length) { toast('Chưa có sản phẩm hợp lệ để xếp. Kiểm tra tab "Sản phẩm".'); return; }
    $('results').textContent = 'Đang tính…';
    const t0 = performance.now();
    const r = await runPack(units, veh, { gap: state.settings.gap });
    const byId = {};
    units.forEach(function (u) { byId[u.id] = u; });
    state.result = { veh: veh, vehName: v.name, r: r, byId: byId, skipped: skipped, ms: performance.now() - t0, totalUnits: units.length };
    state.picked = null;
    renderResults();
    redraw();
  }

  function redraw() {
    const R = state.result;
    if (!view || !R) return;
    const legend = view.setScene({ vehicle: R.veh, placements: R.r.placements, unitsById: R.byId, scheme: state.scheme, detail: state.detail, cog: R.r.metrics.cog });
    view.setView('iso');
    const lg = $('legend');
    lg.textContent = '';
    if (state.scheme === 'weight') lg.appendChild(el('span', { class: 'lg' }, el('i', { class: 'gradient' }), ' Nhẹ → nặng (kg mỗi khối)'));
    else legend.forEach(function (c, k) { lg.appendChild(el('span', { class: 'lg' }, el('i', { style: 'background:#' + c.getHexString() }), ' ' + k)); });
    lg.appendChild(el('span', { class: 'lg' }, el('i', { class: 'dot' }), ' Trọng tâm hàng'));
    lg.appendChild(el('span', { class: 'lg' }, el('i', { class: 'ring' }), ' Tâm sàn xe'));
    if (state.detail) lg.appendChild(el('span', { class: 'lg hint' }, 'Chi tiết ống tối đa ' + nf(View3D.MAX_TUBES, 0) + ' ống, phần còn lại vẽ dạng khối.'));
    showPick();
  }

  function showPick() {
    const box = $('pickinfo');
    box.textContent = '';
    const R = state.result;
    if (!R || !state.picked) { box.appendChild(el('span', { class: 'hint' }, 'Bấm vào một khối trong hình 3D để xem chi tiết.')); return; }
    const pl = R.r.placements.find(function (p) { return p.uid === state.picked; });
    const u = R.byId[state.picked];
    if (!pl || !u) return;
    box.appendChild(el('div', null, el('b', null, (u.code || u.name) + (u.partial ? ' (lẻ)' : '')), ' · ' + (u.name || '')));
    box.appendChild(el('div', null, 'Khách: ' + (u.customer || '(chưa có)') + ' · ' + nf(u.tubes, 0) + ' ống · ' + fmt.kg(u.weight)));
    box.appendChild(el('div', null, 'Kích thước ' + nf(pl.l, 0) + ' × ' + nf(pl.w, 0) + ' × ' + nf(pl.h, 0) + ' mm · tầng ' + pl.tier));
    box.appendChild(el('div', null, 'Vị trí: cách đầu thùng ' + fmt.mm(pl.x) + ', cách thành trái ' + fmt.mm(pl.y) + ', cách sàn ' + fmt.mm(pl.z)));
  }

  function highlightRow() {
    document.querySelectorAll('#results tr[data-uid]').forEach(function (tr) { tr.classList.toggle('sel', tr.dataset.uid === state.picked); });
  }

  function renderResults() {
    const host = $('results');
    host.textContent = '';
    const R = state.result;
    if (!R) {
      host.appendChild(el('div', { class: 'empty' }, state.products.length && state.vehicles.length ? 'Chọn xe rồi bấm "Xếp thử" để xem kết quả.' : 'Cần có ít nhất một sản phẩm và một loại xe. Vào tab "Sản phẩm" và tab "Xe" để thêm (hoặc nạp dữ liệu mẫu).'));
      return;
    }
    const m = R.r.metrics;
    host.appendChild(el('h3', null, 'Kết quả xếp: ' + R.vehName));
    host.appendChild(el('div', { class: 'cards' },
      card('Lấp đầy thể tích', fmt.pct(m.volumePct), nf(m.volumeM3, 2) + ' m³ hàng'),
      card('Dùng tải trọng', fmt.pct(m.weightPct), fmt.kg(m.weightKg) + ' / ' + fmt.kg(R.veh.payload)),
      card('Lên xe', nf(m.count, 0) + ' / ' + nf(R.totalUnits, 0), 'khối pallet/kiện/rời'),
      card('Không lên được', nf(R.r.unplaced.length, 0), 'khối')));
    R.skipped.forEach(function (s) { host.appendChild(el('div', { class: 'note err' }, 'Bỏ qua do dữ liệu lỗi. ' + s)); });
    m.warnings.forEach(function (w) { host.appendChild(el('div', { class: 'note warn' }, w)); });
    host.appendChild(el('p', { class: 'hint' }, 'Đây là phương án gợi ý theo heuristic, không đảm bảo tối ưu tuyệt đối. Khi xếp thật cần kiểm tra chằng buộc và an toàn. Tính trong ' + nf(R.ms, 0) + ' ms.'));

    if (R.r.unplaced.length) {
      const groups = new Map();
      R.r.unplaced.forEach(function (x) { const k = (x.unit.code || x.unit.name) + '|' + x.reason; if (!groups.has(k)) groups.set(k, { u: x.unit, reason: x.reason, n: 0 }); groups.get(k).n++; });
      const tb = el('tbody');
      groups.forEach(function (g) { tb.appendChild(el('tr', null, el('td', null, g.u.code || g.u.name), el('td', { class: 'num' }, nf(g.n, 0)), el('td', null, g.reason))); });
      host.appendChild(el('h4', null, 'Hàng không lên được xe'));
      host.appendChild(el('div', { class: 'tablewrap' }, el('table', null, el('thead', null, el('tr', null, ['Mã hàng', 'Số khối', 'Lý do'].map(function (h) { return el('th', { text: h }); }))), tb)));
    }
    host.appendChild(el('h4', null, 'Danh sách chất hàng (theo thứ tự đặt)'));
    const tb = el('tbody');
    R.r.placements.forEach(function (p) {
      const u = R.byId[p.uid];
      tb.appendChild(el('tr', { 'data-uid': p.uid, onclick: function () { state.picked = p.uid; view && view.select(p.uid); showPick(); highlightRow(); } },
        el('td', { class: 'num' }, p.seq), el('td', null, (u.code || u.name) + (u.partial ? ' (lẻ)' : '')), el('td', null, u.customer || ''),
        el('td', { class: 'num' }, nf(u.tubes, 0)), el('td', { class: 'num' }, nf(u.weight, 1)),
        el('td', { class: 'num' }, nf(p.x, 0) + ' / ' + nf(p.y, 0) + ' / ' + nf(p.z, 0)), el('td', { class: 'num' }, p.tier)));
    });
    host.appendChild(el('div', { class: 'tablewrap tall' }, el('table', null,
      el('thead', null, el('tr', null, ['#', 'Mã hàng', 'Khách', 'Số ống', 'kg', 'Vị trí x / y / z (mm)', 'Tầng'].map(function (h) { return el('th', { text: h }); }))), tb)));
    highlightRow();
  }
  function card(title, big, sub) { return el('div', { class: 'card' }, el('div', { class: 'ct' }, title), el('div', { class: 'cb' }, big), el('div', { class: 'cs' }, sub)); }

  /* ---------- Tab và khởi động ---------- */
  function showTab(name) {
    document.querySelectorAll('.tabbtn').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === name); });
    document.querySelectorAll('.tab').forEach(function (t) { t.hidden = t.id !== 'tab-' + name; });
    if (name === 'products') renderProducts();
    if (name === 'vehicles') renderVehicles();
    if (name === 'pack') renderPack();
  }

  function init() {
    load();
    document.querySelectorAll('.tabbtn').forEach(function (b) { b.addEventListener('click', function () { showTab(b.dataset.tab); }); });
    showTab('products');
    window.__xeh = { state: state, showTab: showTab, doPack: doPack, loadSample: loadSample };
  }
  window.addEventListener('DOMContentLoaded', init);
})();

</script>
</body>

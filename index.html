<script>
/* LỚP HIỂN THỊ 3D (Three.js). Chỉ nhận dữ liệu thuần từ bộ giải, không tự tính xếp hàng.
 * Hệ trục Three: X = dọc thùng xe (đầu thùng ở X âm, cửa sau ở X dương), Y = chiều cao, Z = ngang thùng; đơn vị mét. */
const View3D = (function () {
  const MM = 0.001;
  const PALETTE = [0x4e79a7, 0xf28e2b, 0xe15759, 0x76b7b2, 0x59a14f, 0xedc948, 0xb07aa1, 0xff9da7, 0x9c755f, 0xbab0ac, 0x2f6f8f, 0x8cd17d];
  const MAX_TUBES = 60000;
  const EDGE = 0x2b2b2b, EDGE_SEL = 0xd62728, EDGE_HI = 0xff7f0e;

  function keyFor(scheme, u) {
    if (scheme === 'customer') return u.customer || '(chưa có khách)';
    if (scheme === 'stop') return typeof u.stop === 'number' ? 'Điểm giao ' + u.stop : '(chưa gán điểm giao)';
    return u.code || u.name;
  }

  function colorFor(scheme, unit, ctx) {
    if (scheme === 'weight') {
      const t = ctx.maxW > ctx.minW ? (unit.weight - ctx.minW) / (ctx.maxW - ctx.minW) : 0;
      return new THREE.Color().setHSL(0.6 - 0.6 * t, 0.7, 0.5);
    }
    const key = keyFor(scheme, unit);
    if (!ctx.keys.has(key)) ctx.keys.set(key, new THREE.Color(PALETTE[ctx.keys.size % PALETTE.length]));
    return ctx.keys.get(key);
  }

  function create(canvasHost, onPick) {
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf4f6f8);
    const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 200);
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.localClippingEnabled = true;
    canvasHost.appendChild(renderer.domElement);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 0.85));
    const sun = new THREE.DirectionalLight(0xffffff, 0.6);
    sun.position.set(6, 10, 4);
    scene.add(sun);

    // Mặt cắt lớp: giữ phần có X ≤ hằng số (cắt theo chiều dài) và Y ≤ hằng số (cắt theo chiều cao).
    const clipX = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 1000);
    const clipY = new THREE.Plane(new THREE.Vector3(0, -1, 0), 1000);
    const clips = [clipX, clipY];

    const group = new THREE.Group();
    scene.add(group);
    const raycaster = new THREE.Raycaster();
    let items = new Map(); // uid -> {mesh, edge, tubes, baseOpacity}
    let dims = { L: 6, W: 2, H: 2 };
    let selected = null;
    let freeSlab = null;
    let ro = null;

    function resize() {
      const w = canvasHost.clientWidth || 600, h = canvasHost.clientHeight || 400;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    if (window.ResizeObserver) { ro = new ResizeObserver(resize); ro.observe(canvasHost); }
    window.addEventListener('resize', resize);
    resize();

    let down = null;
    renderer.domElement.addEventListener('pointerdown', function (e) { down = [e.clientX, e.clientY]; });
    renderer.domElement.addEventListener('pointerup', function (e) {
      if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 4) return;
      const r = renderer.domElement.getBoundingClientRect();
      raycaster.setFromCamera({ x: ((e.clientX - r.left) / r.width) * 2 - 1, y: -((e.clientY - r.top) / r.height) * 2 + 1 }, camera);
      const vis = [];
      items.forEach(function (it) { if (it.mesh.visible) vis.push(it.mesh); });
      // Bỏ qua phần đã bị cắt lớp.
      const hit = raycaster.intersectObjects(vis, false).filter(function (h) { return clips.every(function (c) { return c.distanceToPoint(h.point) >= -1e-4; }); })[0];
      select(hit ? hit.object.userData.uid : null);
      if (onPick) onPick(hit ? hit.object.userData : null);
    });

    let hiSet = new Set();
    function paintEdges() {
      items.forEach(function (it, uid) {
        it.edge.material.color.set(uid === selected ? EDGE_SEL : hiSet.has(uid) ? EDGE_HI : EDGE);
      });
    }
    function select(uid) { selected = uid; paintEdges(); }

    function clear() {
      while (group.children.length) {
        const o = group.children.pop();
        o.traverse(function (c) { if (c.geometry) c.geometry.dispose(); if (c.material) c.material.dispose(); });
      }
      items = new Map();
      freeSlab = null;
    }

    /* data = {vehicle:{L,W,H}, placements, unitsById, scheme, detail, cog, freeLength} */
    function setScene(data) {
      clear();
      const V = data.vehicle;
      dims = { L: V.L * MM, W: V.W * MM, H: V.H * MM };
      const cx = -dims.L / 2, cz = -dims.W / 2;

      const floor = new THREE.Mesh(new THREE.PlaneGeometry(dims.L, dims.W), new THREE.MeshBasicMaterial({ color: 0xd9dee3, side: THREE.DoubleSide }));
      floor.rotation.x = -Math.PI / 2;
      floor.position.set(0, -0.002, 0);
      group.add(floor);
      const frame = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(dims.L, dims.H, dims.W)), new THREE.LineBasicMaterial({ color: 0x555d66 }));
      frame.position.set(0, dims.H / 2, 0);
      group.add(frame);
      // Vách đầu thùng (sát ca-bin) tô xanh nhạt để người xem biết hướng xe.
      const cab = new THREE.Mesh(new THREE.BoxGeometry(0.04, dims.H, dims.W), new THREE.MeshBasicMaterial({ color: 0x8aa4b8, transparent: true, opacity: 0.35 }));
      cab.position.set(cx - 0.02, dims.H / 2, 0);
      group.add(cab);

      const ctx = { keys: new Map(), minW: Infinity, maxW: 0 };
      data.placements.forEach(function (p) { const w = data.unitsById[p.uid].weight; ctx.minW = Math.min(ctx.minW, w); ctx.maxW = Math.max(ctx.maxW, w); });
      const legend = new Map();

      let tubeBudget = MAX_TUBES;
      data.placements.forEach(function (p) {
        const u = data.unitsById[p.uid];
        const color = colorFor(data.scheme, u, ctx);
        if (data.scheme !== 'weight') legend.set(keyFor(data.scheme, u), color);
        const showTubes = data.detail && u.detail && u.detail.n <= tubeBudget;
        const geo = new THREE.BoxGeometry(p.l * MM, p.h * MM, p.w * MM);
        const op = showTubes ? 0.12 : 1;
        const mat = new THREE.MeshLambertMaterial({ color: color, transparent: true, opacity: op, clippingPlanes: clips });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(cx + (p.x + p.l / 2) * MM, (p.z + p.h / 2) * MM, cz + (p.y + p.w / 2) * MM);
        const edge = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: EDGE, clippingPlanes: clips }));
        mesh.add(edge);
        mesh.userData = { uid: p.uid, seq: p.seq };
        group.add(mesh);
        let tubes = null;
        if (showTubes) {
          tubeBudget -= u.detail.n;
          tubes = tubeMesh(u, p, color, cx, cz);
          group.add(tubes);
        }
        items.set(p.uid, { mesh: mesh, edge: edge, tubes: tubes, baseOpacity: op });
      });
      if (data.cog) {
        const m = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 12), new THREE.MeshBasicMaterial({ color: 0xd62728, depthTest: false }));
        m.renderOrder = 10;
        m.position.set(cx + data.cog.x * MM, 0.07, cz + data.cog.y * MM);
        group.add(m);
        const c = new THREE.Mesh(new THREE.RingGeometry(0.08, 0.12, 32), new THREE.MeshBasicMaterial({ color: 0x1f77b4, side: THREE.DoubleSide, depthTest: false }));
        c.renderOrder = 10;
        c.rotation.x = -Math.PI / 2; c.position.set(0, 0.005, 0);
        group.add(c);
        // Đường nối tâm sàn và trọng tâm: càng dài càng lệch.
        const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0.01, 0), new THREE.Vector3(m.position.x, 0.01, m.position.z)]), new THREE.LineBasicMaterial({ color: 0xd62728, depthTest: false }));
        line.renderOrder = 10;
        group.add(line);
      }
      if (data.freeLength > 1) {
        const fl = data.freeLength * MM;
        freeSlab = new THREE.Mesh(new THREE.BoxGeometry(fl, dims.H, dims.W), new THREE.MeshBasicMaterial({ color: 0x2ca02c, transparent: true, opacity: 0.12, depthWrite: false }));
        freeSlab.position.set(dims.L / 2 - fl / 2, dims.H / 2, 0);
        group.add(freeSlab);
      }
      select(selected);
      setClip(1, 1);
      return legend;
    }

    // Vẽ từng ống bằng InstancedMesh để mượt. Ống đứng có trục dọc, ống nằm có trục theo chiều dài khối.
    function tubeMesh(u, p, color, cx, cz) {
      const det = u.detail;
      const pos = Solver.tubePositions(det);
      const geo = new THREE.CylinderGeometry(det.R * MM, det.R * MM, det.L * MM, 10);
      const mesh = new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial({ color: color.clone().offsetHSL(0, -0.1, 0.12), clippingPlanes: clips }), det.n);
      const m = new THREE.Matrix4(), s = new THREE.Vector3(1, 1, 1), t = new THREE.Vector3();
      let q = new THREE.Quaternion();
      if (det.kind === 'lay') {
        q.setFromAxisAngle(new THREE.Vector3(0, 0, 1), Math.PI / 2);
        if (p.rot) q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI / 2).multiply(q);
      }
      for (let i = 0; i < det.n; i++) {
        let lx = pos[i * 3], ly = pos[i * 3 + 1];
        const lz = pos[i * 3 + 2];
        if (p.rot) { const tmp = lx; lx = ly; ly = u.l - tmp; } // khối xoay 90° quanh trục đứng
        t.set(cx + (p.x + lx) * MM, (p.z + lz) * MM, cz + (p.y + ly) * MM);
        m.compose(t, q, s);
        mesh.setMatrixAt(i, m);
      }
      mesh.instanceMatrix.needsUpdate = true;
      return mesh;
    }

    // Cắt lớp: fx, fy trong khoảng 0..1 (1 = hiện toàn bộ). fx tính từ đầu thùng.
    function setClip(fx, fy) {
      clipX.constant = -dims.L / 2 + dims.L * fx + 1e-4;
      clipY.constant = dims.H * fy + 1e-4;
    }

    // Ẩn/hiện và làm nổi bật từng khối. fn(uid) -> {visible, highlight, dim}
    function applyState(fn) {
      hiSet = new Set();
      items.forEach(function (it, uid) {
        const st = fn(uid) || { visible: true };
        it.mesh.visible = st.visible !== false;
        if (it.tubes) it.tubes.visible = st.visible !== false;
        it.mesh.material.opacity = st.dim ? Math.min(0.25, it.baseOpacity) : it.baseOpacity;
        if (st.highlight) hiSet.add(uid);
      });
      paintEdges();
    }

    function showFree(on) { if (freeSlab) freeSlab.visible = !!on; }

    function setView(name) {
      const L = dims.L, W = dims.W, H = dims.H;
      const d = Math.max(L, W, H) * 1.9;
      const target = new THREE.Vector3(0, H * 0.4, 0);
      const views = {
        iso: [L * 0.55, H * 1.6 + W * 0.3, W * 1.5 + L * 0.35],
        back: [L / 2 + d, H * 0.5, 0.001],
        front: [-L / 2 - d, H * 0.5, 0.001],
        top: [0.001, d * 1.5, 0.001],
        side: [0, H * 0.5, W / 2 + d],
      };
      const v = views[name] || views.iso;
      camera.position.set(v[0], v[1], v[2]);
      controls.target.copy(target);
      controls.update();
    }

    function snapshot() { renderer.render(scene, camera); return renderer.domElement.toDataURL('image/png'); }

    let raf = 0;
    (function loop() { raf = requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();

    return {
      setScene: setScene, setView: setView, select: select, snapshot: snapshot, resize: resize,
      setClip: setClip, applyState: applyState, showFree: showFree,
      dispose: function () { cancelAnimationFrame(raf); if (ro) ro.disconnect(); renderer.dispose(); },
    };
  }

  return { create: create, PALETTE: PALETTE, MAX_TUBES: MAX_TUBES, keyFor: keyFor };
})();

</script>
<script>
/* GIAO DIỆN: các tab nhập sản phẩm, xe, và xếp thử một xe. Toàn bộ chữ hiển thị là tiếng Việt. */
(function () {
  'use strict';
  const STORE_KEY = 'xeh.v1';
  const nf = function (x, d) { return Number(x).toLocaleString('vi-VN', { maximumFractionDigits: d === undefined ? 1 : d }); };
  const fmt = {
    kg: function (x) { return nf(x, 1) + ' kg'; },
    mm: function (x) { return nf(x, 0) + ' mm'; },
    m3: function (x) { return nf(x, 2) + ' m³'; },
    pct: function (x) { return nf(x, 1) + '%'; },
  };

  /* Cửa ngõ cho các tab khác (đơn hàng, kế hoạch chuyến) dùng chung trạng thái và tiện ích. */
  const XEH = window.XEH = { tabs: {}, onInit: null };

  /* ---------- Trạng thái và lưu trữ ---------- */
  const state = {
    products: [], vehicles: [], settings: Model.defaultSettings(), vehId: null, scheme: 'code', detail: false, result: null, picked: null,
    orders: [], depot: Model.defaultDepot(), constraints: [], plan: null, planOpts: { objective: 'vehicles', useVeh: {}, maxCount: {} },
  };

  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify({ products: state.products, vehicles: state.vehicles, settings: state.settings, orders: state.orders, depot: state.depot, constraints: state.constraints, planOpts: state.planOpts })); } catch (e) { /* trình duyệt chặn lưu: bỏ qua */ } }
  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return false;
      const d = JSON.parse(raw);
      state.products = (d.products || []).map(function (p) { return Model.newProduct(p); });
      state.vehicles = (d.vehicles || []).map(function (v) { return Model.newVehicle(v); });
      state.settings = Object.assign(Model.defaultSettings(), d.settings || {});
      state.orders = (d.orders || []).map(function (o) { return Model.newOrder(o); });
      state.depot = Object.assign(Model.defaultDepot(), d.depot || {});
      state.constraints = d.constraints || [];
      state.planOpts = Object.assign({ objective: 'vehicles', useVeh: {}, maxCount: {} }, d.planOpts || {});
      return state.products.length + state.vehicles.length + state.orders.length > 0;
    } catch (e) { return false; }
  }

  /* ---------- Tiện ích DOM ---------- */
  function el(tag, attrs) {
    const e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      const v = attrs[k];
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
      else if (v === true) e.setAttribute(k, '');
      else if (v !== false && v !== null && v !== undefined) e.setAttribute(k, v);
    });
    const add = function (c) {
      if (c === null || c === undefined || c === false) return;
      if (Array.isArray(c)) { c.forEach(add); return; }
      e.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
    };
    for (let i = 2; i < arguments.length; i++) add(arguments[i]);
    return e;
  }
  const $ = function (id) { return document.getElementById(id); };
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove('show'); }, 3500);
  }

  /* ---------- Phân tích dữ liệu ---------- */
  let analysisCache = new Map();
  function analyze(p) {
    const key = JSON.stringify([p, state.settings]);
    if (!analysisCache.has(key)) {
      if (analysisCache.size > 300) analysisCache.clear();
      analysisCache.set(key, Solver.analyzeProduct(p, state.settings));
    }
    return analysisCache.get(key);
  }

  /* ---------- Tab 1: Sản phẩm ---------- */
  const PACK_NAME = { pallet: 'Xếp pallet', bundle: 'Đóng kiện', loose: 'Rời' };

  function renderProducts() {
    const host = $('tab-products');
    host.textContent = '';
    const s = state.settings;
    host.appendChild(el('div', { class: 'toolbar' },
      el('button', { class: 'primary', onclick: function () { openProductDialog(Model.newProduct()); } }, '+ Thêm sản phẩm'),
      el('button', { onclick: loadSample }, 'Nạp dữ liệu mẫu'),
      el('span', { class: 'spacer' }),
      settingInput('Tỷ trọng giấy (ước tính)', 'density', 'kg/m³'),
      settingInput('Khe hở giữa các khối', 'gap', 'mm')));
    if (!state.products.length) {
      host.appendChild(el('div', { class: 'empty' }, 'Chưa có sản phẩm nào. Bấm "+ Thêm sản phẩm" hoặc "Nạp dữ liệu mẫu" để thử nhanh.'));
      return;
    }
    const head = ['Mã hàng / tên', 'Điểm giao', 'Số ống', 'Đóng gói', 'kg / ống', 'Đầy', 'Lẻ (ống)', 'Tổng khối lượng', 'Thể tích khối', 'Trạng thái', ''];
    const tbody = el('tbody');
    const notes = el('div', { class: 'notes' });
    state.products.forEach(function (p) {
      const a = analyze(p);
      const i = a.info;
      const unitWord = p.packType === 'bundle' ? 'kiện' : p.packType === 'loose' ? 'khối' : 'pallet';
      const status = a.errors.length ? el('span', { class: 'tag err' }, 'Lỗi') : p.auto ? el('span', { class: 'tag warn' }, 'Tự tạo, cần kiểm tra') : a.warnings.length ? el('span', { class: 'tag warn' }, 'Cần xem') : el('span', { class: 'tag ok' }, 'Hợp lệ');
      tbody.appendChild(el('tr', null,
        el('td', null, el('b', null, p.code || ''), el('div', { class: 'sub' }, p.name || '')),
        el('td', null, String(p.stop || '').trim() ? 'Điểm ' + p.stop : '–', el('div', { class: 'sub' }, p.customer || '')),
        el('td', { class: 'num' }, nf(Model.num(p.qty) || 0, 0)),
        el('td', null, PACK_NAME[p.packType] + (p.packType !== 'loose' ? ' (' + (p.perUnit || '?') + ' ống/' + unitWord + ')' : ''), el('div', { class: 'sub' }, (p.orient === 'lay' || p.packType === 'loose') ? 'Xếp nằm' : 'Xếp đứng')),
        el('td', { class: 'num' }, i ? nf(i.tubeKg, 3) + (i.kgEstimated ? ' (ước tính)' : '') : '–'),
        el('td', { class: 'num' }, i ? nf(i.fullUnits, 0) + ' ' + unitWord : '–'),
        el('td', { class: 'num' }, i ? (i.partialTubes ? nf(i.partialTubes, 0) + ' (1 ' + unitWord + ' lẻ)' : '0') : '–'),
        el('td', { class: 'num' }, i ? fmt.kg(i.totalKg) : '–'),
        el('td', { class: 'num' }, i ? fmt.m3(i.volumeM3) : '–'),
        el('td', null, status),
        el('td', { class: 'actions' },
          el('button', { onclick: function () { openProductDialog(Object.assign({}, p)); } }, 'Sửa'),
          el('button', { onclick: function () { const c = Model.newProduct(Object.assign({}, p, { id: Model.uid('p'), code: (p.code || '') + ' (bản sao)' })); state.products.push(c); save(); renderProducts(); } }, 'Nhân bản'),
          el('button', { class: 'danger', onclick: function () { if (confirm('Xóa sản phẩm "' + (p.code || p.name) + '"?')) { state.products = state.products.filter(function (x) { return x.id !== p.id; }); save(); renderProducts(); } } }, 'Xóa'))));
      a.errors.forEach(function (m) { notes.appendChild(el('div', { class: 'note err' }, (p.code || p.name) + ': ' + m)); });
      a.warnings.forEach(function (m) { notes.appendChild(el('div', { class: 'note warn' }, (p.code || p.name) + ': ' + m)); });
    });
    host.appendChild(el('div', { class: 'tablewrap' }, el('table', null, el('thead', null, el('tr', null, head.map(function (h) { return el('th', { text: h }); }))), tbody)));
    host.appendChild(notes);
    host.appendChild(el('p', { class: 'hint' }, 'Khối lượng ống tính từ độ dày thành ống là ước tính (theo tỷ trọng giấy ở trên). Nhập kg thực tế nếu có để chính xác hơn.'));
  }

  function settingInput(label, key, unit) {
    const inp = el('input', { type: 'text', inputmode: 'decimal', value: state.settings[key], size: 6, onchange: function () {
      const v = Model.num(inp.value);
      if (!(v >= 0)) { toast('Giá trị "' + label + '" phải là số không âm.'); inp.value = state.settings[key]; return; }
      state.settings[key] = v; save(); renderProducts();
    } });
    return el('label', { class: 'inline' }, label + ' ', inp, ' ' + unit);
  }

  /* ---------- Hộp thoại sản phẩm ---------- */
  function openProductDialog(p) {
    const isNew = !state.products.some(function (x) { return x.id === p.id; });
    const dlg = $('dlg');
    dlg.textContent = '';
    const preview = el('div', { class: 'preview' });
    const body = el('div', { class: 'formbody' });
    function rerender() { buildProductForm(body, p, refresh); refresh(); }
    function refresh() {
      preview.textContent = '';
      const a = Solver.analyzeProduct(p, state.settings);
      a.errors.forEach(function (m) { preview.appendChild(el('div', { class: 'note err' }, m)); });
      a.warnings.forEach(function (m) { preview.appendChild(el('div', { class: 'note warn' }, m)); });
      if (a.info) {
        const i = a.info, u0 = a.units[0];
        const unitWord = a.n.packType === 'bundle' ? 'kiện' : a.n.packType === 'loose' ? 'khối' : 'pallet';
        const lines = [
          'Khối lượng 1 ống: ' + nf(i.tubeKg, 3) + ' kg' + (i.kgEstimated ? ' (ước tính từ độ dày và tỷ trọng giấy)' : ' (thực tế)'),
          'Tối đa mỗi ' + unitWord + ': ' + (i.maxPerPallet !== undefined ? nf(i.maxPerPallet, 0) + ' ống (cách xếp ' + i.layoutMode + ')' : nf(i.capacity, 0) + ' ống (theo quy cách nhập)'),
          'Kết quả: ' + nf(i.fullUnits, 0) + ' ' + unitWord + ' đầy' + (i.partialTubes ? ' + 1 ' + unitWord + ' lẻ ' + nf(i.partialTubes, 0) + ' ống' : '') + ' (tổng ' + fmt.kg(i.totalKg) + ')',
        ];
        if (u0) lines.push('Kích thước 1 ' + unitWord + ' đầy: ' + nf(u0.l, 0) + ' × ' + nf(u0.w, 0) + ' × ' + nf(u0.h, 0) + ' mm, nặng ' + fmt.kg(u0.weight));
        lines.forEach(function (t) { preview.appendChild(el('div', { class: 'note ok' }, t)); });
      }
      saveBtn.disabled = a.errors.length > 0;
    }
    const saveBtn = el('button', { class: 'primary', onclick: function () {
      if (isNew) state.products.push(p); else state.products = state.products.map(function (x) { return x.id === p.id ? p : x; });
      save(); dlg.close(); renderProducts();
    } }, 'Lưu sản phẩm');
    dlg.appendChild(el('h2', null, isNew ? 'Thêm sản phẩm (ống giấy)' : 'Sửa sản phẩm'));
    dlg.appendChild(body);
    dlg.appendChild(el('h3', null, 'Tính toán thử'));
    dlg.appendChild(preview);
    dlg.appendChild(el('div', { class: 'dlgfoot' }, el('button', { onclick: function () { dlg.close(); } }, 'Hủy'), saveBtn));
    rerender();
    dlg.showModal();
  }

  // Dựng biểu mẫu sản phẩm. onInput: chỉ cập nhật phần tính thử; đổi lựa chọn thì dựng lại biểu mẫu.
  function buildProductForm(body, p, onInput) {
    body.textContent = '';
    const again = function () { buildProductForm(body, p, onInput); onInput(); };
    const txt = function (key, label, hint, opts) {
      opts = opts || {};
      const inp = el('input', { type: 'text', inputmode: opts.text ? 'text' : 'decimal', value: p[key] === undefined ? '' : p[key], oninput: function () { p[key] = inp.value; onInput(); } });
      return el('label', { class: 'f' }, el('span', null, label), inp, hint ? el('small', null, hint) : null);
    };
    const sel = function (key, label, options, hint) {
      const s = el('select', { onchange: function () { p[key] = s.value; again(); } },
        options.map(function (o) { return el('option', { value: o[0], selected: String(p[key]) === o[0] }, o[1]); }));
      return el('label', { class: 'f' }, el('span', null, label), s, hint ? el('small', null, hint) : null);
    };
    const chk = function (key, label) {
      const c = el('input', { type: 'checkbox', checked: !!p[key], onchange: function () { p[key] = c.checked; again(); } });
      return el('label', { class: 'f check' }, c, el('span', null, label));
    };
    const section = function (title) { return el('h3', null, title); };
    const grid = function () { return el('div', { class: 'grid' }, Array.prototype.slice.call(arguments)); };
    const u = p.unit;
    body.appendChild(section('Thông tin hàng'));
    body.appendChild(grid(txt('code', 'Mã hàng', '', { text: true }), txt('name', 'Tên hàng', '', { text: true }), txt('customer', 'Khách hàng', 'Không bắt buộc', { text: true }), txt('qty', 'Số lượng ống (cái)'),
      txt('stop', 'Thứ tự điểm giao', '1 = giao đầu tiên (xếp gần cửa). Để trống nếu chưa biết.')));
    body.appendChild(section('Kích thước và khối lượng ống'));
    body.appendChild(grid(
      sel('unit', 'Đơn vị nhập kích thước', [['mm', 'mm'], ['cm', 'cm'], ['m', 'm']]),
      txt('L', 'Chiều dài ống (' + u + ')'),
      sel('sizeMode', 'Nhập theo', [['radius', 'Bán kính ngoài'], ['diameter', 'Đường kính ngoài']], 'Mặc định là bán kính. Đường kính = 2 × bán kính.'),
      txt('size', (p.sizeMode === 'diameter' ? 'Đường kính ngoài' : 'Bán kính ngoài') + ' (' + u + ')'),
      sel('weightMode', 'Khối lượng ống', [['thickness', 'Ước tính từ độ dày thành ống'], ['kg', 'Nhập kg thực tế / ống']]),
      p.weightMode === 'kg' ? txt('kg', 'Khối lượng thực tế (kg / ống)') : txt('T', 'Độ dày thành ống (' + u + ')')));
    body.appendChild(section('Cách xếp'));
    body.appendChild(grid(
      sel('orient', 'Hướng ống', [['stand', 'Xếp đứng (không được lật)'], ['lay', 'Xếp nằm']], p.packType === 'loose' ? 'Hàng rời luôn xếp nằm.' : ''),
      chk('stackable', 'Cho phép xếp chồng hàng khác lên'),

  /* ---------- Dữ liệu mẫu ---------- */

      mk({ code: 'FG10004-001', name: 'Ống 76x9x1200', customer: 'Bao bì Thủ Đô', stop: 3, qty: 1200, L: 1200, size: 38, weightMode: 'thickness', T: 9, orient: 'stand' }),

  XEH.state = state; XEH.el = el; XEH.$ = $; XEH.nf = nf; XEH.fmt = fmt; XEH.toast = toast; XEH.save = save; XEH.analyze = analyze; XEH.showTab = showTab; XEH.openResult = openResult;

  /* ---------- Tab 3: Xếp thử một xe ---------- */
  let view = null;
  let worker = null;
  // Trạng thái xem: lọc theo khách/điểm giao, cắt lớp, hoạt ảnh chất hàng / dỡ hàng theo tuyến.
  const vs = { hiddenCust: new Set(), hiddenStop: new Set(), clipX: 1, clipY: 1, showFree: true, anim: null };

  function runPack(units, veh, opts, onProgress) {
    return new Promise(function (resolve) {
      const sync = function () { resolve(Solver.packVehicle(units, veh, opts)); };
      try {
        const src = $('pure-src').textContent + '\nonmessage=function(e){var d=e.data;d.opts.onProgress=function(p){postMessage({progress:p});};var r=Solver.packVehicle(d.units,d.veh,d.opts);postMessage({result:r});};';
        if (worker) worker.terminate();
        worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
        worker.onmessage = function (e) { if (e.data.result) resolve(e.data.result); else if (onProgress) onProgress(e.data.progress); };
        worker.onerror = function () { sync(); };
        worker.postMessage({ units: units, veh: veh, opts: opts });
      } catch (e) { sync(); }
    });
  }

  async function doPack() {
    const v = state.vehicles.find(function (x) { return x.id === state.vehId; });
    if (!v) { toast('Chưa có xe hợp lệ. Vào tab "Xe" để thêm.'); return; }
    const veh = Model.prepareVehicle(v).n;
    let units = [];
    const skipped = [];
    state.products.forEach(function (p) {
      const a = analyze(p);
      if (a.errors.length) skipped.push((p.code || p.name) + ': ' + a.errors[0]);
      else units = units.concat(a.units);
    });
    if (!units.length) { toast('Chưa có sản phẩm hợp lệ để xếp. Kiểm tra tab "Sản phẩm".'); return; }
    $('btnPack').disabled = true;
    $('progress').textContent = 'Đang tính… 0%';
    const t0 = performance.now();
    const r = await runPack(units, veh, { gap: state.settings.gap }, function (p) { $('progress').textContent = 'Đang tính… ' + Math.round(p * 100) + '%'; });
    $('btnPack').disabled = false;
    $('progress').textContent = '';
    const byId = {};
    units.forEach(function (u) { byId[u.id] = u; });
    state.result = { veh: veh, vehName: v.name, r: r, byId: byId, skipped: skipped, ms: performance.now() - t0, totalUnits: units.length, grid: gridOf(r.placements) };
    state.picked = null;
    vs.anim = null; vs.hiddenCust.clear(); vs.hiddenStop.clear();
    renderResults();
    buildPlayer();
    buildFilters();
    redraw();

  // Đánh số hàng (từ đầu thùng ra cửa) và cột (từ thành trái) theo các tọa độ khác nhau.
  function gridOf(pl) {
    const xs = Array.from(new Set(pl.map(function (p) { return Math.round(p.x); }))).sort(function (a, b) { return a - b; });
    const ys = Array.from(new Set(pl.map(function (p) { return Math.round(p.y); }))).sort(function (a, b) { return a - b; });
    const g = {};
    pl.forEach(function (p) { g[p.uid] = { row: xs.indexOf(Math.round(p.x)) + 1, col: ys.indexOf(Math.round(p.y)) + 1 }; });
    return g;
  }

  const stopLabel = function (s) { return typeof s === 'number' ? 'Điểm ' + s : 'Chưa gán'; };

    const R = state.result;

    lastDrawn = R;

    lg.appendChild(el('span', { class: 'lg hint' }, 'Vách xanh nhạt = đầu thùng (sát ca-bin).'));
    if (state.detail) lg.appendChild(el('span', { class: 'lg hint' }, 'Chi tiết ống tối đa ' + nf(View3D.MAX_TUBES, 0) + ' ống, phần còn lại vẽ dạng khối.'));
    applyViewState();

  // Gộp bộ lọc và bước hoạt ảnh thành trạng thái hiển thị của từng khối.
  function applyViewState() {
    const R = state.result;
    if (!view || !R) return;
    const a = vs.anim;
    let shown = null, current = null, unloadStop;
    if (a && a.mode === 'load') {
      shown = new Set(R.r.loadOrder.slice(0, a.step));
      current = R.r.loadOrder[a.step - 1];
    }
    if (a && a.mode === 'unload') unloadStop = a.stops[a.step - 1];
    view.applyState(function (uid) {
      const u = R.byId[uid];
      const filtered = vs.hiddenCust.has(u.customer || '') || vs.hiddenStop.has(stopLabel(u.stop));
      if (filtered) return { visible: false };
      if (a && a.mode === 'load') return { visible: shown.has(uid), highlight: uid === current };
      if (a && a.mode === 'unload' && a.step > 0) {
        const s = u.stop;
        const before = function (x) { return a.stops.indexOf(stopLabel(x)) < a.stops.indexOf(unloadStop); };
        if (before(s)) return { visible: false };
        return { visible: true, highlight: stopLabel(s) === unloadStop, dim: stopLabel(s) !== unloadStop };
      }
      return { visible: true };
    });
    updateAnimLabel();
  }

  function stopsOf(R) {
    const set = new Set();
    R.r.placements.forEach(function (p) { set.add(R.byId[p.uid].stop); });
    return Array.from(set).sort(function (a, b) { return (typeof a === 'number' ? a : 1e9) - (typeof b === 'number' ? b : 1e9); }).map(stopLabel);
  }

  let timer = null;
  function buildPlayer() {

    if (!host) return;
    host.textContent = '';
    const R = state.result;
    if (!R || !R.r.placements.length) return;
    const a = vs.anim;
    const total = a ? (a.mode === 'load' ? R.r.loadOrder.length : a.stops.length) : 0;
    const go = function (step) { vs.anim.step = Math.max(0, Math.min(total, step)); applyViewState(); buildPlayer(); };
    const stop = function () { clearInterval(timer); timer = null; if (vs.anim) vs.anim.playing = false; };
    const start = function (mode) {
      stop();
      vs.anim = { mode: mode, step: mode === 'load' ? 0 : 1, playing: false, speed: (vs.anim && vs.anim.speed) || 1, stops: stopsOf(R) };
      applyViewState(); buildPlayer();
    };
    host.appendChild(el('button', { class: a && a.mode === 'load' ? 'on' : '', onclick: function () { start('load'); } }, 'Hoạt ảnh chất hàng'));
    host.appendChild(el('button', { class: a && a.mode === 'unload' ? 'on' : '', onclick: function () { start('unload'); } }, 'Dỡ hàng theo tuyến'));
    if (!a) return;
    host.appendChild(el('button', { title: 'Về đầu', onclick: function () { stop(); go(a.mode === 'load' ? 0 : 1); } }, '⏮'));
    host.appendChild(el('button', { title: 'Lùi một bước', onclick: function () { stop(); go(a.step - 1); } }, '◀'));
    host.appendChild(el('button', { title: a.playing ? 'Tạm dừng' : 'Phát', onclick: function () {
      if (a.playing) { stop(); buildPlayer(); return; }
      if (a.step >= total) a.step = a.mode === 'load' ? 0 : 1;
      a.playing = true;
      timer = setInterval(function () {
        if (!vs.anim || vs.anim.step >= total) { stop(); buildPlayer(); return; }
        go(vs.anim.step + 1);
      }, (a.mode === 'load' ? 700 : 1800) / a.speed);
      buildPlayer();
    } }, a.playing ? '⏸' : '▶'));
    host.appendChild(el('button', { title: 'Tới một bước', onclick: function () { stop(); go(a.step + 1); } }, '▶|'));
    const sp = el('select', { onchange: function () { a.speed = Number(sp.value); if (a.playing) { stop(); buildPlayer(); } } },
      [0.5, 1, 2, 4].map(function (x) { return el('option', { value: x, selected: a.speed === x }, 'Tốc độ ×' + String(x).replace('.', ',')); }));
    host.appendChild(sp);
    host.appendChild(el('span', { class: 'hint' }, 'Bước ' + a.step + ' / ' + total));
    host.appendChild(el('button', { onclick: function () { stop(); vs.anim = null; applyViewState(); buildPlayer(); } }, 'Thoát hoạt ảnh'));
  }

  function updateAnimLabel() {
    const lab = $('animlabel');
    const R = state.result, a = vs.anim;
    if (!lab) return;
    if (!a || !R) { lab.hidden = true; return; }
    lab.hidden = false;
    if (a.mode === 'load') {
      const uid = R.r.loadOrder[a.step - 1];
      if (!uid) { lab.textContent = 'Thùng trống. Bấm ▶ để xem chất hàng theo thứ tự (điểm giao cuối chất trước).'; return; }
      const u = R.byId[uid], g = R.grid[uid], p = R.r.placements.find(function (x) { return x.uid === uid; });
      lab.textContent = 'Bước ' + a.step + ': chất ' + (u.code || u.name) + (u.partial ? ' (lẻ)' : '') + ' · ' + (u.customer || '') + ' · ' + stopLabel(u.stop) + ' · hàng ' + g.row + ', cột ' + g.col + ', tầng ' + p.tier;
    } else {
      const s = a.stops[a.step - 1];
      const list = R.r.placements.filter(function (p) { return stopLabel(R.byId[p.uid].stop) === s; });
      const tubes = list.reduce(function (t, p) { return t + R.byId[p.uid].tubes; }, 0);
      const kg = list.reduce(function (t, p) { return t + R.byId[p.uid].weight; }, 0);
      const cust = Array.from(new Set(list.map(function (p) { return R.byId[p.uid].customer || '(chưa có khách)'; }))).join(', ');
      lab.textContent = s + ' (' + cust + '): dỡ ' + list.length + ' khối, ' + nf(tubes, 0) + ' ống, ' + fmt.kg(kg) + '. Khối viền cam là hàng dỡ ở điểm này.';
    }
  }

  function buildFilters() {
    const host = $('filters');
    if (!host) return;
    host.textContent = '';
    const R = state.result;
    if (!R || !R.r.placements.length) return;
    const custs = Array.from(new Set(R.r.placements.map(function (p) { return R.byId[p.uid].customer || ''; })));
    const stops = stopsOf(R);
    const group = function (title, values, set, label) {
      const g = el('div', { class: 'fgroup' }, el('span', { class: 'hint' }, title + ':'));
      values.forEach(function (v) {
        const c = el('input', { type: 'checkbox', checked: !set.has(v), onchange: function () { if (c.checked) set.delete(v); else set.add(v); applyViewState(); } });
        g.appendChild(el('label', { class: 'inline' }, c, ' ' + label(v)));
      });
      return g;
    };
    if (custs.length > 1) host.appendChild(group('Hiện theo khách', custs, vs.hiddenCust, function (v) { return v || '(chưa có khách)'; }));
    if (stops.length > 1) host.appendChild(group('Hiện theo điểm giao', stops, vs.hiddenStop, function (v) { return v; }));
  }

  function showPick() {
    const box = $('pickinfo');
    box.textContent = '';
    const R = state.result;
    if (!R || !state.picked) { box.appendChild(el('span', { class: 'hint' }, 'Bấm vào một khối trong hình 3D (hoặc một dòng trong danh sách) để xem chi tiết.')); return; }
    const pl = R.r.placements.find(function (p) { return p.uid === state.picked; });
    const u = R.byId[state.picked];
    if (!pl || !u) return;
    const g = R.grid[pl.uid];
    box.appendChild(el('div', null, el('b', null, (u.code || u.name) + (u.partial ? ' (lẻ)' : '')), ' · ' + (u.name || '')));
    box.appendChild(el('div', null, 'Khách: ' + (u.customer || '(chưa có)') + ' · ' + stopLabel(u.stop) + ' · ' + nf(u.tubes, 0) + ' ống · ' + fmt.kg(u.weight)));
    box.appendChild(el('div', null, 'Kích thước ' + nf(pl.l, 0) + ' × ' + nf(pl.w, 0) + ' × ' + nf(pl.h, 0) + ' mm · hàng ' + g.row + ', cột ' + g.col + ', tầng ' + pl.tier + (pl.loadAbove ? ' · đang chịu ' + fmt.kg(pl.loadAbove) + ' đè lên' : '')));
    box.appendChild(el('div', null, 'Vị trí: cách đầu thùng ' + fmt.mm(pl.x) + ', cách thành phải (nhìn từ cửa sau) ' + fmt.mm(pl.y) + ', cách sàn ' + fmt.mm(pl.z)));
  }

  function highlightRow() {
    document.querySelectorAll('#results tr[data-uid]').forEach(function (tr) { tr.classList.toggle('sel', tr.dataset.uid === state.picked); });
  }

  function renderResults() {
    const host = $('results');
    host.textContent = '';
    const R = state.result;
    if (!R) {
      host.appendChild(el('div', { class: 'empty' }, state.products.length && state.vehicles.length ? 'Chọn xe rồi bấm "Xếp thử" để xem kết quả.' : 'Cần có ít nhất một sản phẩm và một loại xe. Vào tab "Sản phẩm" và tab "Xe" để thêm (hoặc nạp dữ liệu mẫu).'));
      return;
    }
    const m = R.r.metrics;
    const th = function (cols) { return el('thead', null, el('tr', null, cols.map(function (h) { return el('th', { text: h }); }))); };
    host.appendChild(el('h3', null, R.title || ('Kết quả xếp: ' + R.vehName)));
    host.appendChild(el('div', { class: 'cards' },
      card('Lấp đầy thể tích', fmt.pct(m.volumePct), nf(m.volumeM3, 2) + ' m³ hàng / ' + nf(R.veh.volume, 2) + ' m³ thùng'),
      card('Dùng tải trọng', fmt.pct(m.weightPct), fmt.kg(m.weightKg) + ' / ' + fmt.kg(R.veh.payload)),
      card('Lên xe', nf(m.count, 0) + ' / ' + nf(R.totalUnits, 0), 'khối pallet/kiện/rời'),
      card('Không lên được', nf(R.r.unplaced.length, 0), 'khối')));
    if (m.cog) {
      const okX = Math.abs(m.cogOffX) <= 0.15, okY = Math.abs(m.cogOffY) <= 0.10;
      host.appendChild(el('div', { class: 'cogbar' },
        el('span', null, 'Trọng tâm hàng: '),
        el('span', { class: 'tag ' + (okX ? 'ok' : 'warn') }, 'dọc ' + (m.cogOffX >= 0 ? 'lệch về cửa ' : 'lệch về đầu thùng ') + fmt.pct(Math.abs(m.cogOffX * 100))),
        el('span', { class: 'tag ' + (okY ? 'ok' : 'warn') }, 'ngang ' + (m.cogOffY >= 0 ? 'lệch trái ' : 'lệch phải ') + fmt.pct(Math.abs(m.cogOffY * 100))),
        el('span', { class: 'hint' }, ' (nhìn từ cửa sau; ngưỡng 15% dọc, 10% ngang)')));
    }
    R.skipped.forEach(function (s) { host.appendChild(el('div', { class: 'note err' }, 'Bỏ qua do dữ liệu lỗi. ' + s)); });
    m.warnings.forEach(function (w) { host.appendChild(el('div', { class: /thứ tự dỡ/.test(w) ? 'note err' : 'note warn' }, w)); });

    // Khoảng trống còn lại
    const ex = R.r.extra || [];
    host.appendChild(el('h4', null, 'Khoảng trống còn lại'));
    host.appendChild(el('div', { class: 'note ok' }, (m.freeLength > 1 ? 'Phía cửa sau còn trống ' + fmt.mm(m.freeLength) + ' chiều dài thùng. ' : '') +
      (ex.length ? 'Ước tính còn chứa thêm: ' + ex.map(function (e) { return nf(e.count, 0) + (e.count >= 60 ? '+' : '') + ' ' + (e.kind === 'bundle' ? 'kiện' : e.kind === 'loose' ? 'khối' : 'pallet') + ' ' + e.code + ' (giới hạn bởi ' + e.limitedBy + ')'; }).join('; ') + '. Mỗi con số tính riêng cho từng loại, không cộng dồn.' : 'Không còn chỗ cho thêm khối nào của các loại hàng hiện có.')));

    // Tổng hợp theo điểm giao
    const byStop = new Map();
    R.r.placements.forEach(function (p) {
      const u = R.byId[p.uid];
      const k = stopLabel(u.stop);
      if (!byStop.has(k)) byStop.set(k, { stop: u.stop, cust: new Set(), n: 0, tubes: 0, kg: 0 });
      const s = byStop.get(k);
      s.cust.add(u.customer || '(chưa có khách)'); s.n++; s.tubes += u.tubes; s.kg += u.weight;
    });
    if (byStop.size) {
      const tb = el('tbody');
      Array.from(byStop.entries()).sort(function (a, b) { return (typeof a[1].stop === 'number' ? a[1].stop : 1e9) - (typeof b[1].stop === 'number' ? b[1].stop : 1e9); }).forEach(function (e) {
        tb.appendChild(el('tr', null, el('td', null, e[0]), el('td', null, Array.from(e[1].cust).join(', ')), el('td', { class: 'num' }, nf(e[1].n, 0)), el('td', { class: 'num' }, nf(e[1].tubes, 0)), el('td', { class: 'num' }, fmt.kg(e[1].kg))));
      });
      host.appendChild(el('h4', null, 'Tổng hợp theo điểm giao (thứ tự dỡ)'));
      host.appendChild(el('div', { class: 'tablewrap' }, el('table', null, th(['Điểm giao', 'Khách', 'Số khối', 'Số ống', 'Khối lượng']), tb)));
    }

    if (R.r.unplaced.length) {
      const groups = new Map();
      R.r.unplaced.forEach(function (x) { const k = (x.unit.code || x.unit.name) + '|' + x.reason; if (!groups.has(k)) groups.set(k, { u: x.unit, reason: x.reason, n: 0 }); groups.get(k).n++; });
      const tb = el('tbody');
      groups.forEach(function (g) { tb.appendChild(el('tr', null, el('td', null, g.u.code || g.u.name), el('td', { class: 'num' }, nf(g.n, 0)), el('td', null, g.reason))); });
      host.appendChild(el('h4', null, 'Hàng không lên được xe'));
      host.appendChild(el('div', { class: 'tablewrap' }, el('table', null, th(['Mã hàng', 'Số khối', 'Lý do']), tb)));
    }
    host.appendChild(el('h4', null, 'Thứ tự chất hàng (điểm giao cuối chất trước, từ đầu thùng ra cửa)'));
    const tb = el('tbody');
    const plById = {};
    R.r.placements.forEach(function (p) { plById[p.uid] = p; });
    R.r.loadOrder.forEach(function (uid, i) {
      const p = plById[uid], u = R.byId[uid], g = R.grid[uid];
      tb.appendChild(el('tr', { 'data-uid': uid, class: p.relaxed ? 'relaxed' : '', onclick: function () { state.picked = uid; if (view) view.select(uid); showPick(); highlightRow(); } },
        el('td', { class: 'num' }, i + 1), el('td', null, (u.code || u.name) + (u.partial ? ' (lẻ)' : '')), el('td', null, u.customer || ''), el('td', null, stopLabel(u.stop)),
        el('td', { class: 'num' }, nf(u.tubes, 0)), el('td', { class: 'num' }, nf(u.weight, 1)),
        el('td', { class: 'num' }, g.row + ' / ' + g.col + ' / ' + p.tier)));
    });
    host.appendChild(el('div', { class: 'tablewrap tall' }, el('table', null, th(['#', 'Mã hàng', 'Khách', 'Điểm giao', 'Số ống', 'kg', 'Hàng / cột / tầng']), tb)));
    host.appendChild(el('p', { class: 'hint' }, 'Hàng đánh số từ đầu thùng (1) ra cửa sau; cột 1 sát thành bên phải khi đứng ở cửa sau nhìn vào; tầng 1 là sàn. Đây là phương án gợi ý theo heuristic, không đảm bảo tối ưu tuyệt đối; khi xếp thật cần kiểm tra chằng buộc và an toàn. Tính trong ' + nf(R.ms, 0) + ' ms.'));
    highlightRow();
  }
  function card(title, big, sub) { return el('div', { class: 'card' }, el('div', { class: 'ct' }, title), el('div', { class: 'cb' }, big), el('div', { class: 'cs' }, sub)); }

  /* ---------- Tab và khởi động ---------- */
  function showTab(name) {
    document.querySelectorAll('.tabbtn').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === name); });
    document.querySelectorAll('.tab').forEach(function (t) { t.hidden = t.id !== 'tab-' + name; });
    if (name === 'products') renderProducts();
    if (name === 'vehicles') renderVehicles();
    if (name === 'pack') renderPack();
    if (XEH.tabs[name]) XEH.tabs[name]();
  }

  // Mở một kết quả xếp (ví dụ một chuyến trong kế hoạch) trong tab xem 3D.
  function openResult(res) {
    state.result = res; state.picked = null;
    vs.anim = null; vs.hiddenCust.clear(); vs.hiddenStop.clear();
    showTab('pack');
  }

  function init() {
    load();
    document.querySelectorAll('.tabbtn').forEach(function (b) { b.addEventListener('click', function () { showTab(b.dataset.tab); }); });
    showTab('products');
    window.__xeh = { state: state, showTab: showTab, doPack: doPack, loadSample: loadSample };
    if (XEH.onInit) XEH.onInit();
  }
  window.addEventListener('DOMContentLoaded', init);
})();

<script>
/* GIAO DIỆN TAB "ĐƠN HÀNG": nhập tay từng đơn, nhập Excel/CSV có ánh xạ cột, điểm giao, kho xuất phát, ràng buộc ghép/tách. */
(function () {
  'use strict';
  const X = window.XEH;
  const el = X.el, $ = X.$, nf = X.nf, state = X.state;
  const MAPS_KEY = 'xeh.maps';

  /* ---------- Phân tích đơn thành các khối xếp xe ---------- */
  const infoCache = new Map();
  function findProduct(code) {
    const k = Model.normText(code);
    return state.products.find(function (p) { return Model.normText(p.code) === k; }) || null;
  }

  // Trả {errors, warnings, units, kg, blocks}. Đơn lỗi thì không đưa vào kế hoạch.
  function orderInfo(o) {
    const key = JSON.stringify([o, state.products, state.settings]);
    if (infoCache.has(key)) return infoCache.get(key);
    const v = Model.validateOrder(o);
    const res = { errors: v.errors.slice(), warnings: v.warnings.slice(), units: [], kg: 0, blocks: 0, tubes: 0 };
    (o.lines || []).forEach(function (l, i) {
      const code = String(l.code || '').trim();
      if (!code) return;
      const p = findProduct(code);
      if (!p) { res.errors.push('Chưa có sản phẩm mã "' + code + '" trong tab Sản phẩm.'); return; }
      const q = Model.num(l.qty);
      if (!(q >= 1)) return;
      const a = X.analyze(Object.assign({}, p, { qty: q, customer: o.customer, stop: '' }));
      if (a.errors.length) { res.errors.push('Sản phẩm "' + code + '": ' + a.errors[0]); return; }
      a.units.forEach(function (u) { res.units.push(Object.assign({}, u, { id: o.id + '|' + i + '|' + u.id, customer: o.customer, stop: null })); });
      res.tubes += q;
    });
    res.kg = res.units.reduce(function (s, u) { return s + u.weight; }, 0);
    res.blocks = res.units.length;
    if (infoCache.size > 400) infoCache.clear();
    infoCache.set(key, res);
    return res;
  }
  X.orderInfo = orderInfo;
  X.findProduct = findProduct;

  /* ---------- Tab ---------- */
  function render() {
    const host = $('tab-orders');
    host.textContent = '';
    host.appendChild(el('div', { class: 'toolbar' },
      el('button', { class: 'primary', onclick: function () { openOrderDialog(Model.newOrder({ lines: [{ code: '', qty: '' }] })); } }, '+ Thêm đơn'),
      el('button', { onclick: openImportDialog }, 'Nhập từ Excel / CSV'),
      el('button', { class: 'danger', onclick: function () { if (state.orders.length && confirm('Xóa toàn bộ ' + state.orders.length + ' đơn hàng?')) { state.orders = []; state.constraints = []; state.plan = null; X.save(); render(); } } }, 'Xóa tất cả đơn'),
      el('span', { class: 'spacer' }),
      el('span', { class: 'hint' }, 'Tick ở cột "Dùng" để đưa đơn vào kế hoạch chuyến.')));
    host.appendChild(depotPanel());
    if (!state.orders.length) {
      host.appendChild(el('div', { class: 'empty' }, 'Chưa có đơn hàng nào. Bấm "+ Thêm đơn" hoặc "Nhập từ Excel / CSV" (file lịch giao hàng).'));
    } else {
      const tb = el('tbody');
      const notes = el('div', { class: 'notes' });
      state.orders.forEach(function (o) {
        const i = orderInfo(o);
        const hasLoc = String(o.lat).trim() !== '' && String(o.lng).trim() !== '';
        const status = i.errors.length ? el('span', { class: 'tag err' }, 'Lỗi') : o.pickup ? el('span', { class: 'tag warn' }, 'Khách tự lấy') : i.warnings.length ? el('span', { class: 'tag warn' }, 'Cần xem') : el('span', { class: 'tag ok' }, 'Hợp lệ');
        const chk = el('input', { type: 'checkbox', checked: !!o.include, onchange: function () { o.include = chk.checked; X.save(); } });
        tb.appendChild(el('tr', null,
          el('td', null, chk),
          el('td', null, el('b', null, o.customer || '(chưa có tên)'), el('div', { class: 'sub' }, o.no || '')),
          el('td', null, o.region || '–', el('div', { class: 'sub' }, hasLoc ? nf(Model.num(o.lat), 4) + ', ' + nf(Model.num(o.lng), 4) : 'chưa có tọa độ')),
          el('td', { class: 'num' }, nf((o.lines || []).length, 0) + ' dòng'),
          el('td', { class: 'num' }, i.errors.length ? '–' : nf(i.blocks, 0)),
          el('td', { class: 'num' }, i.errors.length ? '–' : X.fmt.kg(i.kg)),
          el('td', null, o.date || '–', el('div', { class: 'sub' }, (o.from || o.to) ? (o.from || '') + ' – ' + (o.to || '') : '')),
          el('td', null, status),
          el('td', { class: 'actions' },
            el('button', { onclick: function () { openOrderDialog(JSON.parse(JSON.stringify(o))); } }, 'Sửa'),
            el('button', { class: 'danger', onclick: function () { if (confirm('Xóa đơn của "' + o.customer + '"?')) { state.orders = state.orders.filter(function (x) { return x.id !== o.id; }); state.constraints = state.constraints.filter(function (c) { return c.a !== o.id && c.b !== o.id; }); X.save(); render(); } } }, 'Xóa'))));
        i.errors.forEach(function (m) { notes.appendChild(el('div', { class: 'note err' }, (o.customer || 'Đơn') + ': ' + m)); });
        i.warnings.forEach(function (m) { notes.appendChild(el('div', { class: 'note warn' }, (o.customer || 'Đơn') + ': ' + m)); });
        if (o.note) notes.appendChild(el('div', { class: 'note ok' }, (o.customer || 'Đơn') + ' (ghi chú): ' + o.note));
      });
      host.appendChild(el('div', { class: 'tablewrap tall2' }, el('table', null,
        el('thead', null, el('tr', null, ['Dùng', 'Khách / số đơn', 'Khu vực / tọa độ', 'Dòng hàng', 'Số khối', 'Khối lượng', 'Ngày giao', 'Trạng thái', ''].map(function (h) { return el('th', { text: h }); }))), tb)));
      const det = el('details', { class: 'notesbox' }, el('summary', null, 'Lỗi, cảnh báo và ghi chú của đơn'), notes);
      host.appendChild(det);
    }
    host.appendChild(constraintsPanel());
  }
  X.tabs.orders = render;

  /* ---------- Kho xuất phát, hệ số đường, khoảng cách nhập tay ---------- */
  function depotPanel() {
    const d = state.depot, s = state.settings;
    const f = function (key, label, w) {
      const inp = el('input', { type: 'text', value: d[key], size: w || 12, onchange: function () { d[key] = inp.value; X.save(); } });
      return el('label', { class: 'inline' }, label + ' ', inp);
    };
    const rf = el('input', { type: 'text', value: s.roadFactor, size: 4, onchange: function () {
      const v = Model.num(rf.value);
      if (!(v >= 1)) { X.toast('Hệ số đường phải từ 1 trở lên (ví dụ 1,3).'); rf.value = s.roadFactor; return; }
      s.roadFactor = v; X.save();
    } });
    const mt = el('textarea', { rows: 3, placeholder: 'Mỗi dòng: khu vực A, khu vực B, số km (ví dụ: Bắc Ninh, Hải Phòng, 125)', onchange: function () {
      const r = Model.parseMatrix(mt.value);
      s.matrixText = mt.value; X.save();
      msg.textContent = r.errors.length ? r.errors.join(' ') : (r.list.length ? 'Đã đọc ' + r.list.length + ' khoảng cách nhập tay.' : '');
      msg.className = r.errors.length ? 'note err' : 'hint';
    } });
    mt.value = s.matrixText || '';
    const msg = el('div', { class: 'hint' });
    return el('details', { class: 'depot', open: !String(d.lat).trim() && !String(d.region).trim() },
      el('summary', null, 'Kho xuất phát và cách tính khoảng cách'),
      el('div', { class: 'grid2' }, f('name', 'Tên kho', 16), f('address', 'Địa chỉ', 24), f('lat', 'Vĩ độ', 9), f('lng', 'Kinh độ', 9), f('region', 'Khu vực', 12)),
      el('div', { class: 'hint' }, 'Khoảng cách giữa hai điểm lấy theo thứ tự: số km nhập tay bên dưới, tọa độ (đường chim bay × hệ số đường), cùng khu vực (5 km), còn lại ước tính 60 km. Tất cả đều là ước tính, không phải quãng đường thực.'),
      el('label', { class: 'inline' }, 'Hệ số đường ', rf, ' (đường thực ≈ chim bay × hệ số)'),
      el('div', null, el('div', { class: 'hint' }, 'Khoảng cách nhập tay giữa các khu vực (không bắt buộc):'), mt, msg));
  }

  /* ---------- Ràng buộc ghép / tách ---------- */
  const CTYPES = { together: 'Bắt buộc đi chung xe', apart: 'Không được đi chung xe', solo: 'Phải đi xe riêng', first: 'Điểm giao phải giao đầu tiên' };
  function constraintsPanel() {
    const wrap = el('div', { class: 'cpanel' }, el('h3', null, 'Ràng buộc ghép / tách'));
    const nm = function (id) { const o = state.orders.find(function (x) { return x.id === id; }); return o ? o.customer : '(đơn đã xóa)'; };
    if (state.constraints.length) {
      const ul = el('ul', null);
      state.constraints.forEach(function (c, i) {
        const text = c.type === 'together' ? 'Đơn "' + nm(c.a) + '" bắt buộc đi chung đơn "' + nm(c.b) + '"'
          : c.type === 'apart' ? 'Đơn "' + nm(c.a) + '" không đi chung đơn "' + nm(c.b) + '"'
            : c.type === 'solo' ? 'Đơn "' + nm(c.a) + '" phải đi xe riêng' : 'Điểm giao "' + nm(c.a) + '" phải giao đầu tiên';
        ul.appendChild(el('li', null, text + ' ', el('button', { class: 'danger', onclick: function () { state.constraints.splice(i, 1); X.save(); render(); } }, 'Xóa')));
      });
      wrap.appendChild(ul);
    } else wrap.appendChild(el('p', { class: 'hint' }, 'Chưa có ràng buộc nào. Kết quả tối ưu sẽ tôn trọng các ràng buộc anh đặt ở đây.'));
    if (state.orders.length) {
      const opt = function (selected) { return state.orders.map(function (o) { return el('option', { value: o.id, selected: o.id === selected }, o.customer || o.id); }); };
      const ty = el('select', { onchange: sync }, Object.keys(CTYPES).map(function (k) { return el('option', { value: k }, CTYPES[k]); }));
      const a = el('select', null, opt()), b = el('select', null, opt(state.orders[1] && state.orders[1].id));
      const lblB = el('span', null, ' và ');
      function sync() { const two = ty.value === 'together' || ty.value === 'apart'; b.hidden = !two; lblB.hidden = !two; }
      sync();
      wrap.appendChild(el('div', { class: 'toolbar' }, ty, a, lblB, b, el('button', { onclick: function () {
        if ((ty.value === 'together' || ty.value === 'apart') && a.value === b.value) { X.toast('Hãy chọn hai đơn khác nhau.'); return; }
        const c = { type: ty.value, a: a.value, b: (ty.value === 'together' || ty.value === 'apart') ? b.value : '' };
        if (state.constraints.some(function (x) { return x.type === c.type && x.a === c.a && x.b === c.b; })) { X.toast('Ràng buộc này đã có.'); return; }
        if (c.type === 'together' && state.constraints.some(function (x) { return x.type === 'apart' && ((x.a === c.a && x.b === c.b) || (x.a === c.b && x.b === c.a)); })) { X.toast('Hai đơn này đang bị ràng buộc "không đi chung", xóa ràng buộc đó trước.'); return; }
        if (c.type === 'apart' && state.constraints.some(function (x) { return x.type === 'together' && ((x.a === c.a && x.b === c.b) || (x.a === c.b && x.b === c.a)); })) { X.toast('Hai đơn này đang bị ràng buộc "bắt buộc đi chung", xóa ràng buộc đó trước.'); return; }
        state.constraints.push(c); X.save(); render();
      } }, 'Thêm ràng buộc')));
    }
    return wrap;
  }

  /* ---------- Hộp thoại đơn ---------- */
  let map = null;
  function openOrderDialog(o) {
    const isNew = !state.orders.some(function (x) { return x.id === o.id; });
    const dlg = $('dlg');
    dlg.textContent = '';
    const body = el('div', { class: 'formbody' });
    const preview = el('div', { class: 'preview' });
    const saveBtn = el('button', { class: 'primary', onclick: function () {
      if (isNew) state.orders.push(o); else state.orders = state.orders.map(function (x) { return x.id === o.id ? o : x; });
      X.save(); dlg.close(); render();
    } }, 'Lưu đơn');
    function refresh() {
      preview.textContent = '';
      const i = orderInfo(o);
      i.errors.forEach(function (m) { preview.appendChild(el('div', { class: 'note err' }, m)); });
      i.warnings.forEach(function (m) { preview.appendChild(el('div', { class: 'note warn' }, m)); });
      if (!i.errors.length) preview.appendChild(el('div', { class: 'note ok' }, 'Đơn có ' + nf(i.tubes, 0) + ' ống, ' + nf(i.blocks, 0) + ' khối pallet/kiện/rời, nặng ' + X.fmt.kg(i.kg)));
      saveBtn.disabled = i.errors.some(function (m) { return !/^Chưa có sản phẩm mã|^Sản phẩm "/.test(m); }) ;
    }
    const txt = function (key, label, hint, text) {
      const inp = el('input', { type: 'text', inputmode: text ? 'text' : 'decimal', value: o[key] === undefined ? '' : o[key], oninput: function () { o[key] = inp.value; refresh(); } });
      inp.dataset.key = key;
      return el('label', { class: 'f' }, el('span', null, label), inp, hint ? el('small', null, hint) : null);
    };
    function build() {
      body.textContent = '';
      body.appendChild(el('h3', null, 'Khách hàng và điểm giao'));
      body.appendChild(el('div', { class: 'grid' }, txt('customer', 'Khách hàng', '', true), txt('no', 'Số đơn (không bắt buộc)', '', true), txt('address', 'Địa chỉ giao', '', true), txt('region', 'Khu vực (tỉnh/huyện/KCN)', 'Dùng để gom khi chưa có tọa độ', true), txt('lat', 'Vĩ độ', 'Ví dụ 20,86'), txt('lng', 'Kinh độ', 'Ví dụ 106,68')));
      body.appendChild(el('div', { class: 'toolbar' }, el('button', { onclick: function () { toggleMap(); } }, 'Chọn điểm giao trên bản đồ'), el('span', { class: 'hint' }, 'Hoặc nhập tọa độ trực tiếp ở trên.')));
      body.appendChild(el('div', { id: 'mapbox', class: 'mapbox', hidden: true }));
      body.appendChild(el('h3', null, 'Thời gian giao (không bắt buộc)'));
      body.appendChild(el('div', { class: 'grid' }, txt('date', 'Ngày giao (yyyy-mm-dd)', '', true), txt('from', 'Giờ giao từ', 'Ví dụ 08:00', true), txt('to', 'Giờ giao đến', 'Ví dụ 11:00', true), txt('note', 'Ghi chú', '', true)));
      body.appendChild(el('h3', null, 'Dòng hàng'));
      const tb = el('tbody');
      o.lines.forEach(function (l, i) {
        const sel = el('select', { onchange: function () { l.code = sel.value; refresh(); } },
          [el('option', { value: '' }, '(chọn mã hàng)')].concat(state.products.map(function (p) { return el('option', { value: p.code, selected: Model.normText(p.code) === Model.normText(l.code) }, p.code + (p.name ? ' · ' + p.name : '')); })));
        if (l.code && !findProduct(l.code)) sel.appendChild(el('option', { value: l.code, selected: true }, l.code + ' (chưa có trong thư viện)'));
        const q = el('input', { type: 'text', inputmode: 'numeric', value: l.qty, size: 8, oninput: function () { l.qty = q.value; refresh(); } });
        tb.appendChild(el('tr', null, el('td', null, sel), el('td', null, q), el('td', null, el('button', { class: 'danger', onclick: function () { o.lines.splice(i, 1); build(); refresh(); } }, 'Xóa'))));
      });
      body.appendChild(el('div', { class: 'tablewrap' }, el('table', null, el('thead', null, el('tr', null, ['Mã hàng', 'Số lượng ống', ''].map(function (h) { return el('th', { text: h }); }))), tb)));
      body.appendChild(el('button', { onclick: function () { o.lines.push({ code: '', qty: '' }); build(); refresh(); } }, '+ Thêm dòng hàng'));
      if (!state.products.length) body.appendChild(el('p', { class: 'hint warnText' }, 'Chưa có sản phẩm nào trong thư viện. Vào tab "Sản phẩm" để thêm trước.'));
    }
    function toggleMap() {
      const box = $('mapbox');
      if (!window.L) { X.toast('Không tải được bản đồ (cần mạng). Hãy nhập tọa độ trực tiếp.'); return; }
      box.hidden = !box.hidden;
      if (box.hidden) return;
      if (map) { map.remove(); map = null; }
      const lat = Model.num(o.lat), lng = Model.num(o.lng);
      const dl = Model.num(state.depot.lat), dg = Model.num(state.depot.lng);
      const center = isFinite(lat) && isFinite(lng) ? [lat, lng] : isFinite(dl) && isFinite(dg) ? [dl, dg] : [16, 106];
      map = L.map(box).setView(center, isFinite(lat) || isFinite(dl) ? 10 : 5);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap' }).addTo(map);
      let marker = isFinite(lat) && isFinite(lng) ? L.marker([lat, lng]).addTo(map) : null;
      map.on('click', function (e) {
        o.lat = e.latlng.lat.toFixed(5); o.lng = e.latlng.lng.toFixed(5);
        if (marker) marker.setLatLng(e.latlng); else marker = L.marker(e.latlng).addTo(map);
        body.querySelectorAll('input[data-key="lat"]').forEach(function (i) { i.value = o.lat; });
        body.querySelectorAll('input[data-key="lng"]').forEach(function (i) { i.value = o.lng; });
        refresh();
      });
      setTimeout(function () { map.invalidateSize(); }, 50);
    }
    dlg.appendChild(el('h2', null, isNew ? 'Thêm đơn hàng' : 'Sửa đơn hàng'));
    dlg.appendChild(body);
    dlg.appendChild(preview);
    dlg.appendChild(el('div', { class: 'dlgfoot' }, el('button', { onclick: function () { dlg.close(); } }, 'Hủy'), saveBtn));
    build(); refresh();
    dlg.addEventListener('close', function () { if (map) { map.remove(); map = null; } }, { once: true });
    dlg.showModal();
  }

  /* ---------- Nhập Excel / CSV ---------- */
  function loadMaps() { try { return JSON.parse(localStorage.getItem(MAPS_KEY) || '{}'); } catch (e) { return {}; } }
  function saveMap(sig, m) { try { const all = loadMaps(); all[sig] = m; localStorage.setItem(MAPS_KEY, JSON.stringify(all)); } catch (e) { /* bỏ qua */ } }

  function openImportDialog() {
    const dlg = $('dlg');
    dlg.textContent = '';
    dlg.appendChild(el('h2', null, 'Nhập đơn từ Excel / CSV'));
    const body = el('div', { class: 'formbody' });
    dlg.appendChild(body);
    dlg.appendChild(el('div', { class: 'dlgfoot' }, el('button', { onclick: function () { dlg.close(); } }, 'Đóng')));
    const file = el('input', { type: 'file', accept: '.xlsx,.xls,.csv', id: 'importFile', onchange: function () { if (file.files[0]) readFile(file.files[0]); } });
    body.appendChild(el('p', null, 'Chọn file lịch giao hàng (mỗi dòng một dòng hàng, tên khách có thể chỉ ghi ở dòng đầu của nhóm). Sau đó chọn cột nào là cột nào; cách chọn sẽ được nhớ cho lần sau.'));
    body.appendChild(file);
    const out = el('div', { id: 'importOut' });
    body.appendChild(out);
    dlg.showModal();

    function readFile(f) {
      if (!window.XLSX) { out.textContent = ''; out.appendChild(el('div', { class: 'note err' }, 'Không tải được thư viện đọc Excel (SheetJS). Cần kết nối mạng lần đầu mở ứng dụng, hoặc lưu file dạng CSV rồi thử lại.')); return; }
      const rd = new FileReader();
      rd.onload = function () {
        try {
          const wb = XLSX.read(new Uint8Array(rd.result), { type: 'array', cellDates: false });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
          showMapping(rows, f.name);
        } catch (e) {
          out.textContent = '';
          out.appendChild(el('div', { class: 'note err' }, 'Không đọc được file này. Kiểm tra đây là file Excel (.xlsx, .xls) hoặc CSV hợp lệ. Chi tiết: ' + e.message));
        }
      };
      rd.readAsArrayBuffer(f);
    }

    function showMapping(rows, fname) {
      out.textContent = '';
      if (!rows.length) { out.appendChild(el('div', { class: 'note err' }, 'File không có dữ liệu.')); return; }
      let h = Importer.findHeader(rows);
      if (h < 0) h = 0;
      const headers = rows[h].map(function (c) { return String(c === undefined || c === null ? '' : c).trim(); });
      const sig = headers.map(Model.normText).join('|');
      const saved = loadMaps()[sig];
      const mapping = saved || Importer.guessMapping(headers);
      const opts = { replace: true, createProducts: true };
      out.appendChild(el('div', { class: 'note ok' }, 'Đọc ' + (rows.length - h - 1) + ' dòng dữ liệu từ "' + fname + '", dòng tiêu đề là dòng ' + (h + 1) + '.' + (saved ? ' Đã dùng cách chọn cột đã lưu.' : '')));
      const colName = function (i) { return String.fromCharCode(65 + (i % 26)) + ': ' + (headers[i] || '(trống)'); };
      const grid = el('div', { class: 'grid' });
      Importer.FIELDS.forEach(function (f) {
        const sel = el('select', { onchange: function () { mapping[f[0]] = Number(sel.value); preview(); } },
          [el('option', { value: -1 }, '(không dùng)')].concat(headers.map(function (_, i) { return el('option', { value: i, selected: mapping[f[0]] === i }, colName(i)); })));
        grid.appendChild(el('label', { class: 'f' }, el('span', null, f[1] + (f[0] === 'customer' || f[0] === 'code' || f[0] === 'qty' ? ' (bắt buộc)' : '')), sel));
      });
      out.appendChild(grid);
      const rep = el('input', { type: 'checkbox', checked: true, onchange: function () { opts.replace = rep.checked; } });
      const cp = el('input', { type: 'checkbox', checked: true, onchange: function () { opts.createProducts = cp.checked; } });
      out.appendChild(el('div', null, el('label', { class: 'inline' }, rep, ' Thay thế toàn bộ đơn hiện có'), el('br'), el('label', { class: 'inline' }, cp, ' Tự tạo sản phẩm cho mã hàng chưa có (đoán kích thước từ tên hàng, cần kiểm tra lại)')));
      const pv = el('div', { class: 'preview' });
      out.appendChild(pv);
      const btn = el('button', { class: 'primary', onclick: doImport }, 'Nhập vào ứng dụng');
      out.appendChild(btn);
      function preview() {
        pv.textContent = '';
        const miss = ['customer', 'code', 'qty'].filter(function (k) { return !(mapping[k] >= 0); });
        btn.disabled = miss.length > 0;
        if (miss.length) { pv.appendChild(el('div', { class: 'note err' }, 'Cần chọn cột cho: ' + miss.map(function (k) { return Importer.FIELDS.find(function (f) { return f[0] === k; })[1]; }).join(', ') + '.')); return; }
        const r = Importer.buildOrders(rows, h, mapping, state.products);
        const s = r.stats;
        pv.appendChild(el('div', { class: 'note ok' }, 'Sẽ tạo ' + r.orders.length + ' đơn (theo khách hàng) từ ' + s.rows + ' dòng hàng. Ngày giao đọc từ tiêu đề: ' + (r.date || 'không thấy') + '.'));
        if (s.skippedZero) pv.appendChild(el('div', { class: 'note warn' }, 'Bỏ qua ' + s.skippedZero + ' dòng có số lượng 0 hoặc trống.'));
        if (s.pickup) pv.appendChild(el('div', { class: 'note warn' }, s.pickup + ' đơn ghi "đến lấy" (khách tự đến lấy) sẽ được bỏ tick, không đưa vào kế hoạch giao xe.'));
        if (r.newProducts.length) pv.appendChild(el('div', { class: 'note warn' }, 'Có ' + r.newProducts.length + ' mã hàng chưa có trong thư viện: đoán được kích thước cho ' + s.guessed + ' mã, chưa đoán được ' + s.notGuessed + ' mã (sẽ báo lỗi cho đến khi anh nhập kích thước).'));
      }
      function doImport() {
        const r = Importer.buildOrders(rows, h, mapping, state.products);
        saveMap(sig, mapping);
        if (opts.createProducts) r.newProducts.forEach(function (p) { state.products.push(p); });
        if (opts.replace) { state.orders = r.orders; state.constraints = []; state.plan = null; } else state.orders = state.orders.concat(r.orders);
        X.save();
        dlg.close();
        render();
        X.toast('Đã nhập ' + r.orders.length + ' đơn' + (opts.createProducts && r.newProducts.length ? ' và tạo ' + r.newProducts.length + ' sản phẩm cần kiểm tra' : '') + '.');
      }
      preview();
    }
  }
  X.openImport = openImportDialog;
})();

</script>
<script>
/* GIAO DIỆN TAB "KẾ HOẠCH CHUYẾN": chọn mục tiêu và loại xe, chạy gom đơn trong Web Worker, xem từng chuyến và mở 3D. */
(function () {
  'use strict';
  const X = window.XEH;
  const el = X.el, $ = X.$, nf = X.nf, state = X.state;
  const OBJ = { vehicles: 'Ít xe nhất', distance: 'Ngắn quãng đường nhất', cost: 'Rẻ chi phí nhất', stops: 'Ít điểm dừng nhất' };
  const OBJ_HINT = {
    vehicles: 'Dùng ít chuyến xe nhất có thể; khi bằng nhau thì chọn phương án ngắn hơn.',
    distance: 'Chạy tổng quãng đường ngắn nhất, có thể phải dùng nhiều xe hơn.',
    cost: 'Cần nhập cước/chi phí mỗi chuyến cho từng loại xe (tab Xe). Nếu thiếu, hệ thống dùng mục tiêu "ít xe nhất".',
    stops: 'Gom các đơn cùng điểm giao để giảm số lần dừng.',
  };
  let worker = null, running = false, host = null, ui = {};

  function depotLoc() {
    const d = state.depot, lat = Model.num(d.lat), lng = Model.num(d.lng);
    const loc = { key: 'depot', region: String(d.region || '').trim(), address: String(d.address || '').trim() };
    if (isFinite(lat) && isFinite(lng) && String(d.lat).trim() !== '' && String(d.lng).trim() !== '') { loc.lat = lat; loc.lng = lng; }
    return loc;
  }

  // Dựng dữ liệu đầu vào cho bộ lập kế hoạch từ các đơn đang tick.
  function buildInput() {
    const skipped = [];
    const orders = [];
    state.orders.forEach(function (o) {
      if (!o.include) return;
      const info = X.orderInfo(o);
      if (info.errors.length) { skipped.push((o.customer || 'Đơn') + ': ' + info.errors[0]); return; }
      if (!info.units.length) { skipped.push((o.customer || 'Đơn') + ': không có dòng hàng nào hợp lệ.'); return; }
      orders.push({ id: o.id, name: o.customer || o.no || o.id, customer: o.customer, loc: Model.orderLoc(o), units: info.units });
    });
    const vehicles = [];
    const vskip = [];
    state.vehicles.forEach(function (v) {
      if (state.planOpts.useVeh[v.id] === false) return;
      const pv = Model.prepareVehicle(Object.assign({}, v, { maxCount: state.planOpts.maxCount[v.id] !== undefined ? state.planOpts.maxCount[v.id] : v.maxCount }));
      if (pv.errors.length) { vskip.push((v.name || 'Xe') + ': ' + pv.errors[0]); return; }
      vehicles.push(pv.n);
    });
    const ids = new Set(orders.map(function (o) { return o.id; }));
    const constraints = state.constraints.filter(function (c) { return ids.has(c.a) && (!c.b || ids.has(c.b)); });
    return {
      skipped: skipped.concat(vskip),
      input: {
        orders: orders, depot: depotLoc(), vehicles: vehicles, constraints: constraints, objective: state.planOpts.objective,
        settings: { gap: state.settings.gap, roadFactor: state.settings.roadFactor, matrix: Model.parseMatrix(state.settings.matrixText).list },
        budgetMs: 8000,
      },
    };
  }

  function stopWorker() { if (worker) { worker.terminate(); worker = null; } }

  // Chạy bộ gom đơn trong Web Worker. Trả Promise<{plan, stopped}>; cancelJob() dừng và lấy phương án tạm tốt nhất.
  let job = null;
  function solve(input, onProgress) {
    return new Promise(function (resolve) {
      let best = null, done = false;
